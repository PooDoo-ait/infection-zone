<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감염 구역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&display=swap">
<style>
:root,[data-theme=light]{
  --page:#cfc6b2;--bg:#e6dcc6;--panel:#dcd0b6;--btn:#d9ccb1;--btnh:#cfc1a4;--ink:#2a241e;--ink2:#4a4038;--muted:#5e5449;
  --line:#c4b79c;--line2:#a89a7f;--red:#a3261f;--redbg:#f0cdc6;--redtx:#8a1f19;--dis:#6f655a;--s1:#8a8070;--s2:#cbbfa6;
  --tag:#c4b79c;--shade:rgba(42,36,30,.55);--dk:#6a1d17;--uf:#3a1c18;--ufbg:#f3e2da;
  --m-paper:#ece3cf;--m-ink:#2a241e;--m-muted:#6b6156;--m-geo:#8a7f6c;--m-faint:#c2b59a;--m-red:#a3261f;--m-water:#b9cad2;--m-waterE:#97adb8;--m-roadE:#b5a888;--m-green:#d3d6b4;--m-greenE:#9aa27a;
}
[data-theme=dark]{
  --page:#100e0c;--bg:#1b1815;--panel:#24201c;--btn:#2a2521;--btnh:#342e29;--ink:#ece4d8;--ink2:#cfc5b6;--muted:#a59b8d;
  --line:#3a332c;--line2:#4a433b;--red:#e0625a;--redbg:#4a2522;--redtx:#f3b1ab;--dis:#8f857a;--s1:#6b645c;--s2:#2a2622;
  --tag:#3a332c;--shade:rgba(0,0,0,.65);--dk:#e79a92;--uf:#f6ece4;--ufbg:#1e1412;
  --m-paper:#24201c;--m-ink:#ece4d8;--m-muted:#a59b8d;--m-geo:#8f857a;--m-faint:#5a534b;--m-red:#e0625a;--m-water:#3c4a52;--m-waterE:#55656e;--m-roadE:#6b645c;--m-green:#4b5a40;--m-greenE:#6f7d5c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);overflow-x:hidden}
body{font-family:'Noto Serif KR',serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.pen{font-family:'Nanum Pen Script',cursive}
#app{max-width:480px;margin:0 auto;overflow-x:hidden;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding:20px 18px 16px;gap:14px;position:relative}
/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;gap:8px}
.hd .who{font-size:22px;color:var(--red);line-height:1}
.hd .day{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
.hd .crisisLbl{font-size:13px;font-weight:700;color:var(--red);letter-spacing:1px}
.hd .rt{display:flex;align-items:center;gap:2px}
.clock{font-size:19px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock.ff{color:var(--red)}
.ibtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);padding:0}
/* gauge */
.gauge{display:flex;flex-direction:column;gap:5px}
.gbar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.gnight{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--s1) 0 2px,var(--s2) 2px 6px)}
.gtrack{position:relative;padding:4px 0}
.gfill{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);opacity:.45}
.gico{position:absolute;top:50%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink2);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.gico.n{border-color:var(--red);color:var(--red)}
.dtchip{position:absolute;right:0;top:-9px;background:var(--bg);padding:0 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--red);pointer-events:none;animation:dtc 1.8s ease-out forwards}
@keyframes dtc{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#sky{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .8s}
#sky.on{opacity:1}
.skyband{position:absolute;left:0;right:0;top:0;height:5px;transition:background 1s}
.glbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.glbl .r{color:var(--red)}
.gseg{display:grid;gap:3px}
.gseg div{height:12px;background:var(--line)}
.gseg div.on{background:var(--ink2)}
.gseg div.now{background:var(--red)}
/* stat row */
.strow{display:flex;gap:10px;align-items:stretch}
.strow{cursor:pointer;-webkit-tap-highlight-color:transparent}
.strow:active .stbox,.strow:active .sbox{opacity:.8}
.strow:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.sx{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.sx-t{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.sx-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:15px}
.sx-h b{font-variant-numeric:tabular-nums}
.sx-b{height:4px;background:var(--line)}.sx-b i{display:block;height:4px;background:var(--ink)}
.sx-l{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55;display:flex;flex-direction:column;gap:3px}
.sx-l li.bad{color:var(--red)}

.stbox{width:128px;flex-shrink:0;background:var(--panel);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.st .l{display:flex;justify-content:space-between;font-size:12px}
.st .l span{color:var(--muted)}
.st.low .l, .st.low .l span{color:var(--red)}
.st .b{height:3px;background:var(--line);margin-top:3px}
.st .b i{display:block;height:3px;background:var(--ink);transition:width .65s cubic-bezier(.2,.7,.2,1),background .3s}
.odo{display:inline-flex;height:16px;line-height:16px;font-size:13px;overflow:hidden;font-variant-numeric:tabular-nums;transition:color .3s}
.odo .dg{display:inline-block;width:.62em;height:16px;overflow:hidden;text-align:center;transition:width .3s}
.odo .sp{display:flex;flex-direction:column}
.odo .sp i{font-style:normal;height:16px;line-height:16px;display:block;flex-shrink:0}
.st.down .odo,.st.down .l span{color:var(--red)}
.st.down .b i{background:var(--red)}
.st.up .b i{background:var(--ink2)}
.st.low .b i{background:var(--red)}
.st.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:none}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.sbox{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sbox .h{font-size:11px;color:var(--muted);letter-spacing:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--tag);color:var(--ink)}
.tag.bad{background:var(--redbg);color:var(--redtx)}
.sinfo{font-size:12px;color:var(--ink2);line-height:1.5}
/* body */
.loc{font-size:13px;color:var(--muted)}
.story{display:flex;flex-direction:column;gap:12px;flex-grow:1}
.story p{margin:0;font-size:16px;line-height:1.85;word-break:keep-all}
.story p.em{font-weight:700}
.mevs{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2)}.mevs b{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--red);color:var(--bg);font-size:10px;margin-right:4px}
.who .wdt{font-size:.62em;margin-left:8px;white-space:nowrap;opacity:.85;font-family:inherit}
.unlock{display:flex;flex-direction:column;gap:4px;margin:6px 0 2px;padding:12px 14px;border:1px solid var(--red);border-radius:12px}.unlock .pen{color:var(--red);font-size:20px}.unlock b{font-size:17px}
.nomap{display:flex;flex-direction:column;gap:6px;padding:4px 2px}.nomap .nm-h{font-size:18px;color:var(--muted);margin-top:6px}.nomap .nm-l{font-size:22px;line-height:1.35;color:var(--ink)}
.story p.me{font-family:'Noto Serif KR',serif;font-style:normal;font-weight:700;color:var(--ink2);padding-left:10px;border-left:2px solid var(--line)}
.me-btn{border:1px dashed var(--line);background:transparent}
.me-btn span:first-child{font-family:'Noto Serif KR',serif;font-weight:700}
.ch-btn .pc.nx{background:var(--ink);color:var(--bg)}
.pgdots{display:flex;gap:6px;justify-content:center;padding-top:2px}
.pgdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pgdots[data-pg="1"] i:first-child,.pgdots[data-pg="2"] i:last-child{background:var(--ink2)}
[hidden]{display:none!important}

.banner{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--panel);color:var(--ink2);align-self:flex-start}
.banner.bad{background:var(--redbg);color:var(--redtx)}
.memo{align-self:flex-end;max-width:100%;color:var(--ink);font-size:24px;line-height:1.25}
.memo.red{color:var(--red)}
.memo .w{position:relative;display:inline-block}
.memo .w svg{position:absolute;left:-4px;top:50%;overflow:visible}
.memo .ln{white-space:normal;max-width:100%}
.memo .s1{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.memo .s2{position:relative;display:inline-block}
.memo .s2:before,.memo .s2:after{content:'';position:absolute;left:-2px;right:-4px;height:2px;background:var(--red)}
.memo .s2:before{top:44%;transform:rotate(-2deg)}
.memo .s2:after{top:60%;transform:rotate(1.5deg)}
.memo .ch{display:inline-block}
.dark-ink{color:var(--dk)}
/* choices */
.choices{display:flex;flex-direction:column;gap:8px}
.ch-btn{text-align:left;min-height:50px;padding:11px 14px;background:var(--btn);border:none;border-radius:10px;color:var(--ink);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.45}
.ch-btn:active{background:var(--btnh)}
.ch-btn .pc{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--tag);white-space:nowrap}
.ch-btn .pc.lo{background:var(--redbg);color:var(--redtx)}
.ch-btn .meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ch-btn .tm{font-size:11px;color:var(--muted);white-space:nowrap}
.ch-btn[disabled]{background:transparent;border:1px dashed var(--line2);color:var(--dis);cursor:default;flex-direction:column;align-items:flex-start;gap:2px}
.ch-btn .why{font-size:12px;display:flex;align-items:center;gap:4px}
.ch-btn.rolling .pc{background:var(--red);color:var(--bg)}
.ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.pill{min-height:44px;padding:0 14px;background:transparent;border:1px solid var(--line2);border-radius:22px;color:var(--ink);font-size:13px}
.lnk{min-height:44px;padding:0 10px;background:transparent;border:none;color:var(--muted);font-size:13px}
/* overlays */
.ov{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:16px 16px 0 0;padding:18px 18px 22px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:20px;font-weight:900}
.sheet .sub{font-size:13px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.slot{min-height:74px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--ink);padding:6px 4px;text-align:center}
.slot.empty{background:transparent;border-style:dashed;color:var(--dis)}
.slot.sel{outline:2px solid var(--red)}
.slot svg{width:22px;height:22px}
.idet{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.idet .nm{font-weight:700}
.idet .ds{font-size:14px;color:var(--ink2);line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-weight:400}
.btn.red{background:var(--red);color:#fff}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
/* urgent */
#app.urgent{background:var(--ufbg);border:3px solid #c8443c;color:var(--uf);justify-content:space-between;padding:24px 18px 20px}
.u-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.u-lbl{font-size:13px;font-weight:700;color:#e0625a;letter-spacing:4px}
.u-num{font-size:88px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.u-sub{font-size:13px;opacity:.8}
.u-bar{height:8px;background:rgba(200,68,60,.25);border-radius:4px;overflow:hidden}
.u-bar i{display:block;height:8px;background:#e0625a;transition:width 1s linear}
.u-txt{display:flex;flex-direction:column;gap:12px;justify-content:center;flex-grow:1;text-align:center}
.u-txt p{margin:0;font-size:16px;line-height:1.8;word-break:keep-all}
.u-txt p.em{font-size:19px;font-weight:700}
.u-btn{text-align:left;min-height:58px;padding:12px 16px;background:rgba(200,68,60,.16);border:1px solid rgba(200,68,60,.5);border-radius:12px;color:inherit;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.u-btn .pc{font-size:12px;font-weight:400;padding:3px 8px;border-radius:10px;background:rgba(200,68,60,.3);white-space:nowrap}
.u-btn[disabled]{opacity:.55;font-weight:400;flex-direction:column;align-items:flex-start}
.u-note{font-size:19px;text-align:center;opacity:.8}
/* title / ending */
.center{flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.big{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:0}
.lead{font-size:15px;line-height:1.8;color:var(--ink2);margin:0;word-break:keep-all}
.menu{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--panel);text-align:left;color:var(--ink);font-size:14px}
.card .n{font-size:20px;font-weight:900}
.card .m{font-size:13px;color:var(--muted);line-height:1.6}
.card[disabled]{opacity:.55;cursor:default}
.rec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.rec dt{color:var(--muted)}.rec dd{margin:0}
.hint{font-size:21px;color:var(--red)}
.cx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cx{border:1px solid var(--line2);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:3px;min-height:58px;background:var(--panel)}
.cx.no{background:transparent;border-style:dashed;color:var(--dis)}
.cx .v{font-size:11px;color:var(--muted)}
.cx.hid{border-color:var(--red)}
.ctag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--red);color:var(--bg);white-space:nowrap;align-self:flex-end}
.ctag.w{background:var(--tag);color:var(--ink2)}
.ntabs{display:flex;border-bottom:1px solid var(--line2)}
.ntab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.ntab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--red)}
.mtop{display:flex;gap:10px;align-items:center}
.seg{flex:1;display:flex;background:var(--panel);border-radius:18px;padding:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:7px 0;border-radius:16px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.evsw{display:flex;align-items:center;gap:6px;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0}
.evsw .sw{width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative;display:inline-block;transition:background .2s}
.evsw .sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:left .2s}
.evsw.on .sw{background:var(--red)}.evsw.on .sw i{left:16px}
.mapbox{border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.noev .mhatch{display:none}
.mlg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.mlg span{display:flex;align-items:center;gap:4px}
.mlg .d{width:9px;height:9px;border-radius:50%;display:inline-block}
.mlg .d.v{background:var(--ink)}.mlg .d.r{border:1.3px dashed var(--muted)}
.mlg .ln{width:18px;border-top:2px dashed var(--red);display:inline-block}
.mlg .x{color:var(--red);font-size:11px}.mlg .q{color:var(--red);font-size:16px;line-height:1}
.mnow{font-size:20px;color:var(--red)}
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;flex-direction:column;gap:2px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.mc-d{font-size:12px;color:var(--muted)}
.mc-t{font-size:22px;line-height:1.25;color:var(--ink)}.mc-t.red{color:var(--red)}.mc-t s{color:var(--red)}
.lg{display:flex;flex-direction:column;gap:2px}
.lg-day{font-size:22px;color:var(--red);margin-top:10px;border-bottom:1px solid var(--line);padding-bottom:2px}
.lg-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px dashed var(--line)}
.lg-tm{font-size:12px;color:var(--muted)}
.lg-t{font-size:14px;line-height:1.6;word-break:keep-all}
.lg-p{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--tag);white-space:nowrap}
.lg-p.bad{background:var(--redbg);color:var(--redtx)}
.lg-u{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--red);color:var(--bg)}
h2.sec{font-size:16px;margin:10px 0 0}
.fade{animation:fd .45s}
@keyframes fd{from{opacity:0}}
.black{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;color:#9a9086;font-size:15px;opacity:0;transition:opacity .9s;pointer-events:none}
.black.on{opacity:1;pointer-events:auto}

@media (max-width:767px) and (max-height:820px){#app{padding-top:14px;gap:10px}.story{gap:10px}}

/* ===== 캐릭터 선택 ===== */
.clist{display:flex;flex-direction:column;gap:12px;flex-grow:1}
.ccard{position:relative;height:178px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#1b1815 right 28%/cover no-repeat;text-align:left;cursor:pointer;padding:0;transition:transform .15s,outline-color .15s;outline:3px solid transparent;outline-offset:2px;color:#ece4d8}
.ccard.img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,16,20,.72) 0%,rgba(18,16,20,.32) 42%,rgba(18,16,20,0) 62%)}
.ccard .t{position:absolute;left:16px;bottom:14px;right:44%;z-index:1;display:flex;flex-direction:column;gap:3px}
.ccard .n{font-size:24px;font-weight:900;line-height:1.1}.ccard .m{font-size:12.5px;opacity:.85;line-height:1.5}
.ccard .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .r{color:#e0625a;font-size:12px;margin-top:4px;line-height:1.45}
.ccard .sil{position:absolute;right:22px;bottom:0;width:150px;height:170px}.ccard .sil path{fill:#0d0b0a}
.ccard:not(.img):not(.lk) .sil path{fill:#3a2f28}
.ccard.lk{cursor:default}.ccard.lk .t{color:#8d8273}
.ccard.sel{outline-color:var(--red)}
.ccard:not(.lk):active{transform:scale(.985)}

function runFF(from,to,done){cancelAnimationFrame(ffAnim);if(to-from<1){done&&done();return}

  const bar=el.querySelector('.b i');

   cols.forEach((c,i)=>{const sp=c.firstChild;const od=+c.dataset.o,nd=+c.dataset.v;if(o===v)return;const spins=(n-1-i)===0?2:1;let target=10+nd+(nd<od?10:0)+(od===nd?10*spins:10*(spins-1));const p=n-1-i;const dur=.5+(p===0?.35:p===1?.15:0)+(Math.abs(v-o)>15?.2:0);

function tier(){const t=st.men>=70?0:st.men>=40?1:st.men>=20?2:3;return sOn('trauma')?Math.max(t,2):t}
function jit(text,r,rot,dy,sk,size){return [...text].map(ch=>ch===' '?`<span class="ch" style="width:${4+Math.floor(r()*6)}px"></span>`:`<span class="ch" style="transform:translateY(${((r()*2-1)*dy).toFixed(1)}px) rotate(${((r()*2-1)*rot).toFixed(1)}deg) skewX(${sk}deg);font-size:${Math.round(size*(1+(r()*.24-.12)))}px">${esc(ch)}</span>`).join('')}
function zig(r,w,h,n,sw,op,col){let pts=[];for(let i=0;i<n;i++){const x=i%2===0?(i/(n-1))*w+(r()*12-6):r()*w;pts.push(`${x.toFixed(1)} ${(2+r()*(h-4)).toFixed(1)}`)}return `<svg aria-hidden="true" width="${w+8}" height="${h}" viewBox="0 0 ${w+8} ${h}" style="margin-top:-${h/2}px;opacity:${op}"><path d="M${pts.join(' L')}" fill="none" stroke="${col||'var(--red)'}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
const SLIP='<svg aria-hidden="true" width="80" height="22" viewBox="0 0 80 22"><path d="M1 8 C14 9 22 15 34 13 C48 11 58 19 79 21" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/></svg>';
function selfTalk(){const L=['못 가 못 가 못 가'];const w=cnt('water');L.push(`물 ${w?w+'병':'없음'}. 어제도 ${w?w+'병':'없었나'}`);
 if(F('lostName'))L.push(`${F('lostName')} 이름 부르지 마 부르지`);
 if(F('park')==='with')L.push('박 씨가 또 문을 봤다 나를 봤다');
 L.push('누가 두드려 아니야 아무도');
 if(st.ch==='seoyun')L.push('엄마 미안해 미안');
 L.push('아무도 안 와');return L}
function memoHTML(m,id){if(!m)return'';if(typeof m==='function')m=m(st);if(!m)return'';if(typeof m==='string')m={t:m};
 const tr=tier();const r=rng(hash(id+':'+tr+':'+(m.t||'')));const warn=!!m.warn;
 const len=m.t?m.t.length:0;
 if(tr===0){const tilt=r()<.5?0:-(1+r()*2);return `<div class="memo pen ${warn?'red':''}" style="transform:rotate(${tilt.toFixed(1)}deg)">${m.x?`<span class="s1">${esc(m.x)}</span> `:''}${esc(m.t||'')}</div>`}
 if(tr===1){const tilt=-(1+r()*2);return `<div class="memo pen ${warn?'red':''}" style="transform:rotate(${tilt.toFixed(1)}deg)">${m.x?`<span class="s2">${esc(m.x)}</span> `:''}${esc(m.t||'')}</div>`}
 if(tr===2){const tilt=-(3+r()*1.5);let t=m.t||'';let cut=false;if(len>8&&r()<.35){t=t.slice(0,Math.floor(len*(.55+r()*.25)));cut=true}
  return `<div class="memo pen dark-ink" style="transform:rotate(${tilt.toFixed(1)}deg);align-self:flex-start;display:flex;flex-wrap:wrap;align-items:center;gap:6px">${m.x?`<span class="w">${jit(m.x,r,4,1.5,-6,24)}${zig(r,m.x.length*17,22,14,2.2,1)}</span>`:''}<span>${jit(t,r,5,2,-8,24)}</span>${cut?SLIP:''}</div>`}
 // tier 3
 const tilt=-(3+r()*3);const lines=selfTalk();const pickN=Math.min(lines.length,4+Math.floor(r()*2));const chosen=lines.slice(0,pickN);
 let out=`<div class="memo pen" style="transform:rotate(${tilt.toFixed(1)}deg);align-self:flex-start;display:flex;flex-direction:column">`;
 const first=m.x||m.t||'';
 out+=`<div class="ln" style="padding-bottom:6px">${m.x?`<span class="w">${jit(m.x,r,6,2.5,-10,25)}${zig(r,m.x.length*18,26,18,2.4,1)}${zig(r,m.x.length*18,22,14,2,.85)}${zig(r,m.x.length*18,18,10,1.6,.7,'#c43a30')}</span>`:jit(first.slice(0,Math.ceil(first.length*.6)),r,7,3,-12,25)}</div>`;
 const cols=['var(--ink)','var(--red)','var(--ink)','var(--dk)','var(--ink)','var(--red)'];
 chosen.forEach((l,i)=>{out+=`<div class="ln" style="color:${cols[i%cols.length]};transform:rotate(${(r()*8-5).toFixed(1)}deg);padding-left:${Math.floor(r()*50)}px;margin-top:${i?-(10+Math.floor(r()*7)):0}px">${jit(l,r,8+i,3+i*.6,-(10+i*1.5),23+i)}</div>`});
 out+=`<div style="padding-left:140px;margin-top:-14px">${SLIP}</div></div>`;return out}

function applyChoice(c,ok,pc,at,isU){const ct=josa(typeof c.t==='function'?c.t(st):c.t);

 if(pts.length>1)o+=`<path d="M${pts.map(p=>p.x+' '+p.y).join(' L')}" fill="none" stroke="var(--m-red)" stroke-width="${which==='seoul'?1.8:1.5}" stroke-dasharray="${which==='seoul'?'3 4':'2 2.5'}" stroke-linecap="round"/>`;
 let lab='';
 const inS=k=>MAPD.seoulSet.includes(k);let rl=null;if(which==='region'){if(m.cur&&inS(m.cur))rl=m.cur;else rl=[...m.path].reverse().find(k=>['mart','swst','church'].includes(k))||null}
 for(const [k,s] of Object.entries(m.k)){const p=P[k];if(!p)continue;const cur=m.cur===k;const r=which==='seoul'?1:.78;const showL=which==='seoul'||!inS(k)||k==='hosp'||k===rl;
  if(cur)o+=`<circle cx="${p.x}" cy="${p.y}" r="${10*r}" fill="none" stroke="var(--m-red)" stroke-width="2"/>`;
  o+=s==='v'?`<circle cx="${p.x}" cy="${p.y}" r="${4.2*r}" fill="var(--m-ink)" stroke="var(--m-paper)" stroke-width="1.2"/>`:`<circle cx="${p.x}" cy="${p.y}" r="${3.8*r}" fill="var(--m-paper)" stroke="var(--m-muted)" stroke-width="1.3" stroke-dasharray="2 1.6"/>`;
  if(p.lx!=null&&showL){const t=MAPD.names[k]+(s==='r'?'?':'');lab+=`<text x="${p.lx}" y="${p.ly}" text-anchor="${p.a==='start'?'start':p.a==='end'?'end':'middle'}" ${pen} font-size="${p.s}" fill="${s==='v'?'var(--m-ink)':'var(--m-muted)'}" ${halo}>${esc(t)}</text>`;
   if(ev&&(which==='seoul'||!inS(k))){const es=m.ev.filter(e=>e.pl===k);if(es.length)o+=`<circle cx="${p.x+5.5*r}" cy="${p.y-5.5*r}" r="${3.2*r}" fill="var(--m-red)"/><text x="${p.x+5.5*r}" y="${p.y-5.5*r+2.4*r}" text-anchor="middle" font-size="${6.5*r}" font-weight="700" fill="var(--m-paper)">!</text>`}}}
 return o+lab+'</svg>'}
function mapDefault(){const m=MP();return m.cur&&!MAPD.seoulSet.includes(m.cur)?'region':'seoul'}
function mapLegend(which){const ev=mapEvOn()&&which==='seoul';return `<div class="mlg"><span><i class="d v"></i>가 본 곳</span><span><i class="d r"></i>들은 곳</span><span><i class="ln"></i>지나온 길</span>${ev?'<span><b class="x">✕</b>통행 불가</span><span><b class="q pen">?</b>확인 안 됨</span>':''}</div>`}
/* ===== 수첩 ===== */
let noteTab='log';

 const tabs=[['log','기록'],['map','지도'],['memo','메모']].map(([k,l])=>`<button class="ntab ${noteTab===k?'on':''}" data-t="${k}" aria-pressed="${noteTab===k}">${l}</button>`).join('');
 let body='';
 if(noteTab==='log'){const h=(st&&st.hist)||[];let cur=null,b='';
  for(let i=h.length-1;i>=0;i--){const e=h[i];const d=Math.floor(e.s/86400)+1;if(d!==cur){cur=d;b+=`<div class="lg-day pen">${d}일째</div>`}
   const tag=e.p!=null?`<span class="lg-p ${e.ok?'':'bad'}">${e.p}% ${e.ok?'성공':'실패'}</span>`:'';
   b+=`<div class="lg-row"><span class="lg-tm">${fmt(e.s).slice(0,5)}${e.l?' · '+esc(e.l):''}${e.u?' <span class="lg-u">긴급</span>':''}</span><span class="lg-t">${esc(e.t)} ${tag}</span></div>`}
  body=`<span class="sub">선택 ${h.length}번 · 최신 기록이 위에 있다</span>${h.length?`<div class="lg">${b}</div>`:'<span class="sub">아직 고른 선택지가 없다.</span>'}`}
 else if(noteTab==='map'){if(!mapView)mapView=mapDefault();const ev=mapEvOn();
  body=`<div class="mtop"><div class="seg" role="group" aria-label="지도 범위"><button class="${mapView==='seoul'?'on':''}" data-v="seoul" aria-pressed="${mapView==='seoul'}">서울</button><button class="${mapView==='region'?'on':''}" data-v="region" aria-pressed="${mapView==='region'}">수도권</button></div><button class="evsw ${ev?'on':''}" id="evSw" role="switch" aria-checked="${!!ev}">사건 표시<span class="sw"><i></i></span></button></div>
  <div class="mapbox">${mapSVG(mapView)}</div>${mapLegend(mapView)}${mapEvList(mapView)}${MP().cur?`<span class="pen mnow">지금 — ${esc(MAPD.names[MP().cur])} · ${day()}일째</span>`:''}`}
 else{const ms=(st&&st.memos)||[];body=ms.length?`<span class="sub">모은 메모 ${ms.length}장 · 최신 메모가 위에 있다</span><div class="mlist">${ms.slice().reverse().map(m=>memoCard(m)).join('')}</div>`:'<span class="sub">아직 적어 둔 메모가 없다.</span>'}
 o.innerHTML=`<div class="sheet" role="dialog" aria-label="수첩"><div style="display:flex;justify-content:space-between;align-items:center"><h3>수첩</h3><button class="ibtn" aria-label="닫기" onclick="closeOv()"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="ntabs" role="tablist">${tabs}</div>${body}</div>`;
 o.onclick=e=>{if(e.target===o)closeOv()};document.body.appendChild(o);

 const sw=o.querySelector('#evSw');if(sw)sw.onclick=()=>{LS.set('gz_mapev',mapEvOn()?0:1);openNote('map')}}

/* ===== v12 · 5단계: 메모 확장 ===== */
/* 메모 종류: 기본(한 줄) · list(챙길 것) · tally(날짜 세기) · names(이름들) · letter(엄마에게) · sketch(다리 낙서) · thought(혼잣말) */

/* ---------- 상황 혼잣말 묶음 ---------- */
const THOUGHT={
 night:['창문 확인. 두 번.','불 끄고. 숨 죽이고.','밤이 제일 길다','손전등 배터리 아껴','문고리에서 손 떼지 마','소리 나면 세. 하나 둘 셋'],
 hurt:['상처 냄새 맡아 봐. 썩는 냄새?','붕대 갈 때 안 아픈 척','피 색 확인. 검으면 안 돼','열 재. 이마. 목.'],
 hungry:['배고픈 거 말고 다른 생각','물 한 모금. 세 번 나눠서','통조림 따개 어디 뒀지'],
 lonely:['아무도 없을 때 우는 거','혼자인 거 익숙해지지 마','말을 해. 소리 내서. 아무거나'],
 comp:n=>[n+'이 웃었다. 오늘 처음',n+' 잠든 거 확인',n+'한테 말 안 한 거: 무섭다는 거'],
 mart:['배급 줄 맨 뒤. 다 보인다','오 실장 눈 피하지 마. 피하면 진다','셔터 소리 = 사람 / 긁는 소리 = 놈들'],
 station:['환기 팬 소리. 계속 들려야 해','촛불 높이 확인','열차 칸 번호 외워. 3번 = 소연'],
 church:['종탑 그림자로 시간 보기','동그라미. 나는 동그라미일까','봉안당 계단 지날 땐 숨 참기'],
 road:['발바닥 물집 터짐. 양말 바꿔','남쪽. 해 뜨는 쪽 오른손','표지판 숫자 적어 둬','물 냄새 나면 멈춰']};
function thoughtLine(r){const s=st;const pool=[];
 if(night())pool.push(...THOUGHT.night);if(s.hp<45)pool.push(...THOUGHT.hurt);if(s.res<35)pool.push(...THOUGHT.hungry);
 const w=withN();if(w.length)pool.push(...THOUGHT.comp(w[Math.floor(r()*w.length)]));else pool.push(...THOUGHT.lonely);
 if(F('sheltered')){const h=F('hub')||'mart';pool.push(...(THOUGHT[h]||[]))}else if(day()>=14)pool.push(...THOUGHT.road);
 return pool.length?pool[Math.floor(r()*pool.length)]:'숨 쉬어'}

/* ---------- 메모 자동 생성 ---------- */
function autoMemo(id,sc){if(!st||sc.urgent)return null;const f=st.flags;const n=(st.hist||[]).length;
 if(f.amAt!=null&&n-f.amAt<3)return null;
 const d=day();const dn=(f.deadN||[]).length+(f.lostName?1:0);const brN=Object.keys((st.map&&st.map.br)||{}).length;
 let m=null;
 if(dn>(f.amDead||0)){m={kind:'names'};f.amDead=dn}
 else if(brN>(f.amBr||0)&&brN>=2){m={kind:'sketch'};f.amBr=brN}
 else if((st.res<35||st.hp<40)&&d-(f.amLow||-9)>=4){m={kind:'list'};f.amLow=d}
 else if(d-(f.amDay||0)>=3&&d>=3||(d===14&&f.amDay!==14)){m={kind:'tally',n:d,t:d>=14?'남쪽까지 '+Math.max(1,28-d)+'일':'버틴 날'};f.amDay=d}
 else if(d>=4&&d-(f.amLetter||0)>=5){m={kind:'letter'};f.amLetter=d}
 else if(Math.random()<.15){const r=rng(hash(id+':'+st.sec));m={kind:'thought',t:thoughtLine(r)}}
 if(m)f.amAt=n;return m}
function resolveMemo(sc,id){let m=sc.memo;if(typeof m==='function')m=m(st);if(typeof m==='string')m={t:m};if(!m)m=autoMemo(id,sc);if(m&&m.kind)m=fillMemo(m);return m}
/* 그 순간의 상태로 내용을 채워 둔다(수첩에 그대로 남도록) */
function fillMemo(m){if(m.items||m.lines||m.names||m.br)return m;const o=Object.assign({},m);
 if(m.kind==='list'){o.items=[['물',cnt('water')],['통조림',cnt('can')],['붕대',cnt('bandage')+cnt('medkit')],['항생제',cnt('antibiotic')]].map(([k,v])=>[k+(v?' '+v:''),v>0]);o.t=o.t||'챙길 것'}
 if(m.kind==='names'){const dead=st.flags.deadN||[];const known=[];
  withN().forEach(n=>known.push([n,0]));Object.keys(st.comp).forEach(k=>{if(st.comp[k].st==='dead'&&COMP[k])known.push([COMP[k],1])});
  const BADN=['오 실장','박 회장','배 씨','권 하사'];dead.filter(n=>!BADN.includes(n)).forEach(n=>{const d=n==='최'?'보안팀 최':n;if(!known.some(x=>x[0]===d))known.push([d,1])});if(st.flags.lostName&&!known.some(x=>x[0]===st.flags.lostName))known.push([st.flags.lostName,1]);
  o.names=known.slice(-6);o.t=o.t||(o.names.some(x=>x[1])?'잊지 마':'곁에 있는 사람')}
 if(m.kind==='letter'){const d=day();const call=F('mom');o.lines=d<8?['엄마,',call?'나 살아 있어. 다리가 닫혔어.':'전화 못 받아서 미안해.','기다려. 문 열지 말고.']:d<15?['엄마,','아직 강 북쪽이야.',withN().length?withN()[0]+'이(가) 같이 있어. 혼자 아니야.':'혼자지만 괜찮아.','미안해. 조금만 더']:['엄마,','남쪽으로 가고 있어.','부천은 반대쪽인데.','미안해 미안'];o.lines=o.lines.map(josa)}
 if(m.kind==='sketch'){o.br=Object.assign({},(st.map&&st.map.br)||{});o.t=o.t||'다리'}
 return o}

/* ---------- 손글씨 그리기 ---------- */
const _memoBase=memoHTML;
function tallySVG(n){let g='';const groups=Math.floor(n/5),rest=n%5;let x=2;
 for(let i=0;i<groups;i++){for(let j=0;j<4;j++)g+=`<path d="M${x+j*6} 4 L${x+j*6+1} 26" />`;g+=`<path d="M${x-3} 22 L${x+22} 8" />`;x+=32}
 for(let j=0;j<rest;j++)g+=`<path d="M${x+j*6} 4 L${x+j*6+1} 26" />`;x+=rest*6;
 return `<svg aria-hidden="true" width="${x+6}" height="30" viewBox="0 0 ${x+6} 30" style="overflow:visible"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${g}</g></svg>`}
function sketchSVG(br,r){const order=['동작대교','반포대교','잠수교','한남대교','동호대교','성수대교','영동대교','청담대교','잠실대교','잠실철교','올림픽대교','천호대교'];
 const known=order.filter(n=>br[n]);if(!known.length)return '';const W=Math.max(150,known.length*44+20);let o=`<svg aria-hidden="true" width="${W}" height="64" viewBox="0 0 ${W} 64" style="overflow:visible">`;
 o+=`<path d="M0 24 C${W*.3} ${16+r()*6} ${W*.6} ${30+r()*6} ${W} 22" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M0 40 C${W*.3} ${32+r()*6} ${W*.6} ${46+r()*6} ${W} 38" fill="none" stroke="currentColor" stroke-width="1.6"/>`;
 known.forEach((n,i)=>{const x=20+i*44;const s=br[n];o+=`<path d="M${x} 18 L${x+2} 46" stroke="currentColor" stroke-width="1.4"/>`;
  if(s==='x')o+=`<path d="M${x-5} 27 L${x+7} 37 M${x+7} 27 L${x-5} 37" stroke="var(--red)" stroke-width="2.2" stroke-linecap="round"/>`;
  else if(s==='?')o+=`<text x="${x+1}" y="38" text-anchor="middle" font-family="Nanum Pen Script, cursive" font-size="20" fill="var(--red)">?</text>`;
  else o+=`<circle cx="${x+1}" cy="32" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>`;
  o+=`<text x="${x+1}" y="61" text-anchor="middle" font-family="Nanum Pen Script, cursive" font-size="13" fill="currentColor">${esc(n.replace('대교','').replace('철교','철'))}</text>`});
 return o+'</svg>'}
function kindBody(m,tr,r){const jt=(t,k)=>tr>=2?jit(t,r,4+k,1.5+k*.5,-6,23):esc(t);
 if(m.kind==='tally')return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span>${jt(m.n+'일째',0)}</span>${tallySVG(Math.min(m.n,28))}</div>${m.t?`<div style="font-size:20px;opacity:.85">${jt(m.t,1)}</div>`:''}`;
 if(m.kind==='list')return `${m.t?`<div style="font-size:20px">${jt(m.t,0)}</div>`:''}${(m.items||[]).map(([k,ok],i)=>`<div style="font-size:22px">${ok?'✓':'<span style="color:var(--red)">✗</span>'} ${ok?jt(k,i%2):`<span class="s1">${jt(k,i%2)}</span>`}</div>`).join('')}`;
 if(m.kind==='names')return `${m.t?`<div style="font-size:20px">${jt(m.t,0)}</div>`:''}${(m.names||[]).map(([n,dead],i)=>`<div style="font-size:23px;transform:rotate(${(r()*4-2).toFixed(1)}deg)">${dead?`<span class="w">${jt(n,1)}${zig(r,n.length*20,22,10,2,1)}</span>`:jt(n,0)}</div>`).join('')}`;
 if(m.kind==='letter')return (m.lines||[]).map((l,i,a)=>{const cut=i===a.length-1&&(tr>=1);return `<div style="font-size:${i?21:23}px">${jt(cut?l.slice(0,Math.ceil(l.length*.7)):l,i%2)}${cut?SLIP:''}</div>`}).join('');
 if(m.kind==='sketch')return `${m.t?`<div style="font-size:20px">${jt(m.t,0)}</div>`:''}${sketchSVG(m.br||{},r)}`;
 return null}
memoHTML=function(m,id,trOver){if(!m)return'';if(typeof m==='function')m=m(st);if(!m)return'';if(typeof m==='string')m={t:m};
 const tr=trOver!=null?trOver:tier();
 if(!m.kind||m.kind==='thought'||tr>=3){if(trOver!=null&&tr>=3&&m.snap){/* 수첩: 그때의 혼잣말 그대로 */const r=rng(hash(id+':3'));let out=`<div class="memo pen" style="transform:rotate(-3deg);align-self:flex-start;display:flex;flex-direction:column">`;const cols=['var(--ink)','var(--red)','var(--ink)','var(--dk)'];m.snap.forEach((l,i)=>{out+=`<div class="ln" style="color:${cols[i%4]};transform:rotate(${(r()*8-5).toFixed(1)}deg);padding-left:${Math.floor(r()*40)}px;margin-top:${i?-(8+Math.floor(r()*6)):0}px">${jit(l,r,8+i,3+i*.6,-(10+i*1.5),22+i)}</div>`});return out+'</div>'}
  if(trOver!=null){const saved=st.men;st.men=[85,55,30,10][tr];const h=_memoBase(m.kind==='thought'?{t:m.t}:m,id);st.men=saved;return h}
  return _memoBase(m.kind==='thought'?{t:m.t}:m,id)}
 const r=rng(hash(id+':'+tr+':'+(m.kind)));const tilt=tr===0?-(r()*1.5):tr===1?-(1+r()*2):-(3+r()*1.5);
 return `<div class="memo pen ${m.warn?'red':''} mk-${m.kind}" style="transform:rotate(${tilt.toFixed(1)}deg);align-self:flex-start;display:flex;flex-direction:column;gap:2px">${kindBody(m,tr,r)}</div>`};

/* 수첩에 남기기: 종류·그때의 정신 상태까지 */
function keepMemo(m,id){if(!st||!m)return;if(!st.memos)st.memos=[];const key=id+'|'+(m.kind||'')+'|'+(m.t||'')+'|'+(m.x||'')+'|'+(m.n||'');
 const last=st.memos[st.memos.length-1];if(last&&last.key===key)return;if(st.memos.some(x=>x.key===key&&x.s===st.sec))return;
 const tr=tier();const snap=tr>=3?selfTalk().slice(0,4):null;
 st.memos.push(Object.assign({},m,{key,id,s:st.sec,tr,snap,loc:st.lastLoc||''}));if(st.memos.length>150)st.memos.splice(0,st.memos.length-150)}
function memoCard(m){const d=Math.floor(m.s/86400)+1;
 if(m.b!=null&&m.key==null){m={t:m.b,x:m.x,warn:m.warn,s:m.s,tr:Math.max(0,Math.min(3,m.men>=70?0:m.men>=40?1:m.men>=20?2:3))}}
 return `<div class="mcard"><span class="mc-d">${d}일째 ${fmt(m.s).slice(0,5)}${m.loc?' · '+esc(String(m.loc).split(' · ')[0]):''}</span><div class="mc-body">${memoHTML(m,m.id||String(m.s),m.tr||0)}</div></div>`}

/* 정신력이 바닥일 때의 혼잣말: 잃은 사람들, 은신처, 동료 */
{const _st=selfTalk;selfTalk=function(){const L=_st();const dead=(st.flags.deadN||[]).slice(-2);dead.forEach(n=>L.splice(2,0,n+' '+n+' 아니야 아니야'));
 const h=F('hub');if(h==='station')L.splice(3,0,'팬 소리 팬 소리 들려');if(h==='church')L.splice(3,0,'종 치지 마 치지 마');
 const w=withN();if(w.length)L.splice(1,0,w[0]+' 자? 자는 거지?');return L}}

/* ===== 서윤 1일차: 서울대병원 ===== */
const mateName=()=>F('park')==='with'?'박 씨':F('junho')==='with'?'준호':(withN()[0]||(F('junho')==='dead'?'민지':'준호'));
function threatTo(next){F('afterMen',next);let p=female()?0.6:0.2;if(sOn('disguise'))p-=0.3;if(hasW())p-=0.1;if(withC().length)p-=0.2;return Math.random()<p?'th_men':next}

S.y_start={time:T(1,6,10),loc:'서울대병원 응급실 · 격리 3번 베드',
 text:'밤샘 근무가 끝나기 20분 전이었다. 격리 3번 베드의 남자는 06시 06분에 사망 판정을 받았다. 모니터가 평선을 그린 지 4분 만에, 그가 일어나 앉았다.\n\n경비원 김 씨가 다가가 어깨를 잡았다. 남자는 고개를 돌려 김 씨의 목을 물었다. 이빨이 살을 뚫고 들어가는 소리가 이상하리만치 또렷했다. 커튼에 피가 부채꼴로 튀었다.\n\n!응급실 전체가 한꺼번에 비명을 질렀다.',
 memo:{t:'3번 베드 — 사망 06:06. 06:10 다시 일어남.',warn:1},
 choices:[
  {t:'김 씨에게 달려가 지혈한다',p:55,ok:'y_kim_ok',okEff:{hum:8},fail:'y_kim_fail',failEff:{hum:5,hp:-15,add:'bleed'}},
  {t:'간호사실로 뛰어 들어가 문을 잠근다',to:'y_station',eff:{hum:-3},adv:5},
  {t:'비상계단으로 곧장 달린다',to:'y_corridor',eff:{hum:-6,men:-5},adv:5}]};
S.y_kim_ok={loc:'응급실 · 3번 베드 커튼 뒤',
 text:'거즈 뭉치로 목을 누르고 김 씨를 커튼 뒤로 끌어냈다. 손바닥 아래에서 맥이 뛰다가, 느려지다가, 멎었다. 1분도 걸리지 않았다.\n\n그의 허리띠에서 열쇠꾸러미가 떨어졌다. 꼬리표에 「격리병동 기록실」.\n\n3번 베드의 남자는 다른 사람을 쫓아 복도로 나갔다. 김 씨의 손가락이, 움찔했다.',
 memo:{t:'경동맥. 4분 만에 사망. 그리고 —'},
 choices:[
  {t:'열쇠를 챙겨 간호사실로 뛴다',to:'y_station',eff:{flag:{recKey:1}},adv:4},
  {t:'김 씨의 눈을 감겨 준다',to:'y_kim_turn',eff:{hum:3,men:-5}}]};
S.y_kim_turn={loc:'응급실 · 3번 베드 커튼 뒤',
 text:'눈꺼풀을 내리려는 순간, 그 눈이 떠졌다. 흰자위가 온통 핏발로 덮여 있다. 차가운 손이 손목을 움켜쥐었다. 사람의 악력이 아니다.\n\n!입이 열린다.',
 choices:[
  {t:'손목을 비틀어 빼낸다',p:60,ok:'y_station',okEff:{flag:{recKey:1},men:-8},fail:'death:bite'},
  {t:'트레이의 가위를 그의 눈에 꽂는다',p:70,ok:'y_station',okEff:{flag:{recKey:1},men:-15,hum:-2},fail:'death:bite'}]};
S.y_kim_fail={loc:'응급실',
 text:'김 씨에게 닿기도 전에 3번 베드의 남자가 몸을 돌렸다. 손톱이 팔뚝을 긁고 지나갔다. 걷어차고 바닥을 굴렀다.\n\n팔에서 피가 흐른다. 물린 건 아니다. 아마도.\n\n김 씨는 이미 움직이지 않는다. 아직은.',
 memo:{t:'긁힘. 물림 아님. 아님.'},
 choices:[{t:'간호사실로 기어 들어가 문을 잠근다',to:'y_station',adv:5}]};

S.y_station={time:T(1,6,25),loc:'응급실 간호사실',
 text:s=>'문을 잠그자마자 유리창 너머로 손바닥이 찍혔다. 하나, 둘. 피 묻은 손자국이 겹겹이 쌓인다.\n\n벽걸이 TV 속 앵커가 같은 문장을 되풀이한다. 「서울 전역에 외출 자제가 권고되었습니다. 원인 불명의 집단 폭력 사태가…」 화면 아래로 「한강 교량 통제 예정」 자막이 흘러간다.\n\n'+(F('mom')?'휴대폰 화면에 엄마 번호가 떠 있다. 다시는 연결되지 않는다.':'구급 카트, 수간호사 책상, 그리고 휴대폰. 엄마에게서 부재중 전화가 일곱 통 와 있다.')+(F('grp_st')?'\n\n!유리문에 금이 갔다. 더 뒤질 시간이 없다.':''),
 memo:{x:'엄마한테 전화',t:'나중에. 일단 나가.'},
 choices:[
  {t:'구급 카트에서 붕대와 구급상자를 챙긴다',once:'cart',group:'st',to:'y_station',eff:{give:['bandage','medkit']},adv:3},
  {t:'수간호사 책상 서랍을 뒤진다',once:'desk',group:'st',to:'y_station',eff:{give:['sedative','antibiotic']},adv:3},
  {t:'지갑에서 엄마 사진을 꺼내 가슴 주머니에 넣는다',once:'photo',group:'st',to:'y_station',eff:{give:'photo'},adv:1},
  {t:'팔의 상처를 직접 꿰맨다',if:s=>sOn('bleed'),once:'stitch',to:'y_station',eff:{del:'bleed',hp:5,men:-3},adv:15},
  {t:'엄마에게 전화를 건다',once:'call',to:'y_call',eff:{men:-8},adv:4},
  {t:'격리병동 기록실로 간다',lock:s=>F('recKey')?null:'기록실 열쇠 필요',to:'y_records',adv:10},
  {t:'복도로 나간다',to:'y_corridor',adv:5}]};
S.y_call={loc:'응급실 간호사실',
 text:'신호가 열한 번 갔다. 받았다.\n\n「서윤아.」 엄마 목소리가 너무 작다. 「현관 앞에 누가 계속 서 있어. 옆집 아저씨 같은데, 대답을 안 해.」\n\n「문 열지 마. 절대 열지 마. 내가 갈게.」\n\n뚝. 다시 걸어도 연결되지 않는다. 엄마 집은 부천이다. 다리 건너, 곧 닫힐 봉쇄선 너머.',
 memo:{t:'부천. 엄마. 문 열지 마.',warn:1},eff:null,enter:s=>{F('mom',1)},
 choices:[{t:'숨을 고르고 다시 일어선다',to:'y_station'}]};
S.y_records={loc:'격리병동 기록실',
 text:'기록실은 조용했다. 3번 베드 차트는 보관함 맨 위, 누군가 급하게 꽂아 넣은 듯 비뚤어져 있었다.\n\n환자명 공란. 입원은 11일 전. 소속 「영흥도 해양바이오 연구시설」. 혈액검사 수치 옆에 볼펜으로 동그라미가 쳐져 있다. 처방 칸에는 약 이름 대신 도장 하나. 「프로토콜 0」.\n\n마지막 장에 메모가 붙어 있다. 「격리 해제 금지. 사망 시 즉시 소각. 절대 지혈하지 말 것.」',
 memo:{t:'영흥도. 프로토콜 0. 왜 지혈하지 말라고?'},
 choices:[
  {t:'차트를 접어 품에 넣는다',to:'y_corridor',eff:{clue:'chart'},adv:5},
  {t:'차트를 두고 나간다',to:'y_corridor',adv:5}]};

S.y_corridor={time:T(1,6,55),loc:'응급실 복도',
 text:s=>'복도는 이미 사람의 것이 아니었다. 이동식 침대가 쓰러져 있고, 그 아래에서 무언가가 누군가를 먹고 있다. 소리가 젖어 있다.\n\n비상구 표지판이 깜빡인다. 아래로 가면 지하 주차장, 구급차가 있다. 위로 가면 옥상. 정면 로비 너머로는 군용 트럭 엔진 소리.'+(sOn('bleed')?'\n\n!팔의 상처에서 피가 떨어진다. 침대 밑의 것이 고개를 든다.':''),
 memo:{t:'아래 = 구급차. 위 = 옥상. 앞 = 군인.'},
 choices:[
  {t:'지하 주차장으로 내려간다',to:'y_garage',adv:10},
  {t:'옥상으로 올라간다',to:'y_roof',adv:15},
  {t:'로비를 가로질러 군 트럭 쪽으로 달린다',p:60,move:1,ok:'y_checkpoint',fail:'y_checkpoint',failEff:{hp:-20,add:'bleed'},adv:5}]};

/* 지하 주차장 */
S.y_garage={time:T(1,7,10),loc:'지하 2층 주차장',
 text:'비상등만 켜진 주차장은 붉다. 구급차 세 대가 나란히 서 있다. 키는 경비실 키박스에 있을 것이다. 경비실 유리문 안에서 무언가가 천천히 몸을 흔들고 있다.\n\n바닥에 공사용 쇠파이프가 굴러다닌다.',
 memo:{t:'경비실 안에 하나. 아니, 둘?'},
 choices:[
  {t:'쇠파이프를 줍는다',once:'pipe',to:'y_garage',eff:{give:'pipe'},adv:2},
  {t:'경비실 문을 열고 키를 찾는다',p:45,wpn:1,ok:'y_ambulance',okEff:{give:'carkey',men:-5},fail:'y_garage_run',failEff:{hp:-12},urgent:'u_garage',urgentAlt:'y_garage_run',adv:5},
  {t:'걸어서 출구 램프로 빠져나간다',to:'y_street',eff:{men:-3},adv:25}]};
S.u_garage={urgent:1,alt:'y_garage_run',sub:'초 안에 고르지 않으면 물린다',
 text:'!경비실 문이 열리자 둘이 한꺼번에 쏟아져 나왔다.\n\n하나는 경비 제복, 하나는 환자복. 환자복의 아래턱이 반쯤 떨어져 덜렁거린다. 뒤편 어둠에서 발소리가 늘어난다.',
 choices:[
  {t:'쇠파이프로 머리를 내리친다',needW:1,p:60,ok:'y_ambulance',okEff:{give:'carkey',men:-10},fail:'death:bite'},
  {t:'구급차 밑으로 기어 들어간다',p:50,ok:'y_garage_hide',fail:'death:bite'},
  {t:'출구 램프로 전력 질주한다',p:60,move:1,ok:'y_street',okEff:{hp:-5},fail:'death:bite'}]};
S.y_garage_run={loc:'지하 주차장 출구 램프',
 text:'경비실 문이 열리고 둘이 쏟아졌다. 어깨를 물리기 직전 몸을 비틀었다. 기둥에 머리를 박고, 램프를 기어 올라갔다.\n\n밖이다. 햇빛이 눈을 찌른다. 구급차 키는 없다.',
 choices:[{t:'달린다',to:'y_street',adv:15}]};
S.y_garage_hide={loc:'구급차 아래',
 text:'구급차 아래, 기름 냄새. 발들이 지나간다. 맨발, 운동화, 슬리퍼 한 짝. 한 시간 넘게 숨도 제대로 쉬지 못했다.\n\n발소리가 멀어진 뒤에야 기어 나왔다. 경비실은 비어 있다. 키박스에서 3호차 키를 꺼낸다.',
 choices:[{t:'3호차에 탄다',to:'y_ambulance',eff:{give:'carkey',men:-12},adv:70}]};
S.y_ambulance={loc:'구급차 3호 운전석',
 text:'시동이 한 번에 걸렸다. 연료는 절반. 조수석 아래 누군가 두고 간 신호탄 한 발이 굴러다닌다.\n\n출구 차단기 너머로 거리가 보인다. 차들이 엉켜 있고, 사람들이 뛰고, 그 사람들을 무언가가 쫓는다. 사이렌을 켜면 길이 열릴지도 모른다. 아니면 모든 것을 불러들이거나.',
 choices:[
  {t:'신호탄을 챙긴다',once:'flare1',to:'y_ambulance',eff:{give:'flare'},adv:1},
  {t:'사이렌을 켜고 밀어붙인다',p:45,ok:'y_drive',fail:'y_amb_siege',adv:20},
  {t:'불을 끄고 골목으로 천천히 빠진다',p:75,ok:'y_drive',fail:'y_drive_crash',adv:40}]};
S.y_amb_siege={loc:'구급차 3호 · 종로 골목',crisis:{name:'구급차 포위',len:12,note:'놈들이 흩어질 때까지'},
 text:'사이렌 소리에 거리 전체가 고개를 돌렸다. 백 개가 넘는 머리가. 앞 유리가 손바닥으로 덮였다. 차체가 흔들린다.\n\n시동을 껐다. 숨을 죽였다. 유리 너머로 입들이 벌어졌다 닫힌다.',
 memo:{t:'움직이지 마. 소리 내지 마.',warn:1},
 choices:[
  {t:'눈을 감고 버틴다',to:'y_amb_siege2',eff:{men:-10},adv:60},
  {t:'물을 아껴 한 모금만 마신다',if:s=>has('water'),to:'y_amb_siege2',eff:{take:'water',res:10},adv:30},
  {t:'경적을 짧게 울려 반대편 골목으로 유인한다',p:35,ok:'y_drive',okEff:{men:-5},fail:'death:noise',adv:30}]};
S.y_amb_siege2={loc:'구급차 3호 · 종로 골목',crisis:{name:'구급차 포위',len:12,note:'놈들이 흩어질 때까지'},
 text:'두드림이 조금씩 느려진다. 놈들은 소리를 잊는다. 그게 유일한 희망이다.\n\n앞 유리에 붙어 있던 얼굴 하나가 미끄러져 내려갔다. 틈이 생겼다.',
 choices:[
  {t:'조금 더 기다린다',to:'y_drive',eff:{men:-8},adv:120},
  {t:'지금 시동을 걸고 빠진다',p:60,ok:'y_drive',fail:'y_drive_crash',adv:20}]};
S.y_drive={loc:'강변북로',crisisEnd:1,
 text:'강변북로는 주차장이었다. 버려진 차들 사이로는 구급차가 더 나아갈 수 없다. 한강변 대형마트 간판이 2킬로미터 앞에 보인다. 옥상에 매트리스 커버로 쓴 글씨가 걸려 있다. 「생존자 있음」.\n\n구급차를 둑길 아래 버스정류장 뒤에 숨겼다. 언젠가 다시 필요할 것이다.',
 memo:{t:'3호차 — 자양 둑길 정류장 뒤.'},
 choices:[
  {t:'마트로 향한다',to:'y_mart_gate',eff:{flag:{ambHidden:1}},adv:60},
  {t:'근처 약국부터 들른다',to:'y_pharmacy',eff:{flag:{ambHidden:1}},adv:20}]};
S.y_drive_crash={loc:'종로 뒷골목',crisisEnd:1,
 text:'모퉁이에서 튀어나온 사람을 피하다 전봇대를 들이받았다. 이마에서 피가 흐른다. 라디에이터에서 김이 오른다.\n\n구급차는 여기까지다.',
 choices:[{t:'걸어서 한강 쪽으로 간다',to:'y_street',eff:{hp:-15,take:'carkey'},adv:10}]};

/* 옥상 */
S.y_roof={time:T(1,7,15),loc:'병원 본관 옥상',
 text:'옥상 문을 닫고 소화기로 받쳤다. 헬기 착륙장은 비어 있다. 도시 곳곳에서 연기가 오른다. 멀리서 총소리, 그보다 가까운 곳에서 비명.\n\n옆 오피스텔 옥상까지 2미터 남짓. 아래는 9층 높이. 구석에 공사용 철제 발판이 하나 기대어 있다.',
 memo:{t:'2미터. 뛸 수 있다. 뛸 수 있어.'},
 choices:[
  {t:'그대로 뛰어 건넌다',p:68,ok:'y_officetel',fail:'death:fall',adv:2},
  {t:'철제 발판을 걸쳐 기어서 건넌다',p:82,ok:'y_officetel',fail:'death:fall',adv:20},
  {t:'문을 막고 구조 헬기를 기다린다',to:'y_roof_wait',adv:10}]};
S.y_roof_wait={loc:'병원 본관 옥상',crisis:{name:'옥상 고립',len:16,note:'헬기는 오지 않을지도'},
 text:'헬기는 오지 않았다. 한 대가 지나가긴 했다. 낮게, 아주 낮게. 손을 흔들고 소리를 질렀다. 헬기는 방향을 틀지 않았다.\n\n등 뒤의 문이 쿵, 쿵 울린다. 소화기가 조금씩 밀려난다.',
 choices:[
  {t:'문을 다시 받친다',p:60,ok:'y_roof_wait2',fail:'y_roof',failEff:{men:-10},adv:30},
  {t:'발판을 걸쳐 건너편으로 간다',p:78,ok:'y_officetel',fail:'death:fall',adv:20},
  {t:'신호탄을 쏜다',need:'flare',to:'y_roof_flare',eff:{take:'flare'},adv:5}]};
S.y_roof_flare={loc:'병원 본관 옥상',crisis:{name:'옥상 고립',len:16},
 text:'붉은 불꽃이 하늘로 솟았다. 헬기는 오지 않았다. 대신 길 건너 건물들의 창문마다 얼굴이 나타났다. 산 사람의 얼굴도, 아닌 것도.\n\n문 너머 두드림이 두 배로 늘었다.',
 choices:[{t:'발판을 걸쳐 건너편으로 간다',p:75,ok:'y_officetel',fail:'death:fall',adv:15}]};
S.y_roof_wait2={loc:'병원 본관 옥상',crisis:{name:'옥상 고립',len:16},
 text:'정오가 지나고, 오후가 지났다. 문 너머가 조용해졌다. 놈들은 소리가 끊기면 잊는다.\n\n해가 기울 무렵, 계단으로 내려가기로 했다. 병원 안은 텅 비어 있었다. 피 묻은 발자국만 정문 쪽으로 이어져 있다.',
 choices:[{t:'정문을 피해 뒷길로 나간다',to:'y_dusk',eff:{men:-10,res:-5},adv:300}]};
S.y_officetel={loc:'옆 오피스텔 · 7층',crisisEnd:1,
 text:s=>'옆 건물 계단은 조용했다. 너무 조용했다. 7층 복도에 문이 열린 집이 하나. 냉장고에 생수, 신발장 위에 등산 배낭. 식탁 위엔 먹다 만 시리얼이 불어 있다.\n\n창밖으로 한강변 마트 옥상의 「생존자 있음」 글씨가 작게 보인다. 걸어서 두 시간.'+(F('grp_ofc')?'\n\n!복도 끝에서 문이 열리는 소리.':''),
 choices:[
  {t:'물과 배낭을 챙긴다',once:'ofc',group:'ofc',to:'y_officetel',eff:{give:['water','water'],bag:'hiking'},adv:10},
  {t:'주방에서 식칼을 챙긴다',once:'ofcknife',group:'ofc',to:'y_officetel',eff:{give:'knife'},adv:2},
  {t:'해가 질 때까지 여기 숨어 있다',to:'y_ofc_dusk',adv:30},
  {t:'지금 바로 마트로 간다',to:'y_street',adv:20}]};
S.y_ofc_dusk={time:T(1,19,40),loc:'오피스텔 7층',
 text:'해가 졌다. 복도에서 발소리. 사람 발소리다. 남자 셋, 손전등. 옆집 문을 하나씩 두드리며 다가온다.\n\n「안에 사람 있죠? 아까 다 봤어요. 여자 혼자 들어가는 거.」',
 choices:[{t:'숨을 죽인다',to:s=>threatTo('y_day2')}]};

/* 정문 검문소 */
S.y_checkpoint={time:T(1,7,20),loc:'병원 정문 · 군 검문소',
 text:s=>'정문 앞에 군용 트럭 두 대. 방독면을 쓴 군인들이 사람들을 줄 세우고 있다. 귀 체온계, 그리고 손전등으로 몸 구석구석을 비춘다.\n\n줄 앞쪽 남자가 소매를 걷자 팔에 붕대가 감겨 있다. 군인은 아무 말 없이 그를 트럭 뒤로 데려갔다. 총성 한 발. 줄은 아무 일 없다는 듯 한 칸 앞으로 갔다.'+(sOn('bleed')?'\n\n!당신 팔에서도 피가 흐르고 있다.':''),
 memo:{t:'상처 = 총살.',warn:1},
 choices:[
  {t:'상처를 소매로 가리고 줄에 선다',if:s=>sOn('bleed'),p:55,ok:'y_cp_pass',fail:'death:checkpoint'},
  {t:'간호사 사원증을 내밀며 「긁힌 상처」라고 말한다',if:s=>sOn('bleed'),p:68,ok:'y_cp_nurse',fail:'death:checkpoint'},
  {t:'줄에 서서 검사를 받는다',if:s=>!sOn('bleed'),to:'y_cp_nurse',adv:20},
  {t:'줄에서 빠져나와 골목으로 사라진다',p:70,move:1,ok:'y_street',fail:'y_street',failEff:{hp:-15,add:'bleed'},adv:5}]};
S.y_cp_pass={loc:'병원 정문 · 군 검문소',
 text:'체온 36.8. 통과. 군인이 「한강 이남으로 가요. 다리는 오늘 밤 닫힙니다」라고 기계적으로 말했다.\n\n트럭 뒤편 바닥에 고인 것은 보지 않으려 했다.',
 choices:[{t:'걷는다',to:'y_street',eff:{men:-5},adv:20}]};
S.y_cp_nurse={loc:'병원 정문 · 군 검문소',
 text:'군인이 사원증과 얼굴을 번갈아 보았다. 「간호사요?」 그는 뒤를 돌아보더니 목소리를 낮췄다. 「저 트럭에 다친 애가 있어요. 봐줄 수 있으면, 통과.」\n\n트럭 안에서 열아홉 살쯤 된 이등병이 허벅지에서 피를 흘리고 있다. 물린 자국은 없다. 총상이다. 자기들끼리 쐈다.',
 choices:[
  {t:'붕대로 지혈하고 상처를 묶는다',need:'bandage',to:'y_cp_after',eff:{take:'bandage',hum:10},adv:20},
  {t:'군복을 찢어 지혈한다',p:50,heal:1,phys:false,ok:'y_cp_after',okEff:{hum:10},fail:'y_cp_lost',failEff:{hum:3,men:-10},adv:25}]};
S.y_cp_after={loc:'병원 정문 · 군 트럭',
 text:'이등병은 살았다. 병장이 허리춤에서 무전기를 풀어 건넸다. 「채널 9. 군 구조 공지가 나와요. 아직은.」\n\n그는 덧붙였다. 「다리는 오늘 밤 닫혀요. 그다음엔… 위에서 정할 거예요.」',
 choices:[{t:'무전기를 받고 걷는다',to:'y_street',eff:{give:'radio',flag:{ch9:1},del:'bleed'},adv:10}]};
S.y_cp_lost={loc:'병원 정문 · 군 트럭',
 text:'피가 멈추지 않았다. 동맥이었다. 이등병은 「엄마」라고 두 번 말하고 조용해졌다.\n\n병장은 한동안 아무 말이 없다가 손짓했다. 가라고. 뒤에서 그가 총을 장전하는 소리가 들렸다. 이등병을 위해서였다.',
 choices:[{t:'뒤돌아보지 않고 걷는다',to:'y_street',adv:10}]};

/* 거리 */
S.y_street={loc:'종로 → 한강 방향 대로',
 enter:s=>{if(s.sec<T(1,10,0))advance(T(1,10,0))},
 text:'거리는 둘로 나뉘어 있었다. 뛰는 사람들과, 뛰는 사람들을 쫓는 것들. 버스 한 대가 옆으로 누운 채 불타고 있다.\n\n모퉁이 약국 셔터가 반쯤 올라가 있다. 안에서 누군가 약을 쓸어 담는 소리. 한강까지는 걸어서 두 시간.',
 memo:{t:'한강변 마트. 생존자 있음.'},
 choices:[
  {t:'약국에 들어간다',to:'y_pharmacy',adv:10},
  {t:'편의점 뒷문으로 들어가 물을 찾는다',p:60,move:1,ok:'y_store_ok',fail:'y_store_fail',adv:20},
  {t:'곧장 한강으로 걷는다',to:'y_dusk',adv:180}]};
S.y_store_ok={loc:'편의점 창고',
 text:'창고 안은 이미 반쯤 털려 있었다. 선반 아래 굴러들어간 생수와 통조림 몇 개. 냉동고 안에서 누군가 웅크린 채 얼어 있다. 아이스크림 상자를 끌어안고.',
 choices:[{t:'챙겨서 나간다',to:'y_dusk',eff:{give:['water','can','can']},adv:150}]};
S.y_store_fail={loc:'편의점 뒷문',
 text:'뒷문을 연 순간 안에 있던 것이 덮쳐 왔다. 문짝으로 밀어붙이고 발로 찼다. 문틈에 끼인 손가락 세 개가 꿈틀거린다.\n\n어깨가 찢겼다. 물리지는 않았다.',
 choices:[{t:'도망친다',to:'y_dusk',eff:{hp:-15,add:'bleed',men:-8},adv:150}]};
S.y_pharmacy={loc:'모퉁이 약국',
 text:'약국 안에 남자 둘. 하나는 진열대를 쓸어 담고, 하나는 카운터 뒤에 쓰러진 약사 가운 차림의 여자를 뒤지고 있다. 둘 다 고개를 들었다.\n\n「누나 혼자?」 한 놈이 웃었다. 시선이 얼굴에서 아래로 천천히 내려간다.',
 choices:[
  {t:'「간호사예요. 필요한 약 골라 줄게요.」',p:60,phys:false,ok:'y_ph_deal',fail:'y_ph_grab',adv:10},
  {t:'무기를 들어 보이며 항생제만 달라고 한다',needW:1,p:78,ok:'y_ph_deal',fail:'y_ph_grab',adv:5},
  {t:'말없이 뒤돌아 나간다',to:'y_dusk',eff:{men:-3},adv:150}]};
S.y_ph_deal={loc:'모퉁이 약국',
 text:'둘은 눈빛을 주고받더니 어깨를 으쓱했다. 항생제와 붕대를 건네받았다.\n\n나가는 등 뒤로 한 놈이 휘파람을 불었다. 「밤에 또 보자, 누나.」',
 choices:[{t:'빠르게 걷는다',to:'y_dusk',eff:{give:['antibiotic','bandage']},adv:150}]};
S.y_ph_grab={loc:'모퉁이 약국',
 text:'한 놈이 손목을 낚아챘다. 다른 놈이 셔터를 내리기 시작한다. 덜컹, 덜컹. 바깥 빛이 줄어든다.\n\n「조용히 하면 안 다쳐.」',
 memo:{t:'안 돼 안 돼 안 돼',warn:1},
 choices:[
  {t:'손가락으로 눈을 찌르고 뛴다',p:50,ok:'y_dusk',okEff:{hum:-2,hp:-5,men:-10},fail:'k_start',adv:150},
  {t:'카운터의 가위를 집어 그의 팔에 꽂는다',p:62,ok:'y_dusk',okEff:{hum:-6,men:-14},fail:'k_start',adv:150}]};

S.y_dusk={loc:'한강 둑 아래 버스 차고지',
 enter:s=>{if(s.sec<T(1,18,40))advance(T(1,18,40),true)},
 text:'해가 졌다. 마트까지는 아직 한 시간. 밤길은 놈들의 것이다. 버스 차고지에 안에서 잠기는 정비실이 있다.\n\n!멀리서 남자들 목소리. 손전등 불빛이 이쪽으로 흔들리며 다가온다.',
 memo:{t:'밤엔 절대 문 열지 말 것.',warn:1},
 choices:[
  {t:'정비실에 숨어 밤을 넘긴다',to:s=>threatTo('y_night_quiet'),adv:20},
  {t:'어둠 속을 뚫고 마트까지 간다',p:55,move:1,ok:'y_mart_gate',fail:'death:siege',adv:60}]};
S.y_night_quiet={loc:'버스 차고지 정비실',
 text:'정비실 안은 기름 냄새와 고요. 밤새 바깥에서 무언가가 버스 유리창을 하나씩 두드리며 지나갔다. 문 앞에서 멈췄다가, 다시 걸어갔다.\n\n한숨도 자지 못했다.',
 choices:[{t:'날이 밝기를 기다린다',to:'y_day2',eff:{men:-6},adv:300}]};

/* 남자 무리 위협 */
S.th_men={loc:s=>night()?'어둠 속, 잠긴 문 앞':'잠긴 문 앞',
 text:'「우리랑 같이 있으면 안전해요. 먹을 것도 있고.」 웃음소리가 섞여 있다. 문틈으로 손전등 빛이 기어 들어와 발끝을 훑고, 무릎을, 가슴께를 천천히 훑는다.\n\n한 사람이 낮게 말한다. 「그냥 따.」',
 memo:{t:'열지 마. 열지 마.',warn:1},
 choices:[
  {t:'대답하지 않고 숨을 죽인다',p:55,ok:'th_pass',fail:'th_break',adv:30},
  {t:'무기를 쥐고 문 너머로 경고한다',needW:1,p:72,ok:'th_pass',fail:'th_break',adv:10},
  {t:'「남편이 곧 와요」라고 거짓말한다',p:42,phys:false,ok:'th_pass',fail:'th_break',adv:10},
  {t:'문을 열고 그들을 따라간다',to:'k_start',eff:{men:-15}}]};
S.th_pass={loc:'잠긴 문 안쪽',
 text:'한참 뒤 발소리가 멀어졌다. 아래층에서 웃음소리가 났다가 끊겼다. 누군가 비명을 질렀다. 여자 목소리였다. 그리고 조용해졌다.\n\n밤새 문고리에서 손을 떼지 못했다.',
 choices:[{t:'아침을 기다린다',to:s=>F('afterMen')||'y_day2',eff:{men:-12},adv:240}]};
S.th_break={loc:'부서진 문 앞',
 text:'문고리가 부서졌다. 손전등 셋이 얼굴을 비춘다. 웃음소리가 멎었다.\n\n「봐, 있잖아.」',
 choices:[
  {t:'무기를 휘두른다',needW:1,p:55,ok:'th_fight',fail:'k_start',failEff:{hp:-15}},
  {t:'창문 밖 배관을 타고 내려간다',p:55,ok:'y_day2',okEff:{hp:-20,add:'leg',men:-10},fail:'death:fall'},
  {t:'비명을 질러 놈들을 불러들인다',p:60,ok:'th_scream',fail:'death:siege'}]};
S.th_fight={loc:'피로 젖은 복도',
 text:'날이 첫 번째 남자의 손목을 갈랐다. 그가 비명을 지르며 주저앉자 나머지 둘이 물러섰다. 피가 바닥 타일 위로 번진다.\n\n「미친년.」 그들은 다친 놈을 끌고 사라졌다. 손이 떨려서 무기를 내려놓을 수가 없다.',
 choices:[{t:'날이 밝기를 기다린다',to:s=>F('afterMen')||'y_day2',eff:{hum:-5,men:-14,hp:-8},adv:240}]};
S.th_scream={loc:'계단참',
 text:'비명이 건물 전체를 울렸다. 아래층에서 무언가 대답했다. 수십 개의 발소리가 계단을 올라온다.\n\n남자들이 먼저 돌아섰다. 그리고 먼저 붙잡혔다. 그 소리를 등지고 반대편 계단으로 뛰었다.',
 choices:[{t:'멈추지 않는다',to:s=>F('afterMen')||'y_day2',eff:{hum:-3,men:-16},adv:240}]};

/* 2일차 아침 → 마트 */
S.y_day2={time:T(2,6,30),loc:'한강 둑길',crisisEnd:1,
 text:'아침 안개. 둑길 위로 시체들이 띄엄띄엄 누워 있다. 몇 개는 아직 움직인다. 다리 쪽에서 밤새 총소리가 났다. 다리는 닫혔다.\n\n마트 옥상의 「생존자 있음」 글씨가 가까워진다.',
 choices:[{t:'마트로 간다',to:'y_mart_gate',adv:50}]};
S.y_mart_gate={loc:'한강변 대형마트 정문',crisisEnd:1,
 text:s=>'셔터 위 옥상에서 누군가 쌍안경으로 내려다본다. 밧줄 사다리가 내려왔다.\n\n옥상에 올라서자 남자 넷이 쇠파이프를 들고 둘러섰다. 가운데 선 사람이 마트 보안실장 오태석이라고 했다. 「물린 데 없는지 봐야지. 옷 벗어. 다.」'+(sOn('bleed')?'\n\n그의 눈이 팔의 상처에 멎는다.':''),
 choices:[
  {t:'시키는 대로 검사를 받는다',to:'m_arrive',eff:{men:-8},adv:20},
  {t:'「여자가 검사해 주세요」라고 요구한다',p:60,phys:false,ok:'m_arrive',okEff:{hum:2},fail:'m_arrive',failEff:{men:-12,flag:{ohGrudge:1}},adv:20}]};

/* ===== 납치·감금 ===== */
S.k_start={loc:'어느 물류창고 · 냉장실',crisis:{name:'감금',len:16,note:'탈출 기회는 많지 않다'},crisisEnd:0,
 enter:s=>{if(F('kid'))return;F('kid',1);F('kidTries',0);s.items=s.items.filter(k=>!ITEMS[k].w);loseBag();sAdd('bound');s.men-=12},
 text:'머리에 자루가 씌워졌다. 트럭 짐칸. 다른 여자들이 숨죽여 우는 소리. 얼마나 달렸는지 모른다.\n\n자루가 벗겨졌을 때, 그곳은 물류창고 냉장실이었다. 쇠사슬. 매트리스 세 장. 여자 넷. 문 위에 매직으로 숫자가 쓰여 있다. 「7」.\n\n「새로 왔네.」 구석의 여자가 쉰 목소리로 말했다. 「울지 마. 우는 애부터 데려가.」',
 memo:{t:'7. 나는 7번.'},
 choices:[{t:'숨을 고르고 주위를 살핀다',to:'k_cell',adv:30}]};
S.k_cell={loc:'물류창고 냉장실 · 7번',crisis:{name:'감금',len:16,note:'사흘에 한 번 트럭이 온다'},
 text:s=>{const t=F('kidTries')||0;return (t?'얼굴이 부어 한쪽 눈이 잘 떠지지 않는다. 쇠사슬이 발목 살을 파고들었다.\n\n':'')+'냉장실 문은 하루 두 번 열린다. 물 한 컵과 빵 반쪽. 문이 열릴 때마다 여자들이 일제히 벽 쪽으로 몸을 붙인다.\n\n밖에서 남자들의 웃음소리, 그리고 이따금 총소리.'},
 choices:[
  {t:'구석의 여자에게 이곳에 대해 묻는다',once:'ktalk',to:'k_talk',adv:30},
  {t:'쇠사슬 고정 볼트를 조금씩 푼다',p:35,mods:[[s=>F('obey'),15,'순종한 척']],ok:'k_bolt',fail:'k_caught',adv:180},

S.k_talk={loc:'물류창고 냉장실',
 text:'여자의 이름은 수정. 서른둘, 미용사였다. 여기 온 지 엿새.\n\n「놈들은 열 명쯤. 대장은 '+'「사장」이라고 불러. 사흘에 한 번 트럭이 와. 그때 몇 명씩 실려 가.」 그녀의 손톱은 모두 부러져 있었다. 「어디로 가는지는 몰라. 돌아온 사람이 없으니까.」\n\n「밥 주는 놈, 오른쪽 주머니에 열쇠 있어. 둘이서 덮치면 돼. 혼자선 안 돼.」',

S.k_bolt={loc:'물류창고 냉장실',
 text:'볼트가 빠졌다. 쇠사슬이 발목에서 미끄러진다. 피가 말라붙은 발목이 가볍다.\n\n수정이 눈으로 묻는다. 나도?',

S.k_caught={loc:'물류창고 냉장실',
 enter:s=>{F('kidTries',(F('kidTries')||0)+1);if(F('kidTries')>=2)return 'k_final'},
 text:'문이 열렸다. 「이년이.」 개머리판이 얼굴을 쳤다. 바닥에 이가 하나 굴렀다.\n\n그들은 수정을 대신 끌고 나갔다. 한 시간 뒤 돌아온 수정은 아무 말도 하지 않았다.',

S.k_final={loc:'물류창고 하역장',crisis:{name:'감금',len:16,note:'트럭이 왔다'},
 text:'트럭이 왔다. 사흘째 밤. 이름 대신 숫자가 불린다.\n\n「7번.」\n\n짐칸에는 이미 여자 셋이 묶여 있다. 운전석 옆 남자가 손전등으로 얼굴을 하나하나 비추며 무언가를 적는다. 가격처럼 보이는 숫자를.',
 memo:{t:'7 7 7 7',warn:1},
 choices:[
  {t:'짐칸에 오르기 직전, 마지막으로 뛴다',p:25,ok:'k_escape',fail:s=>Math.random()<.15?'death:sold':'death:executed',adv:10},
  {t:'순순히 짐칸에 오른다',to:s=>{const r=Math.random();return r<.4?'k_truck':r<.55?'death:sold':'death:captive'},adv:60},
  {t:'수정을 가리키며 「저 여자가 도망치려 했다」고 말한다',to:'k_escape_alone',eff:{hum:-25,men:-10}}]};
S.k_truck={loc:'국도 위 전복된 트럭',
 text:'트럭은 30분을 달리다 무언가에 부딪혀 옆으로 누웠다. 사방에서 놈들이 몰려왔다. 운전석의 남자들이 먼저 끌려 나갔다.\n\n짐칸 문이 비틀려 열렸다. 묶인 손으로 기어 나왔다. 뒤에서 누군가 이름을 불렀다. 대답하지 않았다.',

S.k_escape={loc:'물류창고 담장 밖',
 text:'냉장실 문이 열렸다. 복도, 계단, 철문. 뒤에서 고함. 수정이 손을 잡아끈다. 둘은 담장 개구멍을 기어 빠져나왔다.\n\n갈림길에서 수정은 반대쪽으로 갔다. 「잘 살아.」 돌아보지 않았다.',

S.k_escape_alone={loc:'물류창고 환풍구',

S.k_out={loc:'물류창고 밖, 새벽',crisisEnd:1,

S.m_arrive={loc:'한강변 대형마트 · 1층 로비',
 enter:s=>{if(F('joined'))return;F('joined',1);F('martIn',1);const ks=['kang','harin'];const fate=()=>{const q=Math.random();return q<.5?'road':q<.8?'dead':'raider'};const r=Math.random();

 text:s=>{const k=s.comp.kang.st==='with',h=s.comp.harin.st==='with';let t='로비 바닥에 박스를 깔고 사람들이 앉아 있다. 생존자는 열네 명.\n\n';
  if(k&&h)t+='계산대 옆에 구겨진 정장 차림의 남자와 편의점 조끼 차림의 앳된 여자가 나란히 앉아 있다. 도강혁, 윤하린. 둘은 어젯밤 같은 사다리를 올라왔다고 했다. 강혁이 말없이 생수 한 병을 밀어 주었다.\n\n';
  else if(k)t+='계산대 옆에 구겨진 정장에 사원증 목줄을 건 남자가 손목에 테이프를 감고 있다. 도강혁. 광화문에서 차를 버리고 걸어왔다고 했다. 「간호사요? 다행이다.」\n\n';
  else if(h)t+='계산대 뒤에서 편의점 조끼 차림의 앳된 여자가 컵라면을 나누고 있다. 윤하린, 스무 살. 그녀가 당신 손에 하나를 쥐여 주었다. 「언니, 이거 먹어요. 따뜻해요.」\n\n';
  else t+='아는 얼굴은 없다.\n\n';
  return t+'오 실장과 그의 보안팀 셋. 정육 코너의 박 씨. 고등학교 교사였다는 정미경 선생. 노부부. 대학생 준호. 그리고 민지라는 젊은 여자.\n\n오 실장이 규칙을 읽는다. 식량은 전부 보안팀이 관리한다. 밤에는 아무도 2층 사무실 근처에 오지 않는다. 그리고 여자들은 안쪽 창고 구역에서 잔다.'},
 memo:{t:'오 실장 — 눈이 이상하다. 민지가 그를 보지 않는다.'},
 choices:[
  {t:'머리를 짧게 자르고 남자 옷으로 갈아입는다',if:s=>female(),once:'disg',to:'m_arrive',eff:{add:'disguise',men:-3},adv:30},
  {t:'오 실장에게 의무실을 맡겠다고 제안한다',to:'m_d3',eff:{res:10,hum:-3,flag:{fac:'oh'}}},
  {t:'정 선생 무리 곁에 자리를 잡는다',to:'m_d3',eff:{hum:3,flag:{fac:'jung'}}},
  {t:'누구 편도 들지 않고 구석에 눕는다',to:'m_d3',eff:{flag:{fac:'none'}}}]};
S.m_d3={time:T(3,21,0),skip:1,loc:'마트 · 안쪽 창고 구역',

 text:s=>{const f=F('fac');return '— 일지. 식량 배급은 하루 두 번, 통조림 반 개씩. 오 실장의 보안팀은 하루 세 번 먹는다. 아무도 말하지 않는다.\n\n'+(f==='oh'?'의무실이라 해 봐야 계산대 하나다. 오 실장은 당신에게만 통조림을 하나 더 주었다. 정 선생 무리가 그걸 보았다.\n\n':f==='jung'?'정 선생은 밤마다 사람들을 모아 낮은 목소리로 말한다. 식량 창고 열쇠, 보안팀 교대 시간, 사무실 불이 꺼지는 시각.\n\n':'구석은 조용하다. 조용하다는 건 아무도 당신을 지켜주지 않는다는 뜻이기도 하다.\n\n')+'2층 사무실 불은 밤늦게까지 켜져 있다. 오늘 밤엔 민지가 그 방에 올라갔다. 내려왔을 때 그녀는 통조림 두 개를 들고 있었고, 아무와도 눈을 마주치지 않았다.'},
 memo:{x:'엄마한테 가야',t:'다리 닫혔다. 아직은 못 가.'},
 choices:[
  {t:'민지 곁에 앉아 아무 말 없이 담요를 덮어 준다',to:'ev_A',eff:{hum:4,flag:{minji:1}}},

S.m_bite={time:T(4,16,0),loc:'마트 · 하역장 뒤편',

 text:'오 실장은 아무것도 묻지 않았다. 박 씨를 하역장 밖으로 데리고 나가 셔터를 내렸다. 둔탁한 소리가 세 번.\n\n그날 밤, 박 씨 몫이던 통조림이 당신 앞에 놓였다. 「잘했어, 간호사.」',

S.m_bite_ok={loc:'마트 · 하역장 창고',
 text:'상처를 벌려 검붉은 피를 짜냈다. 피를 멈추지 않았다. 박 씨는 수건을 물고 기절했다.\n\n그 밤도, 다음 밤도 그는 변하지 않았다. 열이 내렸다. 상처 주변의 검은 기운이 옅어졌다. 차트의 그 문장이 머릿속을 맴돈다. 절대 지혈하지 말 것.',

S.m_bite_fail={loc:'마트 · 하역장 창고',

S.m_park_locked={loc:'마트 · 하역장 철문 앞',

S.m_d6={time:T(6,20,0),skip:1,loc:'마트 · 안쪽 창고 구역',
 enter:s=>{if(F('in_d6'))return;F('in_d6',1);eff({res:-8,men:3})},
 text:s=>'— 일지. 식량이 절반으로 줄었다. 오 실장은 배급을 하루 한 번으로 줄였다. 보안팀은 여전히 세 번 먹는다.\n\n'+(F('park')==='with'?'박 씨는 하루 종일 당신 곁을 떠나지 않는다. 밤마다 상처를 보여 주며 묻는다. 「아직 괜찮지?」\n\n':'')+(withN().length?withN().join('와(과) ')+'은(는) 밤마다 탈출 이야기를 한다. 남쪽, 평택, 안전지대.\n\n':'')+'내일은 지하 창고에 내려가야 한다. 오 실장이 정했다. 남은 식량이 거기 있다고.',
 memo:{t:'지하 창고. 셔터 하나. 뒷문 하나.'},
 choices:[{t:'잠을 청한다',to:'m_cellar'}]};
S.m_cellar={time:T(7,21,47),loc:'한강변 마트 — 지하 창고',
 text:s=>'셔터 너머에서 손톱으로 철판을 긁는 소리가 난다. '+mateName()+'이(가) 손전등을 끄라고 손짓한다. 셔터 아래 틈으로 검고 끈적한 것이 천천히 스며든다.\n\n숫자를 세어 본다. 셋, 넷… 아니, 더 많다.',
 memo:{t:'밤엔 절대 문 열지 말 것!!',warn:1},
 choices:[
  {t:'숨을 죽이고 기다린다',to:'m_siege',adv:30},
  {t:'도끼나 파이프로 틈을 내리친다',needW:1,p:50,ok:'m_cellar_ok',fail:'m_cellar_flee',failEff:{hp:-15,add:['leg','bleed']},urgent:'u_cellar',urgentAlt:'m_cellar_flee'},
  {t:'뒷문으로 빠져나간다',p:40,move:1,ok:'m_cellar_back',fail:'death:siege',adv:20},
  {t:'무전기로 옥상 보안팀을 부른다',need:'radio',to:'m_cellar_radio',adv:40}]};
S.u_cellar={urgent:1,alt:'m_cellar_flee',sub:'초 안에 고르지 않으면 끌려간다',
 text:s=>'!셔터가 뜯겨 나갔다.\n\n썩은 손들이 한꺼번에 쏟아져 들어온다. '+mateName()+'이(가) 비명을 지르며 넘어진다. 발목을 무언가가 움켜쥔다.',
 choices:[
  {t:'손목을 내리찍는다',needW:1,p:55,ok:'m_cellar_flee',okEff:{hp:-10,add:'leg'},fail:'death:bite'},
  {t:'선반을 넘어뜨리고 기어서 도망친다',p:35,ok:'m_cellar_flee',okEff:{hp:-15,add:['leg','bleed']},fail:'death:siege'},
  {t:s=>mateName()+'을(를) 걷어차고 문으로 달린다',p:72,ok:'m_cellar_flee',okEff:{hum:-25,men:-15,fn:s=>{const n=mateName();F('lostName',n);if(n==='박 씨')F('park','dead');else{const k=withC().find(k=>COMP[k]===n);if(k)s.comp[k].st='dead'}F('sacrificedMate',1)}},fail:'death:siege'}]};
S.m_siege={loc:'한강변 마트 — 지하 창고',crisis:{name:'포위',len:16,note:'동이 트기까지'},
 text:s=>'셔터가 안쪽으로 휘어 있다. 두드리는 소리는 한 번도 멈추지 않았다. '+mateName()+'은(는) 구석에서 물병을 끌어안고 당신을 보고 있다.\n\n위층에서는 아무도 내려오지 않는다.',
 memo:{t:'해 뜨면 놈들이 느려진다.'},
 choices:[
  {t:'선반으로 셔터를 받친다',p:70,ok:'m_siege2',fail:'m_siege2',failEff:{hp:-10,men:-8},urgent:'u_cellar',urgentAlt:'m_siege2',adv:30},
  {t:s=>'마지막 물을 '+mateName()+'와(과) 나눠 마신다',need:'water',to:'m_siege2',eff:{take:'water',res:8,men:8,hum:4},adv:10},
  {t:'눈을 붙이고 버틴다',to:'m_siege2',eff:{men:-6},adv:60},
  {t:'환풍구로 기어 나간다',lock:s=>sOn('leg')?'다리 부상 — 기어오르기 불가':null,p:45,ok:'m_cellar_back',fail:'death:siege',adv:30}]};
S.m_siege2={loc:'한강변 마트 — 지하 창고',crisis:{name:'포위',len:16,note:'동이 트기까지'},
 text:'4시. 5시. 두드림이 느려진다. 셔터 틈의 검은 것이 굳어 간다.\n\n손목시계 초침 소리가 이렇게 큰 줄 몰랐다.',
 choices:[
  {t:'해가 뜰 때까지 버틴다',to:'m_siege_end',eff:{men:-8},adv:150},
  {t:'지금 셔터를 올리고 계단으로 뛴다',p:45,move:1,ok:'m_siege_end',fail:'death:siege',adv:10}]};
S.m_siege_end={loc:'마트 · 1층 로비',crisisEnd:1,
 text:'동이 텄다. 셔터 너머가 조용해졌다. 상자 두 개를 안고 계단을 올라왔다.\n\n사람들이 유령 보듯 쳐다보았다. 아무도 구하러 내려오지 않았다. 오 실장이 「문 열면 다 죽는다」고 했다고 준호가 작게 말했다.',
 choices:[{t:'상자를 내려놓는다',to:'ev_B',eff:{give:['can','water'],hum:2}}]};
S.m_cellar_ok={loc:'마트 · 지하 창고',
 text:'날이 틈으로 들어온 손가락들을 잘라 냈다. 셔터 너머에서 무언가 물러섰다. 그 틈에 상자 세 개를 들고 계단을 올랐다.\n\n바닥에 손가락이 일곱 개 남았다. 세지 않으려 했는데 세어 버렸다.',
 choices:[{t:'위로 올라간다',to:'ev_B',eff:{give:['can','can','water'],men:-8}}]};
S.m_cellar_flee={loc:'마트 · 지하 계단',crisisEnd:1,
 text:'계단을 기어 올라와 철문을 닫았다. 다리에서 피가 흐른다. 발목에 손톱자국이 다섯 줄. 물린 자국은 없다.\n\n등 뒤 철문이 밤새 울렸다.',
 choices:[{t:'붕대를 찾는다',to:'ev_B',eff:{men:-10}}]};
S.m_cellar_back={loc:'마트 · 하역 통로',crisisEnd:1,
 text:'뒷문 너머 하역 통로. 어둠. 숨을 참고 30미터. 철문을 닫았다. 등 뒤에서 셔터가 무너지는 소리가 났다.\n\n상자 하나는 건졌다.',
 choices:[{t:'위로 올라간다',to:'ev_B',eff:{give:'can',men:-6}}]};
S.m_cellar_radio={loc:'마트 · 지하 창고',
 text:'「옥상, 지하 창고. 셔터 앞에 열 넘게.」 잡음 너머로 욕설, 그리고 옥상에서 쇠파이프로 간판을 두드리는 소리. 셔터 앞의 것들이 하나둘 소리를 따라 빠져나갔다.\n\n상자를 들고 올라오자 보안팀원 하나가 무전기를 낚아챘다. 「이거 어디서 났어?」',
 choices:[{t:'「군인한테 받았어요」',to:'ev_B',eff:{give:['can','can']}}]};

S.m_murder={time:T(9,8,0),loc:'마트 · 냉동창고',crisisEnd:1,
 enter:s=>{if(!F('culprit')){const c=['oh','choi'];if(F('park')!=='dead')c.push('park');F('culprit',pick(c))}},
 text:s=>'냉동창고에서 '+victim()+'이(가) 발견됐다. 목이 졸린 채. 손톱 밑에 누군가의 살갗.\n\n오 실장이 모두를 로비에 모았다. 「범인 나올 때까지 아무도 밥 없어.」 그리고 당신을 보았다. 「간호사. 시체 좀 봐.」',
 memo:{t:'누가?'},
 choices:[
  {t:'시체를 꼼꼼히 검안한다',once:'exam',to:'m_exam',adv:30},
  {t:'오 실장을 지목한다',phys:false,p:s=>20+(F('fac')==='jung'?20:0)+(F('culprit')==='oh'?25:0)+withC().length*10+(F('examined')&&F('culprit')==='oh'?10:0),ok:'m_mutiny',fail:'death:shelterKilled'},
  {t:'보안팀의 최를 지목한다',to:s=>F('culprit')==='choi'?'m_acc_right':'m_acc_wrong',eff:{flag:{accused:'최'}}},
  {t:'박 씨를 지목한다',if:s=>F('park')!=='dead',to:s=>F('culprit')==='park'?'m_acc_right':'m_acc_wrong',eff:{flag:{accused:'박 씨'}}},
  {t:'아무도 지목하지 않는다',to:'m_acc_none'}]};
S.m_exam={loc:'마트 · 냉동창고',
 enter:s=>{F('examined',1)},
 text:s=>{const c=F('culprit');return '목의 멍은 넓다. 손이 큰 사람이다. 엄지 자국이 왼쪽에 더 깊다. 오른손잡이.\n\n손톱 밑 살갗은 검붉다. 할퀸 쪽도 피를 흘렸을 것이다.\n\n'+(c==='oh'?'로비로 돌아왔을 때, 오 실장이 장갑을 끼고 있다는 걸 처음 알아챘다. 어제까지는 없던 장갑이다.':c==='choi'?'보안팀 최의 목덜미에 반창고가 붙어 있다. 그가 당신 시선을 피해 고개를 돌렸다.':'박 씨의 소맷부리에 검붉은 얼룩이 있다. 그는 고기 써느라 묻은 거라고 했다. 고기는 사흘 전에 떨어졌다.')+'\n\n피해자 주머니에서 쪽지가 나왔다. 「사무실 일, 다 말할 거야.」'},
 choices:[{t:'로비로 돌아간다',to:'ev_B'}]};
S.m_acc_right={loc:'마트 · 로비',
 text:s=>F('accused')+'의 얼굴이 하얘졌다. 사람들이 그를 둘러쌌다. 오 실장은 오래 고민하지 않았다.\n\n하역장 셔터가 내려가고, 둔탁한 소리가 들렸다. 그날 저녁 배급은 통조림 하나였다. 아무도 맛을 느끼지 못했다.',
 choices:[{t:'밥을 먹는다',to:'m_deal',eff:{res:8,men:-6}}]};
S.m_acc_wrong={loc:'마트 · 로비',
 text:s=>F('accused')+'은(는) 끝까지 아니라고 했다. 울면서, 무릎을 꿇고, 당신 이름을 부르며. 오 실장은 듣지 않았다.\n\n하역장 셔터가 내려갔다. 그날 밤, 진짜 범인이 로비 저편에서 담배를 피우며 당신을 보고 있었다. 웃고 있었다.',
 memo:{t:'내가 죽였다. 내가.'},
 choices:[{t:'눈을 감는다',to:'m_deal',eff:{hum:-12,men:-14,flag:{wrongAcc:1}}}]};
S.m_acc_none={loc:'마트 · 로비',
 text:'아무도 손을 들지 않자 오 실장이 직접 골랐다. 대학생 준호. 「얘가 어제 냉동창고 근처에 있었어.」\n\n준호는 아니라고 했다. 아무도 그를 위해 말하지 않았다. 당신도.',
 choices:[{t:'고개를 숙인다',to:'m_deal',eff:{hum:-6,men:-10}}]};
S.m_mutiny={loc:'마트 · 로비',
 text:s=>'목소리가 떨리지 않았다. 「손톱 밑의 살갗, 장갑 벗어 보세요.」\n\n로비가 조용해졌다. '+(withN().length?withN().join('와(과) ')+'이(가) 당신 옆에 섰다. ':'')+'정 선생 무리가 하나둘 일어섰다. 보안팀 최가 오 실장의 쇠파이프를 빼앗았다.\n\n오 실장은 하역장 밖으로 쫓겨났다. 셔터 너머에서 그의 고함이 비명이 되기까지 3분이 걸렸다.',
 choices:[{t:'셔터를 등지고 선다',to:'ev_C',eff:{hum:5,men:-6,flag:{ohGone:1}}}]};

S.m_deal={time:T(10,21,0),loc:'마트 · 2층 사무실',
 enter:s=>{if(F('ohGone'))return 'ev_C'},
 text:'오 실장이 사무실로 불렀다. 책상 위에 항생제 한 통, 통조림 다섯 개, 그리고 위스키.\n\n「간호사 선생. 여기서 오래 살고 싶지?」 그는 문을 잠갔다. 「민지는 똑똑해. 당신도 똑똑하잖아.」',
 memo:{t:'싫어',warn:1},
 choices:[
  {t:'거절하고 문으로 걸어간다',p:65,phys:false,ok:'m_deal_no',fail:'m_deal_force'},
  {t:'받아들인다',to:'m_deal_yes'},
  {t:'숨겨 온 칼로 그를 처단한다',needW:1,p:45,ok:'m_oh_killed',fail:'death:shelterKilled'},
  {t:'사람들에게 이 방의 일을 폭로하겠다고 말한다',if:s=>F('minji')||F('fac')==='jung'||withC().length,phys:false,p:40,mods:[[s=>withC().length>0,s=>withC().length*12,'동료'],[s=>F('minji'),15,'민지']],ok:'m_mutiny',fail:'m_deal_no',failEff:{men:-10,flag:{ohGrudge:1}}}]};
S.m_deal_no={loc:'마트 · 2층 계단',
 text:'문고리를 돌리는 동안 등 뒤에서 아무 소리도 나지 않았다. 계단을 내려오는 동안에도.\n\n다음 날부터 당신 몫의 배급이 반으로 줄었다. 오 실장은 웃으며 말했다. 「계산이 안 맞아서.」',
 choices:[{t:'버틴다',to:'ev_C',eff:{res:-10,men:-6,flag:{ohGrudge:1}}}]};
S.m_deal_force={loc:'마트 · 2층 사무실',
 text:'그가 손목을 잡아챘다. 책상 모서리에 허리가 부딪혔다. 위스키 병이 바닥을 굴렀다.\n\n「똑똑하게 굴자니까.」',
 memo:{t:'싫어 싫어 싫어',warn:1},
 choices:[
  {t:'위스키 병으로 그의 머리를 내려친다',p:55,ok:'m_oh_killed',fail:'death:shelterKilled'},
  {t:'소리를 질러 사람들을 부른다',p:40,ok:'m_deal_no',okEff:{men:-12},fail:'death:shelterKilled'}]};
S.m_deal_yes={loc:'마트 · 2층 계단',blackout:'…',
 enter:s=>{s.deals=(s.deals||0)+1;eff({res:25,men:-25,give:['antibiotic','can','can']})},
 text:'새벽에 계단을 내려왔다. 손에 통조림. 다리가 이상하게 가볍고, 머리는 텅 비어 있다.\n\n민지가 창고 입구에 앉아 있다가 아무 말 없이 담요를 덮어 주었다.',
 memo:{t:'괜찮아. 살았잖아. 살았잖아.'},
 choices:[{t:'눈을 감는다',to:'ev_C'}]};
S.m_oh_killed={loc:'마트 · 2층 사무실',
 text:'두 번, 세 번. 그는 책상 위에 엎어진 채 더 움직이지 않았다. 피가 위스키와 섞여 서류를 적셨다.\n\n서랍에 무기고 열쇠, 그리고 무전기. 문밖에서 민지가 서 있었다. 그녀는 아무것도 묻지 않고 걸레를 가지러 갔다.',
 choices:[{t:'열쇠와 무전기를 챙긴다',to:'ev_C',eff:{hum:-8,men:-15,give:['radio','axe'],flag:{ohGone:1}}}]};

S.m_d11={time:T(11,20,0),skip:1,loc:'마트 · 안쪽 창고 구역',
 enter:s=>{if(F('in_d11'))return;F('in_d11',1);eff({res:-6,men:2})},
 text:s=>'— 일지. '+(F('ohGone')?'오 실장이 사라진 마트는 조용하다. 정 선생 무리가 식량을 나눈다. 공평하게, 그래서 모두 조금씩 배고프게.':s.deals?'오 실장이 또 불렀다. 계단 위 사무실 불빛이 어제보다 밝아 보인다.':'오 실장의 보안팀이 밤마다 창고 구역을 서성인다.')+'\n\n밤마다 북쪽에서 연기가 오른다. 약탈자 무리가 다리 북단을 하나씩 털고 있다고, 무전에서 누군가 말했다.',
 memo:{x:'엄마한테 가야',t:'못 가. 이제 못'},
 choices:[
  {t:'다시 사무실로 올라간다',if:s=>s.deals&&!F('ohGone'),to:'m_deal_yes2'},
  {t:'오늘은 올라가지 않는다',if:s=>s.deals&&!F('ohGone'),to:'m_raid',eff:{res:-8,flag:{ohGrudge:1}}},
  {t:'잠든 척 밤을 넘긴다',if:s=>!s.deals||F('ohGone'),to:'m_raid'}]};
S.m_deal_yes2={loc:'마트 · 2층 계단',blackout:'…',
 enter:s=>{s.deals++;eff({res:20,men:-30,give:'can'})},
 text:'두 번째는 첫 번째보다 쉬웠다. 그게 제일 무서웠다.\n\n거울 속 얼굴이 낯설다. 오 실장이 문 앞에서 말했다. 「이제 우리 편이네.」',
 memo:{t:'아무것도 안 느껴져. 아무것도'},

S.m_raid={time:T(12,3,0),loc:'마트 · 정문',
