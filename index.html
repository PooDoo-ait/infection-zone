S.kd_1={loc:s=>F('kdFrom')==='gate'?'평택 안전지대 · 군 통신 천막':'여의도 · 공중전화 부스',crisisEnd:1,
 text:s=>(F('kdFrom')==='gate'?'군의관은 의원 이름을 듣자 얼굴색이 바뀌었다. 10분 뒤 통신 천막. 무전기 대신 위성 전화를 건넨다.\n\n':'')+'신호가 일곱 번 간다. 여덟 번째에 받는다. 비서가 아니라 본인이다.\n\n「채문혁입니다.」\n\n「세진 도강혁입니다. 37층 금고, 기억하시죠. 원본은 제가 갖고 있고, 사본은 세 군데에 흩어 뒀습니다. 제가 연락이 끊기면 열립니다.」\n\n긴 침묵. 그리고 웃음소리. 정치인의 웃음이 아니라 사업가의 웃음.\n\n「원하는 게 뭐요, 도 매니저.」'.split('도강혁').join('도§K§'),
 memo:{t:'체스는 루크부터',warn:1},
 choices:[
  {t:'「통행증, 보급 창고 위치, 그리고 반 중장.」',to:'kd_2',eff:{hum:-4,fn:bj('「…욕심이 정확하네.」 의원은 30초 만에 대답했다. 「내일 아침 영등포 지하상가. 반 중장 사람이 갈 거요.」')},adv:30},
  {t:'「돈은 필요 없습니다. 자리를 주세요.」',to:'kd_2',eff:{hum:-2,flag:{kdSeat:1},fn:bj('「자리라.」 의원이 처음으로 진지해졌다. 「재건 위원회는 아직 비어 있소. 증명해 보시오.」')},adv:30}]};
S.kd_2={loc:'영등포 지하상가',
 text:'— 일지. 영등포 지하상가. 셔터 내린 가게 이백 개. 그 안에 사람 천이백. 이 상가의 원래 주인은 「영등포 박 사장」. 칼잡이 서른.\n\n반 중장의 사람이 군용 트럭 두 대를 끌고 왔다. 수도방위사령부 직인이 찍힌 보급 상자. 통조림, 의약품, 연료. 그리고 소총 열 정.\n\n배급표를 찍었다. 사령부 보급 창고 직인 그대로. 한 장에 통조림 하나. 이 상가에서 이제 돈은 종이고, 종이는 당신이 찍는다.\n\n조직에 이름을 붙였다. 「루크그룹」. 체스에서 루크는 직선으로만 움직인다. 막히는 게 없다.',
 memo:{t:'배급표는 내가 찍는다'},
 choices:[
  {t:'박 사장에게 지분을 준다 — 흡수한다',p:60,phys:false,ok:'kd_2a',okEff:{hum:-4,flag:{kdPark:1},fn:bj('「삼십 퍼센트. 대신 칼은 내가 쓰는 데만 써요.」 박 사장은 배급표 뭉치를 오래 만지작거리다 손을 내밀었다. 그 손에 아직 남의 피가 말라 있었다.')},fail:'kd_2a',failEff:{hp:-15,fn:s=>{F('kdParkWar',1);s.banner={t:'박 사장은 웃으며 거절했다. 그날 밤 칼잡이 셋이 당신 침상을 찾아왔다. 반 중장의 소총이 먼저 말했다. 셋의 시체는 지하상가 입구에 사흘 동안 걸려 있었다. 당신이 그러라고 했다.',bad:1}}},adv:120},
  {t:'박 사장을 제거한다 — 하청의 하청으로',to:'kd_2a',eff:{hum:-14,flag:{kdHit:1},fn:s=>{F('killedHuman',1);s.banner={t:'반 중장의 사람에게 이름 하나를 건넸다. 그 사람은 다른 사람에게, 그 사람은 또 다른 사람에게. 이틀 뒤 박 사장은 지하상가 화장실 칸에서 발견됐다. 목이 변기에 처박혀 있었다. 칼잡이 서른은 다음 날 아침 당신 배급표를 받으러 줄을 섰다. 그 체인 어디에도 당신 이름은 없다.',bad:1}}},adv:120}]};
afterDays('kd_2',3,9);
S.kd_2a={loc:'루크그룹 · 영등포 사무실',
 text:'— 일지. 배급표 유통량 주당 4만 장. 그런데 가격이 안 오른다. 사령부 보급 창고에서 매일 물량이 들어오니까.\n\n반 중장에게 전화했다. 「창고 물량, 2주만 묶어 주시죠. 점검 명목으로.」\n\n그러면 배급표 한 장이 통조림 하나가 아니라 열 개 값이 된다. 지하상가 천이백 명 중 배급표를 열 장 이상 가진 사람은 서른 명이 안 된다.\n\n계산은 끝났다. 남은 건 서명뿐이다.',
 memo:{t:'2주. 천이백.',warn:1},
 choices:[
  {t:'창고를 묶는다',to:'kd_3',eff:{hum:-18,men:-6,give:['can','can','antibiotic'],flag:{kdFamine:1},fn:bj('2주. 지하상가 B구역 노인들이 먼저 쓰러졌고, 병자들이 뒤를 이었다. 열흘째에 배급표 한 장으로 여자 하나를 하룻밤 살 수 있게 됐다. 장부엔 「수요 조정 기간 — 단가 상승 1,040%」. 사망자는 장부에 없다. 사망자는 비용이 아니니까.')},adv:60},
  {t:'일주일만 묶는다 — 굶어 죽는 숫자를 줄인다',to:'kd_3',eff:{hum:-8,men:-4,give:['can','antibiotic'],flag:{kdFamineHalf:1},fn:bj('일주일. 가격은 다섯 배. 죽은 사람은 「일곱밖에」 없었다. 그 「밖에」라는 단어를 당신이 쓰고 있었다.')},adv:60},
  {t:'창고는 건드리지 않는다',to:'kd_3',eff:{hum:2,flag:{kdNoFamine:1},fn:bj('반 중장이 전화로 웃었다. 「도 매니저, 숫자에 약한 줄은 몰랐네.」 그 웃음이 오래 귀에 남았다.',1)},adv:20}]};
afterDays('kd_2a',2,10);
S.kd_3={loc:'루크그룹 · 영등포 사무실',
 text:'— 일지. 루크그룹 장부.\n\n1. 배급표 — 영등포, 대방, 노량진. 주당 7만 장.\n\n2. 통행증 — 평택행 트럭 좌석. 한 장에 금 한 돈.\n\n3. 군 물자 — 수도방위사령부 경로. 소총, 탄약, 방탄복.\n\n4. 인력 — 「안전지대 노동 송출」.\n\n5. 인력 — 「VIP 구역 생활 지원」. 20세 이상 여성, 건강 증명 필수. 보수: 가족 1인 안전지대 우선 입소권.\n\n박 사장 쪽 남자가 사진 열두 장을 책상에 펼친다. 이름 대신 번호. 셋은 지하상가에서 아이를 안고 배급 줄에 서 있던 얼굴이다.\n\n「다들 자원했어요. 애들 들여보내 준다니까.」',
 memo:{t:'4. 5.',warn:1},
 choices:[
  {t:'전부 승인한다 — 「자원」에 동그라미를 친다',to:'kd_3a',eff:{hum:-22,men:-6,flag:{kdAll:1},fn:bj('「자원」이라는 단어에 펜으로 동그라미를 쳤다. 법률 검토 표시다. 서명했다. 석 달 뒤 VIP 구역 담장 밖 배수로에서 여자 하나가 발견된다. 손목에 아직 번호 띠. 6번. 그녀의 아이는 아직 입소 대기 명단에 있다. 장부에는 「계약 중도 해지」.')},adv:60},
  {t:'4번만 승인한다 — 노동은 노동이다',to:'kd_3a',eff:{hum:-12,flag:{kdLabor:1},fn:bj('5번 줄에 줄을 그었다. 박 사장 쪽 남자가 사진을 거두며 말했다. 「사장님. 우리가 안 하면 딴 데서 해요. 단가만 떨어지지.」 그는 사진 한 장을 일부러 책상에 두고 갔다. 7번. 아이를 안고 있는 사진이었다.')},adv:60},
  {t:'4번과 5번 줄을 지운다',to:'kd_3a',eff:{hum:4,flag:{kdClean:1},fn:bj('두 줄을 그었다. 박 사장 쪽 사람들이 회의실을 나가며 문을 세게 닫았다. 깨끗한 장부는 적이 많다.',1)},adv:60}]};
afterDays('kd_3',4,22);
S.kd_3a={loc:'영등포역 광장 · 오전 5시 40분',
 text:s=>'트럭 세 대. 짐칸에 방수포. 줄 선 사람들은 자기가 평택에 간다고 믿는다. 통행증 값으로 금반지를, 결혼반지를, 아버지 금니를 냈다.\n\n사령부 하사가 손목마다 케이블 타이를 채운다. 노란색. 번호가 찍혀 있다. 「검역 절차입니다.」 아무도 의심하지 않는다. 검역이라는 말은 이제 무엇이든 정당하게 만든다.\n\n트럭은 평택 갈림길에서 서쪽으로 꺾는다. 당진 간척지. 철조망 안에서 군 시설 공사. 하루 열여섯 시간. 배급은 반 캔. 쓰러지면 「감염 의심」으로 분리된다. 분리된 사람은 돌아오지 않는다.'+(F('kdAll')?'\n\n세 번째 트럭엔 방수포 대신 커튼이 쳐져 있다. 여자만 탄다. 그 트럭은 평택으로 간다. VIP 구역 뒷문으로.':'')+'\n\n오늘 아침 줄 끝에 낯익은 얼굴. '+(F('kAllies')?'여의도 지하 주차장에서 같이 밤을 넘긴 증권사 사람이다.':'지하상가 입구에서 매일 아침 당신에게 인사하던 편의점 주인이다.'),
 memo:{t:'212',warn:1},
 choices:[
  {t:'모른 척한다 — 장부에 숫자를 적는다',to:'kd_3b',eff:{hum:-14,men:-8,flag:{kdTrucks:1},fn:bj('그가 당신을 알아봤다. 손을 들었다. 반가운 얼굴이었다. 평택 간다고, 고맙다고. 당신은 고개를 끄덕였다. 장부 한 줄. 「송출 212명 — 단가 금 0.3돈 — 반 중장 몫 40%」. 212. 지난주보다 31 늘었다.')},adv:60},
  {t:'그 사람만 줄에서 빼낸다',to:'kd_3b',eff:{hum:-6,men:-4,flag:{kdTrucks:1,kdOne:1},fn:bj('그를 줄에서 끌어냈다. 「당신은 다음 차.」 그는 섭섭해했다. 나머지 211명은 그대로 갔다. 하나를 빼낸 건 양심이 아니었다. 그가 당신 얼굴을 알기 때문이었다.')},adv:30}]};
afterDays('kd_3a',3,5);
S.kd_3b={loc:'수도방위사령부 · 작전 상황실',crisisEnd:1,
 text:'— 일지. 반 중장의 초대. 수도방위사령부 지하 상황실. 대형 스크린에 강북 지도. 빨간 빗금 구역들. 「소독 작전 대상지」.\n\n채 의원이 와인 잔을 들고 지도 앞에 선다. 「재건 기본계획 1단계 부지. 이 빗금 안쪽이요.」\n\n당신은 지도를 본다. 숫자가 보인다. 빗금 하나를 오른쪽으로 두 블록만 옮기면 재건 용지 가치가 세 배가 된다. 그 두 블록에는 아직 사람이 산다. 생존자 신고 인원 340명. 금호동 언덕. 성당 하나.',
 memo:{t:'두 블록. 340.',warn:1},
 choices:[
  {t:'빗금을 옮긴다 — 펜 한 번',to:'kd_3c',eff:{hum:-26,men:-10,flag:{kdBurn:1},fn:s=>{F('killedHuman',1);s.banner={t:'펜으로 선을 그었다. 반 중장이 고개를 끄덕였다. 사흘 뒤 화염방사기 소대가 금호동 언덕을 올라갔다. 성당 종이 한 번 울렸다가 멎었다. 당신은 그날 재건 용지 감정평가서에 서명하고 있었다. 창밖의 연기가 서류 위에 그림자를 드리웠다.',bad:1}}},adv:60},
  {t:'빗금은 그대로 두고, 대신 다른 구역 개발권을 받는다',p:55,phys:false,ok:'kd_3c',okEff:{hum:-6,flag:{kdDeal2:1},fn:bj('「사람 없는 땅이 더 싸게 먹힙니다. 운반비, 처리비, 민원.」 숫자로 설득했다. 채 의원이 웃었다. 「역시.」 금호동은 살아남았다. 당신이 원해서가 아니라, 계산이 그쪽이었을 뿐이다.')},fail:'kd_3c',failEff:{hum:-10,flag:{kdBurn:1},fn:s=>{s.banner={t:'반 중장이 당신 손에서 펜을 가져갔다. 「계산은 우리가 하지.」 빗금은 옮겨졌다. 당신이 그은 게 아니라고, 스스로에게 말했다.',bad:1}}},adv:60}]};
S.kd_3c={loc:'루크그룹 · 창고 B',
 text:'— 일지. 수도방위사령부 무기고에서 소총 이백 정이 「훈련 중 분실」 처리됐다. 그중 백 정이 이 창고에 있다.\n\n구매자 둘. 강북의 「붉은 장갑」, 그리고 그들과 싸우는 「중랑 연합」. 양쪽 다 상대가 우리에게서 총을 산 줄 모른다.\n\n전쟁이 길어질수록 장부가 불어난다. 탄약은 소모품이다.',
 memo:{t:'양쪽에',warn:1},
 choices:[
  {t:'양쪽에 판다 — 탄약은 따로, 비싸게',to:'kd_4',eff:{hum:-16,give:['medkit','antibiotic','antibiotic'],flag:{kdArms:1},fn:bj('두 달 동안 강북에서 사람이 천 명 넘게 죽었다. 총알 한 발 한 발이 장부의 숫자였다. 「붉은 장갑」 우두머리가 대금으로 보낸 항생제 상자에 쪽지가 있었다. 「총 잘 쓰고 있어요. 선생님이.」')},adv:60},
  {t:'한쪽에만 판다 — 이길 쪽에',to:'kd_4',eff:{hum:-10,give:['antibiotic'],flag:{kdArmsOne:1},fn:bj('전쟁은 3주 만에 끝났다. 진 쪽 사람들은 지하상가로 흘러들었다. 그들은 당신 배급표를 받으러 줄을 섰다. 그 줄도 장부에 있다.')},adv:60}]};
afterDays('kd_3c',4,14);
S.kd_4={loc:'루크그룹 · 영등포 사무실',
 text:s=>'— 일지. 채 의원이 직접 왔다. 방탄 SUV, 경호원 넷.\n\n「도 매니저. 일 하나 부탁하지.」 사진 한 장을 책상에 놓는다.\n\n'+(F('kCopy')?'송 피디다. 여의도 송출실의 그 남자. 「이 사람이 하드 사본을 갖고 있소. 평택 외신하고 접촉하려 한다더군.」':'카메라를 멘 외국인. 「UN 옵서버」 완장. 「이 사람이 명단 얘기를 캐고 다니오. 평택 안에서.」')+'\n\n「깔끔하게. 서류도 깔끔하게.」\n\n당신 조직엔 이런 일을 위한 양식이 있다. 「감염 의심자 격리 중 사망 확인서」. 사령부 군의관 서명란은 이미 채워져 있다.',
 memo:{t:'청부',warn:1},
 choices:[
  {t:'받는다 — 양식을 채운다',to:'kd_5',eff:{hum:-18,flag:{kdKillOrder:1},fn:s=>{F('killedHuman',1);s.banner={t:'이름 하나, 장소 하나, 시간 하나. 하청의 하청이 나갔다. 사흘 뒤 확인서가 올라왔다. 「격리 중 발열, 의식 저하, 사망. 화장 완료.」 당신이 직접 쓴 문장이다. 감염 증상 목록은 서윤이라는 간호사가 역에서 붙여 둔 안내문에서 베꼈다.'.split('서윤이라는').join('§S§이라는'),bad:1}}},adv:60},
  {t:'받는 척하고 그 사람을 빼돌린다',p:50,phys:false,ok:'kd_5',okEff:{hum:6,flag:{kdSaved:1},fn:bj('하청보다 한 시간 먼저 사람을 보냈다. 「평택 남쪽 해안. 배가 있어요.」 그가 받은 쪽지엔 당신 이름이 없었다. 확인서는 그대로 올렸다. 「사망, 화장 완료」. 거짓 서류가 처음으로 사람을 살렸다.')},fail:'kd_5',failEff:{flag:{kdBetrayed:1},men:-10,fn:bj('빼돌리던 트럭이 사령부 검문에 걸렸다. 사진 속 사람은 끌려갔다. 확인서는 진짜가 됐다. 채 의원이 전화로 말했다. 「도 매니저. 실망이오.」',1)},adv:60},
  {t:'거절한다 — 「제 장부엔 그 줄이 없습니다.」',to:'kd_5',eff:{hum:2,flag:{kdRefused:1},fn:bj('의원은 웃었다. 「장부에 없는 건 내가 적으면 되지.」 그는 사진을 다시 집어 가지 않았다. 사진 뒷면에 당신 이름이 연필로 적혀 있었다.')},adv:20}]};
afterDays('kd_4',6,15);
S.kd_5={loc:'평택 안전지대 · 재건 위원회 회의실',
 text:s=>'— 일지. 평택. 처음으로 정문을 줄 서지 않고 들어갔다. 사령부 차로. 대기선에 선 사람들 손목의 노란 번호 띠가 차창 밖으로 지나갔다.\n\n재건 위원회. 긴 테이블. 채 의원, 반 중장, 그리고 312명 명단에서 이름을 본 얼굴들. 안건. 「강북 수복 이후 재건 사업 일괄 위탁」.\n\n루크그룹이 단독 응찰했다. 다른 응찰자들은 지난 2주 사이 하나씩 「격리 중 사망」했다.\n\n채 의원이 당신에게만 들리게 말한다. 「이제 우리 쪽이오, 도 매니저. 영원히.」\n\n테이블 아래, 당신 가방 안에 37층 원본이 아직 있다. 그리고 루크그룹의 진짜 장부도.',
 memo:{t:'체크인가 메이트인가',warn:1},
 choices:[
  {t:'의원과 손을 잡는다 — 재건 사업을 받는다',to:s=>darkEndK('seat')},
  {t:'원본으로 의원과 중장까지 쥔다 — 위원회 위에 선다',to:s=>darkEndK('over')},
  {t:'원본과 진짜 장부를 회의실 한가운데 펼친다',to:s=>darkEndK('burn')}]};
afterDays('kd_5',8,10);
function darkEndK(k){if(k==='burn')return 'end:dark_burn_k';const bad=(k==='over'?.5:.3)+(F('kdRefused')?.2:0)+(F('kdBetrayed')?.25:0)+(F('kdParkWar')?.1:0)+(F('kdClean')?.15:0)-(F('kdAll')?.1:0)-(F('kdKillOrder')?.1:0)-(F('kdBurn')?.1:0);return Math.random()<bad?'end:dark_fall_k':'end:dark_rook'}
E.dark_rook={n:DARK+'루크',hid:1,t:s=>'서울 수복 기념식. 단상 맨 끝자리. 사진에는 잘리는 자리. 당신은 그 자리가 좋다.\n\n재건 사업, 배급, 통행, 노동 송출. 무너진 도시를 다시 세우는 모든 돈이 루크그룹의 장부를 지난다. 장부는 깨끗하다. 더러운 줄은 다른 장부에 있다. 그 장부는 당신 머릿속에만 있다.\n\n'+(F('kdBurn')?'금호동 언덕엔 재건 1호 아파트 단지가 올라간다. 모델하우스 자리가 성당 자리다. 분양가는 당신이 정했다.\n\n':'')+'채 의원은 4선을 준비한다. 반 중장은 대장 진급과 합참의장 하마평에 올랐다. 둘 다 당신 전화는 일곱 번 안에 받는다.\n\n가끔 광화문을 지난다. 한빛타워 31층. 그날 아침 민규가 회의 테이블에 이마를 찧었다. 그때 당신은 아직 사람이었다.\n\n'+dateOf(day())+'. 루크는 직선으로만 움직인다. 막히는 게 없다. 돌아갈 길도.'};
E.dark_fall_k={n:DARK+'정리',hid:1,t:s=>'회의가 끝나고 엘리베이터를 탔다. 사령부 헌병 둘이 따라 탔다.\n\n{띵—}\n\n지하 3층. 문이 열렸다. 검은 SUV, 트렁크가 열려 있다.\n\n「사령관님 말씀입니다. 서류는 저희가 보관하겠습니다.」\n\n'+(F('kdRefused')||F('kdBetrayed')?'장부에 없는 줄은 의원이 적었다. 사진 뒷면의 연필 글씨. 당신 이름이 그 줄이었다.':F('kdClean')?'깨끗한 장부는 적이 많았다. 4번과 5번 줄을 지운 날, 박 사장 쪽 사람들이 채 의원실로 찾아갔다.':'숫자는 언제나 맞았다. 당신이 그 숫자 중 하나가 될 줄은 계산하지 않았다.')+'\n\n당진 간척지. 노란 케이블 타이. 번호가 찍혀 있다. 213.\n\n'+dateOf(day())+'. 확인서가 올라왔다. 「격리 중 발열, 의식 저하, 사망. 화장 완료.」 당신이 만든 양식이었다. 루크그룹은 다음 달 이름을 바꿨다. 장부는 그대로였다.'};
E.dark_burn_k={n:DARK+'공개 입찰',hid:1,t:s=>'원본을 테이블 한가운데 펼쳤다. 구조도, 계약서, 손실 보전 확약서, 312명의 명단. 그리고 그 아래 루크그룹의 진짜 장부. 송출 인원, 「생활 지원」 인원, 격리 사망 확인서 사본, 소독 작전 빗금 수정본.\n\n「입찰 서류입니다. 전부.」\n\n회의실이 얼어붙었다. 채 의원의 얼굴이 하얗게 변했다. 반 중장의 손이 허리로 갔다.\n\n'+(F('kdSaved')?'문이 열렸다. 당신이 빼돌렸던 그 사람이 카메라를 들고 서 있었다. 빨간 불이 켜져 있었다.':'회의실 구석의 속기사가 손을 멈추지 않았다. 마지막 줄까지 받아 적었다.')+'\n\n총성이 한 번. 테이블 위로 쓰러졌다. 피가 장부 위로 번졌다. 212, 340, 1,040%. 숫자들이 붉게 젖었다. 그래도 읽혔다.\n\n'+dateOf(day())+'. 루크는 직선으로만 움직인다. 마지막엔 왕을 향해. 당신이 왕이었던 판에서도.'};

/* ===== 31: 성범죄 장면 — 1인칭(당하는 나)은 감각과 생각, 3인칭(보는 나)은 보이는 장면과 소리.
   행위 자체는 쓰지 않는다: 「물건처럼, 장난감처럼 다뤘다」 「수치스러운 것들을 시켰다」로 비워 둔다. ===== */
const mjOK=()=>alive('민지');
/* --- 마트 · 오 실장 --- */
S.m_deal.text=s=>'오 실장이 사무실로 불렀다. 책상 위에 항생제 한 통, 통조림 다섯 개, 위스키.\n\n그가 문을 잠갔다. 열쇠를 셔츠 주머니에 넣고, 단추를 채웠다.\n\n「간호사 선생. 여기서 오래 살고 싶지?」\n\n'+(mjOK()?'「민지는 두 번째부터 안 울었어.」':'「다들 처음에만 울더라.」');
S.m_deal_force.text=s=>'「싫어요.」\n\n말이 끝나기도 전에 뺨이 돌아갔다. 귀가 먹먹했다. 입 안 어딘가가 터진 것 같았다.\n\n머리채가 잡혀 얼굴이 책상에 눌렸다. 온 힘을 다해 그의 손등을 긁었다. 손톱이 뭔가를 파고드는 게 느껴졌다. 그는 아무렇지도 않았다. 손목이 등 뒤로 꺾였다. 어깨가 빠질 것 같았다. 비명을 지르려는데 숨이 들어가지 않았다.\n\n「계속 그렇게 해 봐. '+(mjOK()?'민지도 처음엔 그랬어.':'다들 처음엔 그랬어.')+'」\n\n가운이 뜯겨 나갔다. 그가 웃었다. 그 웃음이 몸보다 먼저 무너뜨렸다.\n\n책상 끝, 손이 닿을 듯 말 듯한 곳에 깨진 위스키 병 목이 굴러 있다.';
S.m_deal_yes.text=s=>'그날 밤, 그는 당신을 물건처럼 다뤘다. 장난감처럼. 수치스러운 것들을 시켰고, 당신이 시키는 대로 할 때마다 만족한 얼굴로 웃었다.\n\n형광등은 끝까지 꺼지지 않았다. 그 깜빡임만 셌다. 마흔일곱에서, 끝났다.\n\n새벽에 계단을 내려왔다. 손에 통조림. 단추는 목 끝까지 채웠다. 손이 떨려서 세 번 만에.\n\n'+(mjOK()?'민지가 창고 입구에 앉아 있다가, 아무것도 묻지 않고 담요를 덮어 주었다. 민지도 그렇게 해 주는 사람이 필요했을 것이다.':'아무도 묻지 않았다. 다들 알았다.');
S.m_deal_yes2.text='두 번째는 첫 번째보다 쉬웠다. 그게 제일 무서웠다.\n\n그는 이번엔 더 많은 걸 시켰다. 당신은 했다. 생각하지 않는 법을 배웠다. 천장의 얼룩 모양을 외웠다.\n\n오 실장이 문 앞에서 셔츠를 여미며 말했다. 「이제 우리 편이네.」';
/* --- 붙잡힌 뒤 (1인칭) --- */
S.c_assault.text='셋이었다.\n\n팔이 바닥에 짓눌렸다. 누군가의 손이 입을 막았다. 담배와 기름 냄새. 그 손을 물었다. 이가 살에 박혔다. 다음 순간 머릿속이 하얗게 터졌다. 한 번, 두 번. 세상이 기울었다.\n\n「얌전히 있으면 금방 끝나.」\n\n그들은 가위바위보로 순서를 정했다.\n\n금방 끝나지 않았다. 그들은 당신을 돌려 가며 장난감처럼 썼다. 웃으면서. 서로에게 뭘 시켜 보라고 떠들면서.\n\n셋이 다 끝났을 때 창밖은 어두웠다. 마지막 남자가 생수 한 병을 던졌다. 「착하게 굴었으니까.」\n\n일어나려다 다리가 풀렸다. 오른손 검지가 욱신거렸다. 손톱이 반쯤 뜯겨 있었다. 그 손을 물어뜯은 대가였다. 그게 유일하게 해낸 일이었다.\n\n그들의 얼굴은 기억한다. 하나도 빠짐없이.';
/* --- 위협 (1인칭, 숨어 있는 나) --- */
S.ev_drunk.text='새벽 2시. 보안팀이 술판을 끝냈다. 비틀거리는 발소리가 여자 구역으로 들어온다.\n\n손전등 빛이 담요를 하나씩 들춘다. 잠시 머물렀다가, 다음으로. 고르는 중이다.\n\n{철컥.}\n\n허리띠 버클 소리. 심장이 귀에서 뛴다. 숨을 쉬면 담요가 움직일 것 같다.\n\n「아까 그 간호사 어디 갔어.」 「그냥 아무나 해.」 「아무나는 싫다니까.」\n\n옆 담요 속에서 누군가의 손이 당신 손목을 꽉 쥔다. 땀에 젖어 있다. 그 손이 떨리는 건지, 당신이 떨리는 건지 모르겠다.';
S.se_soldier.text='새벽 2시. 여자들이 자는 넷째 칸 문이 소리 없이 열린다. 분대원 둘. 하나는 배급 창고 박스를 안고 있다.\n\n「통조림 두 개. 조용히 따라오면.」\n\n빛이 담요 위를 천천히 훑는다. 얼굴에서, 아래로. 빛이 당신 발목에서 멈춘다. 발가락 하나 움직일 수 없다. 그 빛이 계속 거기 있다.\n\n칸 안의 누구도 숨소리를 내지 않는다. 다들 이 거래를 처음 듣는 게 아니다.';
S.ce_guard.text='새벽 2시. 교육관 여자 방 문이 열린다. 자경단 완장 둘. 술 냄새가 먼저 들어온다.\n\n「동그라미 친 방이 어디였더라.」\n\n한 놈이 문 옆 명단을 손전등으로 비춘다. 이름 몇 개에 볼펜 동그라미. 당신 이름에도. 그걸 본 순간 이불 속 손끝이 차가워진다.\n\n「회장님이 이 방은 괜찮다고 했어.」\n\n발소리가 이불 사이로 들어온다. 하나. 둘. 당신 머리맡에서 멈춘다.';
/* --- 냉장실 (처음은 1인칭, 매일은 3인칭으로 본다) --- */
S.k_start.text='머리에 자루가 씌워졌다. 숨이 자루 안에서 뜨겁게 맴돌았다. 트럭 짐칸. 다른 여자들이 숨죽여 우는 소리.\n\n자루가 벗겨졌을 때, 그곳은 물류창고 냉장실이었다. 쇠사슬. 얼룩진 매트리스 세 장. 양동이 하나. 여자 넷. 문 위에 매직으로 숫자. 「7」.\n\n7이 당신이라는 걸 깨닫는 데 오래 걸리지 않았다.\n\n「새로 왔네.」 구석의 여자가 쉰 목소리로 말했다. 앞니가 두 개 없다.\n\n「울지 마. 우는 애부터 데려가.」';
S.k_cell.text=s=>{const t=F('kidTries')||0;return (t?'얼굴이 부어 한쪽 눈이 잘 떠지지 않는다. 쇠사슬이 발목 살을 파고들었다.\n\n':'')+'냉장실 문은 하루 두 번 열린다. 물 한 컵과 빵 반쪽. 가끔은 물이 아니라 사람을 데리러 온다.\n\n「4번.」\n\n4번이 사슬을 양손으로 감아쥐었다. 손등의 힘줄이 불거졌다. 남자가 사슬째 잡아당겼다. 4번의 몸이 매트리스에서 미끄러져 콘크리트 바닥에 끌렸다. 무릎이 쓸려 피가 줄을 그었다. 그녀가 문틀을 붙잡았다. 남자가 군홧발로 그 손가락을 밟았다. 뼈가 꺾이는 소리.\n\n문이 닫혔다. 문 너머에서 웃음소리. 「오늘은 뭐 시킬까.」\n\n두 시간 뒤 4번이 돌아왔다. 질질 끌려서. 블라우스 단추는 하나도 없었다. 그녀는 구석에 누워 벽 쪽으로 몸을 말았다. 왼손 손가락 두 개가 이상한 방향으로 굽어 있었다.\n\n아무도 묻지 않았다. 다음은 누구인지만 생각했다.'};
/* --- 약탈자 아지트 · 냉장실 (3인칭) --- */
{const t0=S.e_ajit.text;S.e_ajit.text=s=>{const t=typeof t0==='function'?t0(s):t0;return t.replace('안에서 여자 우는 소리, 남자들 코 고는 소리,','안에서 여자 우는 소리. 그 위로 남자들 코 고는 소리. 아무렇지도 않게. 냉장실 문 앞 바닥에 브래지어 한 짝과 부러진 손톱 두 개,')}}
{const t0=S.e_raider2.text;S.e_raider2.text=s=>{const t=typeof t0==='function'?t0(s):t0;return t.replace('냉장실 안에서 누가 이름을 불러도 돌아보지 않는다.','밤마다 「사장」이 숫자 하나를 부른다. 문이 열리고, 사슬 끌리는 소리가 복도를 지나 그의 방으로 들어간다. 새벽에 돌아온 여자의 입술이 터져 있으면 당신이 꿰맨다. 냉장실 안에서 누가 당신 이름을 불러도 돌아보지 않는다.')}}

/* ===== 32: 절망의 장면 다듬기 — 1단계(핵심 장면, 자세히) · 2단계(한두 줄 강조) ===== */
const addLine=(id,fn)=>{const sc=S[id];if(!sc)return;const t0=sc.text;sc.text=s=>fn(typeof t0==='function'?t0(s):t0,s)};

/* ---------- 1단계: 핵심 장면 ---------- */
/* 민지가 끌려갈 때 (1인칭) */
S.m_army_take.text=s=>{const n=mjAlt();return '개머리판이 어깨에 꽂혔다. 뭔가 부러지는 소리가 몸 안에서 들렸다. 숨이 막혀 비명도 나오지 않았다. 바닥에 뺨이 닿았다. 차가웠다.\n\n「언니! 언니!」\n\n'+n+'의 목소리. 고개를 들려는데 군홧발이 등을 눌렀다. 눈만 겨우 굴렸다. '+n+'이(가) 트럭 짐칸 문틀을 두 손으로 붙잡고 버티고 있었다. 손가락 마디가 하얗게 질려 있었다.\n\n일어나야 하는데. 일어나야 하는데. 팔에 힘이 들어가지 않았다.\n\n군인이 손가락을 하나씩 떼어 냈다. 마지막 손가락이 떨어질 때 '+n+'이(가) 당신을 봤다. 원망이 아니었다. 그냥 봤다. 그게 더 아팠다.\n\n「간호사는 필요 없어. 이미 있어.」\n\n트럭이 떠났다. 식량 절반과 함께. 배기가스가 얼굴에 덮였다. 그 냄새를 오래 기억할 것이다.'};
/* 배 씨 처형 (3인칭) */
S.ss_purge.text='권 하사가 배 씨의 뒷덜미를 잡아 4번 출구 계단으로 끌었다. 배 씨의 슬리퍼 한 짝이 벗겨져 승강장에 남았다.\n\n「하사님, 하사님, 기름 다 드릴게요. 제 몫 다—」\n\n계단 중간에서 배 씨가 무릎을 꿇었다. 두 손을 모아 비볐다. 권 하사는 그 손을 내려다보지도 않았다.\n\n{탕!}\n\n소리가 터널을 따라 오래 울렸다. 배 씨의 몸이 계단을 세 칸 굴러 내려왔다. 모은 두 손이 그대로였다.\n\n권 하사가 그 발목을 잡아 셔터 밖으로 밀어냈다. 승강장의 예순 명은 아무도 소리를 내지 않았다. 누군가 남은 슬리퍼를 발로 밀어 선로에 떨어뜨렸다.\n\n그날 밤부터 배급표는 권 하사가 쥐었다.';
/* 엄마 (1인칭) */
S.e_home3.text='현관 비밀번호는 그대로였다. 엄마 생일. 버튼 누르는 손가락이 떨려서 두 번 틀렸다.\n\n엄마는 식탁 의자에 앉아 있었다. 등을 보인 채. 식탁 위에 약봉지들, 달력에 날짜마다 그어진 줄. 줄은 열하루째에서 멈췄다. 열하루. 당신이 마트 창고에서 버티던 그날.\n\n「엄마.」\n\n엄마의 어깨가 움찔했다. 천천히 고개를 돌렸다. 눈이 하얗다. 입가에 말라붙은 검은 것. 엄마가 의자에서 일어나려다 식탁 다리에 걸려 비틀거렸다. 그래도 이쪽으로 왔다. 당신 목소리를 향해.\n\n문은 끝까지 열지 않았다. 혼자서, 안에서. 아무도 들이지 않으려고. 당신이 오기 전까지는.';
S.e_home4.text='엄마는 생각보다 가벼웠다.\n\n침대에 눕혔다. 이불을 덮었다. 장롱에서 엄마가 제일 아끼던 스카프를 꺼냈다. 결혼기념일마다 하던 그 하늘색. 얼굴을 덮었다. 스카프 아래로 손이 비어져 나와 있었다. 그 손을 이불 안에 넣어 주다가, 그 손을 잡고 오래 앉아 있었다.\n\n「늦어서 미안해.」\n\n대답은 없었다. 처음으로, 엄마가 대답하지 않는 게 무섭지 않았다.\n\n창밖은 조용하다. 이 집엔 물탱크 물이 아직 남아 있다.';
/* 아기를 잃은 분만 (1인칭) */
S.ss_birth_loss.text='머리가 나왔을 때 아기는 이미 울지 않았다. 파랬다. 너무 작았다.\n\n입에 숨을 불어넣었다. 작은 가슴을 손가락 두 개로 눌렀다. 서른 번, 두 번. 서른 번, 두 번. 손가락 밑에서 갈비뼈가 휘는 게 느껴졌다. 멈추면 끝이라는 걸 알아서 멈추지 못했다.\n\n「선생님.」 한 계장이 당신 손목을 잡았다. 「선생님, 그만.」\n\n그때야 당신 손이 떨리고 있다는 걸 알았다.\n\n소연이 아기를 달라고 했다. 안겨 주었다. 그녀는 소리 내 울지 않았다. 아기 귀에 대고 뭔가를 계속 속삭였다. 이름이었다. 미리 지어 둔.\n\n아침까지 아기를 놓지 않았다.';
/* 성당 화재 (3인칭) */
addLine('ch_fire_save',(t,s)=>t.replace('스테인드글라스가 한꺼번에 녹아내리는 소리.','스테인드글라스가 한꺼번에 녹아내리는 소리. 그리고 그 사이로, 교육관 2층 창문에서 누군가 이름을 부르는 소리. 창틀을 붙잡은 손이 보였다. 불길이 그 손을 덮었다. 손은 한참 뒤에야 놓였다.'));
/* 계단 압사 (3인칭) */
addLine('ss_flood_order',(t,s)=>t.replace('계단에서 셋을 잃었다.','계단에서 셋을 잃었다. 넘어진 사람 위로 사람들이 밟고 올라갔다. 아무도 멈추지 않았다. 멈출 수가 없었다. 물이 빠진 뒤 계단 중간에서 셋을 찾았다. 하나는 아직 난간을 붙잡고 있었다. 손가락을 하나씩 펴야 했다.'));
/* 소독 작전 (3인칭) */
S.ss_stay_out.text='백기는 수건이었다. 마흔 명이 줄지어 계단을 올랐다. 햇빛에 눈이 멀었다.\n\n방독면들이 한 명씩 이마에 체온계를 댔다. 삑. 삑. 삑.\n\n삑— 길게.\n\n「37.9. 열외.」 할머니 하나가 줄에서 끌려 나갔다. 「감기예요, 감기라고요!」 아들이 따라 나서려다 개머리판에 주저앉았다.\n\n삑— 또 길게. 이번엔 젊은 남자. 그는 아무 말도 하지 않았다. 트럭 뒤로 걸어갔다. 스스로.\n\n{탕. 탕.}\n\n나머지는 트럭에 실렸다. 남쪽으로 간다고 했다. 아무도 뒤를 돌아보지 않았다. 4번 출구에서 검은 연기가 올라오기 시작했다.';
addLine('ch_stay3',(t,s)=>t+'\n\n교육관 창문마다 얼굴이 붙어 있다. 막달레나 할머니가 묵주를 쥐고 중얼거린다. 「여기서 죽을 거야. 우리 신부님 계신 데서.」');
/* 성당에서 쫓겨난 아홉 (3인칭) */
S.ch_fever_out.text='아홉 명이 쇠창살 밖으로 나갔다. 열 때문에 비틀거리면서. 박 회장이 문간에 서서 숫자를 셌다. 하나, 둘, 셋.\n\n응우옌 씨가 란을 업고 계단을 내려가다 한 번 돌아봤다. 당신을 봤다. 란이 그의 어깨 너머로 손을 흔들었다. 열이 올라 볼이 빨갰다.\n\n그날 밤 계단 아래에서 소리가 났다. 처음엔 남자의 고함. 베트남어였다. 그다음엔 여자의 비명. 길게. 그리고 아무 소리도.\n\n교육관 사람들은 다들 이불을 머리끝까지 덮었다. 아무도 입에 올리지 않았다.\n\n다음 날부터 명부는 박 회장이 쥐었다.';

addLine('ss_leave',(t,s)=>t.replace('다은이 당신 소매를 붙잡고 있다. 아무 말도 하지 않는다. 놓지도 않는다.','다은이 당신 소매를 붙잡고 있다. 아무 말도 하지 않는다. 놓지도 않는다.\n\n작은 손이 소매 천을 한 바퀴 감아쥐었다. 손가락 마디가 하얗다. 떼어 내려면 하나씩 펴야 한다. 그 손가락들을 내려다보는데, 목 안쪽이 막혀 숨이 안 쉬어졌다.'));

addLine('e_heli_miss',(t,s)=>t.replace('헬기는 돌아오지 않았다.','헬기는 돌아오지 않았다. 옥상 끝에서 누군가 아직 두 팔을 흔들고 있었다. 헬기가 점이 되고 나서도. 점이 사라지고 나서도.'));
addLine('e_stay_fall',(t,s)=>t.replace('사람들은 흩어졌다.','셔터가 휘어 들어온 그 밤, 누군가 「애들 먼저!」라고 외쳤다. 그 목소리가 가장 먼저 끊겼다. 사람들은 흩어졌다.'));
addLine('se_knock',(t,s)=>t.replace('「엄마… 엄마 여기 있어요? 문 열어 주세요.」','「엄마… 엄마 여기 있어요? 문 열어 주세요. 착하게 있을게요. 진짜로요.」\n\n셔터 틈으로 작은 손가락이 들어왔다가 빠졌다.'));
addLine('ce_knock',(t,s)=>t.replace('「들어가게 해 주세요. 아기가 열이 나요.」','「들어가게 해 주세요. 아기가 열이 나요. 저는 밖에 있을게요. 아기만, 아기만요.」\n\n그녀가 쇠창살 사이로 아기를 밀어 넣으려 한다. 창살 간격이 좁다. 아기가 운다.'));

addLine('dg_turned',(t,s)=>t+'\n\n노인의 손이 옆 사람 담요 끝을 쥔다. 사흘 전 그 사람에게 마지막 사탕을 나눠 주던 손이다.');

const KV=(a,b)=>isKang()?b:a;
const deadList=()=>{const d=(F('deadN')||[]).filter((x,i,a)=>a.indexOf(x)===i);return d.length?d.slice(-6).join('. ')+'.':''};

/* ---------------- 사망 ---------------- */
Object.assign(D.bite,{t:s=>'앞니가 어깨 근육을 파고들었고, 질긴 것이 뚝, 뚝 두 번 끊겼다. 놈이 고개를 비틀며 물러나자 손바닥만 한 살점이 같이 딸려 나갔다. 드러난 자리에서 하얀 힘줄과 쇄골 끝이 잠깐 보였다가 피에 잠겼다.\n\n'+KV('머리가 먼저 계산했다. 경정맥은 비껴갔고, 출혈은 잡힌다. 문제는 그다음이었다. 상처 가장자리의 피가 교과서보다 훨씬 빨리, 검게 굳어 가고 있었다.','숫자부터 떠올랐다. 물린 사람이 변하기까지 걸린 시간, 지금까지 본 것들의 평균. 상처 가장자리의 피가 눈에 보일 만큼 빨리, 검게 굳어 가고 있었다.')+'\n\n손끝부터 차가워졌고, 이가 저절로 딱딱 부딪쳤다. 마지막으로 든 생각은 이상하게도 '+KV('이송 서류의 문장이었다. 절대 지혈하지 말 것.','민규의 붕대였다. 그 붕대 위로 배어 나오던 검은 물.')});
Object.assign(D.siege,{t:'처음 손이 머리채를 잡았고, 두 번째 손이 손목을, 세 번째가 발목을 잡았다. 넘어진 뒤로는 무게였다. 썩은 고기 냄새를 풍기는 몸들이 위로, 위로 쌓였다.\n\n누군가의 이가 종아리를 물었고, 누군가의 손톱이 옆구리 살을 갈랐다. 배 속의 따뜻한 것이 바깥 공기에 닿는 느낌이 났다. 비명을 지르려고 열린 입 안으로 누군가의 피가 흘러들었다.\n\n하늘은 보이지 않았다. 마지막까지 보인 건 자기 손이었고, 그 손가락이 하나씩 사라지고 있었다.'});
Object.assign(D.noise,{t:'사이렌이 울리자 거리 전체가 고개를 돌렸다. 백 개가 넘는 머리가, 동시에.\n\n앞 유리가 먼저 거미줄처럼 금 갔고, 그다음엔 옆 창문이었다. 깨진 틈으로 유리 조각에 살이 찢겨 너덜너덜한 팔들이 아랑곳없이 쏟아져 들어왔다.\n\n운전석 문이 뜯겨 나간 뒤에도 사이렌은 끝까지 꺼지지 않았다. 그 소리 아래로 젖은 것을 씹는 소리가 섞였다. 당신의 소리였다.'});
Object.assign(D.bleed,{t:s=>'피가 멈추지 않았다. 손바닥으로 눌렀고, 옷을 뭉쳐 눌렀고, 마지막엔 그냥 바라보았다. 바닥에 고인 피가 신발 밑창 높이까지 차올랐다.\n\n'+KV('간호사의 눈이 자기 몸을 읽었다. 축축하고 차가운 피부, 빠르고 가는 맥박, 아마 70 아래로 떨어졌을 수축기 혈압. 쇼크 3기. 입술이 파래지는 걸 손거울 없이도 알 수 있었다.','몸이 숫자를 잃어 가는 게 느껴졌다. 심장은 미친 듯이 뛰는데 손끝까지 닿지 않았다. 입술이 저렸다. 처음으로, 계산이 끝까지 맞지 않았다.')+'\n\n시야 가장자리가 까맣게 말려 들어왔다. 숫자를 세다가, 어디까지 셌는지 잊었다.'});
Object.assign(D.starve,{t:'사흘째부터 배고픔이 사라졌다. 그게 나쁜 신호라는 걸 알았다.\n\n갈라진 입술에서 난 피를 핥아 먹었다. 갈색이던 소변은 이내 나오지 않았고, 꼬집은 피부는 텐트처럼 선 채 돌아오지 않았다. 심장이 가끔 박자를 놓쳤다. 그럴 때마다 가슴에 손을 얹고 다음 박자를 기다렸다.\n\n마지막 날엔 벽지를 씹었다. 풀 맛이 났다. 그게 이 세상에서 마지막으로 느낀 맛이었다.'});
Object.assign(D.mind,{t:s=>'문 두드리는 소리가 들렸다. '+KV('엄마 목소리였다. 「서윤아, 문 열어. 엄마야.」','어머니 목소리였다. 「§K§아, 문 열어. 엄마야.」')+' 사흘 내내.\n\n손톱으로 팔뚝을 피가 날 때까지 긁어야 소리가 잠깐 멎었다. 수첩엔 같은 문장이 수백 번 적혔고, 글씨는 점점 커지고 비뚤어지다가 마지막엔 종이를 뚫었다.\n\n결국 문을 열었다. 거기 서 있던 건 엄마의 얼굴을 한 것이었다. 그것이 웃으며 입을 벌렸을 때, 당신도 웃고 있었다.'});
Object.assign(D.raiders,{t:s=>'총성은 생각보다 작았다. 가슴이 뜨거워지고 다리가 풀렸다. 쓰러진 채 기침을 하자 피거품이 나왔다. '+KV('폐다. 간호사의 머리가 혼자 진단을 내렸다. 긴장성 기흉, 오른쪽.','폐다. 숨을 들이쉴 때마다 가슴 안에서 무언가 바람 빠지는 소리가 났다.')+'\n\n누군가 가방을 뒤집으며 「씨발, 이게 다야?」 하고 욕했다. 군홧발이 상처를 밟고 지나갔다. 아무리 들이마셔도 숨이 들어가지 않았다.\n\n그들은 신발까지 벗겨 갔다. 맨발에 닿는 아스팔트가 시렸다. 그게 마지막 감각이었다.'});
Object.assign(D.fall,{t:'발이 허공을 디뎠다. 떨어지는 동안 생각할 시간이 있었다. 너무 많았다.\n\n다리가 먼저 땅에 닿았고, 정강이뼈가 무릎을 뚫고 위로 솟는 소리를 들었다. 그다음은 골반, 그다음은 머리였다. 하얗게 터졌던 시야가 돌아왔을 때 다리 한쪽이 남의 다리처럼 이상한 각도로 몸 옆에 놓여 있었다.\n\n아래에서 기다리던 것들이 천천히 모여들었다. 도망칠 수 없다는 걸, 부러진 다리를 내려다보며 알았다.'});
Object.assign(D.gas,{t:'가스 냄새에 익숙해졌다. 따뜻했으니까. 한밤중, 누군가 초에 불을 붙였다.\n\n집이 한 번 숨을 들이쉬었다가 내뱉었다. 압력에 고막이 먼저 터져 세상의 소리가 사라졌고, 그다음에 불이 왔다. 타는 냄새가 났다. 자기 머리카락이었다.\n\n얼굴에 손을 대자 피부가 장갑처럼 미끄러져 내려왔다. 소리 없는 세상에서 불길만 아름답게 흔들렸다.'});
Object.assign(D.checkpoint,{t:s=>'「소매 걷어.」 거짓말은 소용없었다. 군인은 상처를 보고 아무 표정 없이 고개를 끄덕였다.\n\n트럭 뒤편은 진흙과 피로 질척였다. 먼저 끌려온 사람들이 엎드려 있었고, 뒤통수마다 같은 크기의 구멍이 나 있었다. 무릎이 꿇려졌다. 머리에 닿은 총구가 차가웠다.\n\n'+KV('「물린 거 아니에요. 긁힌 거예요. 저 간호사예요.」','「물린 거 아니에요. 긁힌 거예요. 확인해 보세요, 제발.」')+'\n\n방독면 너머에서 숨소리 하나 변하지 않았다. 아주 작은 방아쇠 소리. 줄은 아무 일 없다는 듯 한 칸 앞으로 갔다.'});
Object.assign(D.turned,{t:'팔의 상처가 더 이상 아프지 않았다. 열도 없었다. 괜찮은 줄 알았다.\n\n밤사이 체온이 떨어지고 손톱 밑이 보라색으로 변했다. 입안에 쇠 맛이 고였다. 미친 듯이 배가 고팠다. 옆에서 자는 사람의 목덜미에서 맥박이 뛰는 게 보였고, 그 소리까지 들렸다.\n\n마지막으로 남은 생각은 누구에게도 들키지 않았다는 안도였다. 그 생각도 곧 배고픔에 먹혔다.'});
Object.assign(D.timeout,{t:'고르지 못했다. 손가락이 떨리는 동안 12초가 지나갔다.\n\n망설임은 선택이 아니라 공백이었고, 그 공백 속으로 놈들이 들어왔다. 첫 번째 이빨이 손가락을 물었을 때에야 몸이 움직였다. 너무 늦게.\n\n두 번째는 손목, 세 번째는 어깨였다. 바닥에 끌려 내려가면서도 머릿속에서는 아직 선택지를 고르고 있었다. 어느 쪽이 맞았을까. 이제는 아무래도 상관없는 질문이었다.\n\n세상은 기다려 주지 않는다. 놈들은 더더욱.'});
Object.assign(D.executed,{t:'무릎이 꿇려졌다. 「사장」은 바쁜 사람처럼 손목시계를 보았다. 「본보기야. 다들 잘 봐.」\n\n쇠파이프가 먼저 무릎을 부쉈고, 넘어지자 두 번째가 어깨를 부쉈다. 사람들 앞에서, 천천히. 세 번째부터는 세지 않았다. 귀에서 따뜻한 것이 흘러나왔다.\n\n마지막으로 본 것은 냉장실 문 위의 숫자였다. 그 아래에서 여자들이 눈을 감지 못하고 있었다.'});
Object.assign(D.captive,{t:'트럭이 멈춘 곳은 더 깊은 창고였다. 물은 이틀에 한 번, 빵은 사흘에 한 번 들어오다가 끊겼다.\n\n쇠사슬에 쓸린 발목이 곪아 구더기가 생겼다. 처음엔 털어 냈지만 나중엔 그럴 힘도 없었다. 옆 매트리스의 여자는 닷새째 움직이지 않았고, 냄새가 났다. 아무도 치우러 오지 않았다.\n\n벽에 손톱으로 날짜를 그었다. 열넷까지. 열다섯째 줄은 반쯤 긋다 멈췄다. 손톱이 부러졌기 때문인지, 손이 멈췄기 때문인지는 아무도 모른다.'});
Object.assign(D.shelterKilled,{t:'하역장 셔터가 당신을 사이에 두고 내려갔다.\n\n막으려고 든 팔이 첫 번째 쇠파이프에 부러졌다. 두 번째는 관자놀이였다. 세상이 옆으로 기울었고, 콘크리트 바닥에 얼굴이 닿자 입안에서 이가 굴렀다. 위에서 숨을 몰아쉬는 소리가 들렸다. 사람의 숨소리였다.\n\n다음 날 배급표에서 당신 이름이 지워졌다. 누군가 당신 몫의 통조림을 받았다. 맛있게 먹었다.'});
Object.assign(D.sold,{t:s=>'트럭 짐칸은 어두웠고 오줌 냄새가 났다. 목에 걸린 플라스틱 번호표가 흔들릴 때마다 딸깍거렸다.\n\n트럭이 멈춘 곳에서 낯선 남자들이 손전등으로 얼굴을 하나씩 비췄다. 턱을 잡아 입을 벌리고, 가축을 고르듯이 이를 확인했다. 숫자가 오갔고, 당신의 숫자도 오갔다. 누군가 웃으며 '+KV('「간호사면 더 쳐줘야지」','「손 하얀 거 보니 사무실 놈이네」')+'라고 했다.\n\n번호표를 새것으로 갈아 걸었다. 이름은 묻지 않았다. 그날 이후로 다시는, 아무도.'});
Object.assign(D.drown,{t:'물은 생각보다 차갑고 무거웠다. 물을 먹은 옷이 몸을 끌어내렸다. 숨을 참았다. 30초, 40초.\n\n발목을 붙잡은 것이 놓지 않았다. 내려다보니 물속에서 하얗게 불어 터진 얼굴이 웃고 있었다. 입술이 없어서 웃는 것처럼 보였다.\n\n결국 숨을 들이켰다. 차가운 강물이 기관지로 쏟아져 들어와 폐가 불타는 것 같았다. 수면의 빛이 동전만큼 작아지다가, 꺼졌다.'});
Object.assign(D.hypothermia,{t:s=>'영하는 아니었다. 그래도 젖은 옷은 바람을 그대로 통과시켰고, 빈속이 만들어 낼 열은 처음부터 없었다.\n\n떨림이 멈췄을 때 따뜻하다고 느꼈다. '+KV('중심 체온 32도 아래. 간호사인 당신은 그게 무슨 뜻인지 알았다.','그게 좋은 신호가 아니라는 것쯤은 알았다.')+' 하얗게 굳어 가는 손가락은 감각이 없어서 아프지도 않았다. 이상하게 덥다는 생각이 들어 외투를 벗었다. 그것도 증상이라는 걸 알면서, 알면서도 벗었다.\n\n아침 서리가 속눈썹 위에 내려앉았다. 눈은 감기지 않았다.'});
Object.assign(D.sepsis,{t:s=>'다리 상처가 곪았다. 처음엔 붉었고, 다음엔 부었고, 그다음엔 검푸른 줄이 사타구니 쪽으로 기어 올라갔다. 고름에서 단내가 났다.\n\n열이 40도를 넘자 헛것이 보였다. 이가 부딪쳐 혀를 깨물었다. '+KV('자기 증상을 하나하나 짚을 수 있었다. 빈맥, 저혈압, 의식 저하, 다발성 장기 부전. 쓸 약은 없었다.','검색할 휴대폰도, 물어볼 사람도 없었다. 몸 안에서 무언가 하나씩 꺼져 가는 게 느껴졌다.')+'\n\n마지막 날엔 엄마가 이마를 짚어 주는 꿈을 꾸었다. 엄마 손도 뜨거웠다.'});
Object.assign(D.betrayal,{t:'눈을 떴을 때 가방도, 신발도, 무기도 없었다.\n\n휴게소 뒤편에서 손전등 세 개가 다가왔다. 맨 앞에 선 얼굴을 알았다. 어젯밤 마지막 통조림을 반으로 나눠 먹은 얼굴이었다. 미안해하지 않았다. 「저 사람이야. 약 아는 사람.」\n\n도망치려다 넘어졌다. 누군가 머리채를 잡고 아스팔트에 얼굴을 찍었다. 코가 부러지는 소리가 한 번, 두 번 들렸고, 세 번째부터는 들리지 않았다.\n\n마지막으로 본 건 그 얼굴이 당신 가방에서 통조림을 꺼내 따는 모습이었다. 어젯밤처럼, 반으로 나누지는 않았다.'});
Object.assign(D.crushed,{t:'쌀 포대를 끌어당기는 순간 지붕이 낮게 신음하더니 내려앉았다.\n\n가슴 위에 걸린 서까래 아래로 갈비뼈가 하나씩 안으로 접혔다. 숨을 들이쉴 수가 없어서 내쉬기만 했다. 조금씩, 조금씩, 더는 내쉴 것이 없을 때까지.\n\n입가로 거품 섞인 피가 흘렀다. 손끝에 쌀알이 닿았다. 따뜻한 밥 냄새를 상상했다. 김이 오르는 흰 밥. 그 생각을 붙잡은 채로.'});
Object.assign(D.fire,{t:'연기가 먼저 왔다. 검고, 기름지고, 뜨거웠다. 세 번 들이마시자 목 안이 타들어 갔고, 쉬던 목소리가 이내 나오지 않았다.\n\n계단은 아래로도 위로도 불이었다. 불 속에서 머리카락이 다 타고 피부가 녹아내린 누군가가 걸어 나왔다. 그래도 계속 걸었다. 산 사람인지 놈인지 구분이 안 됐다.\n\n바닥에 엎드려 차가운 타일에 볼을 댔다. 그게 마지막으로 느낀 차가움이었다.'});
Object.assign(D.poison,{t:s=>'배가 고팠다. 부풀어 오른 통조림이 이상하다는 걸 알았지만, 배가 더 고팠다.\n\n다음 날 아침 눈꺼풀이 내려앉고 물체가 둘로 보였다. 삼킬 수 없는 침이 입가로 흘렀다. '+KV('보툴리눔. 신경독은 아래로 내려온다. 팔, 가슴, 횡격막.','팔이 먼저 무거워졌고, 그다음은 가슴이었다. 무언가가 몸을 위에서부터 꺼 가고 있었다.')+'\n\n의식은 끝까지 또렷했다. 숨을 쉬라고 몸에 명령했지만 몸은 듣지 않았다. 마지막 몇 분은 자기가 질식하는 걸 처음부터 끝까지 지켜보는 시간이었다.'});
Object.assign(D.suffocate,{t:'기계실 바닥에 무릎을 꿇었을 때는 머리가 아픈 줄만 알았다. 숨을 크게 쉬었다. 크게 쉴수록 더 모자랐다.\n\n손끝이 저렸고, 귀에서 높은 소리가 났다. 옆에 쓰러진 사람의 가슴이 오르내리는 걸 세다가, 그게 멈춘 걸 알아차리는 데 한참 걸렸다. 생각이 물속처럼 느려졌다.\n\n손전등이 바닥을 굴러 천장을 비추었다. 그 빛을 보면서 생각했다. 촛불이 꺼졌던 높이를. 그 높이가 지금 눈높이였다는 것을.'});
Object.assign(D.stampede,{t:'계단에서 넘어졌다. 일어나려고 했을 때 첫 번째 발이 등을 밟았고, 두 번째 발은 머리를 밟았다.\n\n가슴 위에 사람이 쌓였다. 사람 무게가 이렇게 무거운 줄 몰랐다. 숨을 들이쉴 틈이 없었다. 누군가의 무릎이 옆구리를 눌렀고, 갈비뼈 하나가 안쪽에서 꺾였다.\n\n위에서 누군가 「미안해요, 미안해요」라고 했다. 그 사람도 밀리고 있었다. 그 목소리를 마지막으로, 계단 냄새도 발소리도 멀어졌다.'});
Object.assign(D.smoke,{t:'불길은 아직 멀었는데 연기가 먼저 왔다. 한 번 들이마시자 목이 닫혔고, 두 번째엔 무릎이 꺾였다.\n\n바닥 가까이에 공기가 있다는 걸 알고 있었다. 알고 있었는데, 몸이 따라 엎드리지 않았다. 눈물이 나서 앞이 보이지 않았고, 손을 뻗은 벽은 이미 뜨거웠다.\n\n검은 연기 너머로 누군가 이름을 부르는 소리가 들렸다. 대답하려고 연 입으로 연기가 밀려 들어왔다. 대답은 끝내 나가지 못했다.'});
Object.assign(D.lynch,{t:'박 회장의 방망이가 귀 뒤쪽으로 먼저 왔다. 무릎이 저절로 꺾였고, 마당 자갈이 뺨에 박혔다.\n\n일어나려고 짚은 손을 누군가 밟았다. 자갈 사이에서 손가락뼈가 으스러지는 걸 소리보다 먼저 느꼈다. 자경단 완장들이 둘러섰다. 셀 수 없는 발이었다.\n\n「신부의 개.」\n\n머리 위에서 기울어진 통에서 차가운 것이 목덜미를 타고 등으로 흘렀다. 그게 무엇인지 알았을 때 처음으로 소리를 질렀다. 목소리가 아니라 짐승 소리였다.\n\n아주 작은 성냥 긋는 소리.\n\n마지막으로 본 건 지훈이 매달려 있던 그 종탑이었다. 열기가 눈꺼풀을 녹이기 전까지 아무도 종을 치지 않았다. 당신은 그게 서운했다.'});
Object.assign(D.wreck,{t:'갓길 끝에 버려진 승용차가 있었다. 핸들을 꺾었지만 늦었다.\n\n차가 옆으로 누우면서 앞 유리가 거미줄처럼 갈라졌고, 그 너머로 아스팔트가 천천히 돌았다. 가슴을 누르는 안전띠 때문에 숨이 반만 들어왔다. 어딘가에서 휘발유 냄새가 났다.\n\n깨진 창문으로 손들이 들어왔다. 피에 젖은 버클은 손가락 사이에서 계속 미끄러졌고, 끝내 풀리지 않았다. 마지막으로 들은 건 계기판에서 아직도 깜빡이던 방향 지시등 소리였다. 딸깍, 딸깍.'});
Object.assign(D.elevator,{t:'문은 끝까지 열렸다. 열두 명이 한꺼번에 뒤로 몰렸고, 당신은 맨 앞에 있었다.\n\n넥타이를 잡은 첫 번째 손에 그대로 끌려 나갔다. 18층 복도의 대리석 바닥은 차가웠다. 두 번째 손이 손목을, 세 번째가 머리채를 잡았다. 엘리베이터 안을 돌아보았다. 열한 명이 당신을 보고 있었다. 아무도 손을 뻗지 않았다.\n\n{띵—}\n\n문이 닫히는 소리와 함께 숫자판이 내려갔다. 17, 16, 15. 아무도 버튼을 다시 누르지 않았다.'});
D.hidBitten.t=s=>{const w=F('biteWho')?bwN():'박 씨';return '살리고 싶었다. 그게 전부였다.\n\n새벽 3시, '+w+jx(w,'이었던','였던')+' 것이 목을 찾았다. 턱이 목덜미를 물고, 개가 고깃덩이를 흔들듯 좌우로 흔들었다. 경동맥이 찢어지는 소리가 귀 바로 옆에서 났고, 뿜어진 피가 형광등 위에 점점이 박혔다.\n\n바닥에 쓰러져 천장을 보았다. 피가 묻은 형광등이 깜빡였다. 그 아래에서 '+w+jx(w,'이었던','였던')+' 것이 아직 씹고 있었다.\n\n마지막으로 귓가에 남은 건 사흘 전 그 사람이 한 말이었다. 「평생 갚을게요.」'};

/* ---------------- 엔딩 ---------------- */
E.last.t=s=>day()+'일째. 살아 있다. 그게 전부다.\n\n검역 천막에서 48시간. 체온계, 손전등, 상처 검사. 군의관이 이름을 묻고 그 옆에 「단독」이라고 적는다. 동행 0.\n\n배급은 하루 두 번 줄 서서 받고, 천막 한 칸에서 여덟이 잔다. 옆 침상의 여자는 밤마다 누군가의 이름을 부르다 깬다. 당신은 깨지 않는다. 부를 이름이 너무 많아서.\n\n수첩을 펼쳐 함께였던 사람들의 이름을 하나씩 적는다. '+(deadList()?deadList()+' 줄이 길다. ':'생각보다 줄이 길다. ')+(F('lostName')?F('lostName')+'의 이름에서 펜이 오래 멈춘다. 그 이름은 부르지 않는다. 부르면 대답 없는 것을 견딜 수 없으니까.\n\n':'\n\n')+'그 아래 아직 아무것도 적지 않은 빈칸이 남아 있다. 내일 누구의 이름이 들어갈지, 당신의 이름이 들어갈지 아직 모른다. 천막 밖에서 누군가 운다. 오늘은 그 사람이 운다.'+babyNews();
E.south.t=s=>'정문이 닫히는 소리를 등 뒤로 들었다. 안쪽은 이상하리만치 평범했다. 줄 서서 배급받는 사람들, 빨래 널린 천막, 우는 아이를 달래는 목소리.\n\n'+(compNames().join(', ')||'함께 온 사람들')+'와(과) 같은 천막을 배정받았다. 첫날 밤 누군가 「여기선 문 잠그고 자도 돼요」라고 말했고, 다 같이 조금 웃었다. 웃다가 하나가 울기 시작했고, 아무도 말리지 않았다.\n\n새벽에 깨어 옆 침상을 셌다. 하나, 둘. 다 있었다. 그걸 확인하고서야 다시 눈을 감았다. 앞으로 오랫동안 매일 밤 그렇게 셀 것이다.\n\n'+dateOf(day())+'. '+day()+'일째. 살아남았다. 혼자가 아니라.'+babyNews();
E.quarantine.t=s=>'철조망 안의 철조망. 하얀 천막, 번호가 붙은 침대. 하루 두 번 체온을 재고, 하루 한 번 피를 뽑는다.\n\n살아 있다. 문은 밖에서만 열린다.\n\n옆 침대의 남자는 어제 사라졌다. 밤에 체온계가 길게 울렸고, 아침엔 시트가 새로 깔려 있었다. 아무도 어디로 갔는지 말해 주지 않는다. 그가 남긴 건 침대 밑의 슬리퍼 한 켤레뿐이다.\n\n당신은 수첩에 날짜를 긋는다. '+day()+', '+(day()+1)+', '+(day()+2)+'. 체온계가 귀에 닿을 때마다 숨을 참는다. 언제까지 세게 될지 모른다.'+babyNews();
E.home.t=s=>(F('momAlive')?'엄마가 끓인 라면을 먹었다. 물탱크 물로, 휴대용 버너로 끓인, 세상에서 제일 맛없는 라면이었다. 다 먹고 국물까지 마셨다.\n\n밤에 엄마가 당신 머리를 쓰다듬었다. 「문 안 열었어. 네가 열지 말라고 해서.」 그 손이 떨리고 있었다. 2주 동안 혼자, 문 앞에서 그 말만 붙잡고 있었던 손이었다.\n\n창밖의 도시는 어둡다. 이 집의 문은 이제 둘이서 지킨다.':'엄마의 침대 옆 바닥에 이불을 깔았다. 하늘색 스카프가 덮인 얼굴은 평온해 보인다.\n\n엄마는 끝까지 문을 열지 않았다. 당신이 시킨 대로. 식탁 위 달력의 줄은 열하루째에서 멈춰 있다. 그 줄을 이어서 그었다. 열둘, 열셋. 엄마가 세지 못한 날들을.\n\n그 말을 한 게 후회되는지, 다행인지 아직 모르겠다. 이 집에 남는다. 문은 이제 당신이 지킨다.')+((()=>{const n=((s.memos)||[]).filter(m=>m.kind==='letter').length;return n&&F('momAlive')?'\n\n엄마가 당신 수첩을 넘기다 멈췄다. 「엄마,」로 시작하는 쪽이 '+n+'장. 다 읽고 나서 엄마는 수첩을 덮고 오래 쓰다듬었다.':''})());
E.island.t=s=>'배는 사흘을 떠돌다 이름 없는 작은 섬에 닿았다. 등대 하나, 빈집 세 채, 빗물 저수조.\n\n'+(F('momWith')?'엄마가 마당에 파를 심었다. 「바닷바람에 잘 클 거야.」 손톱 밑에 흙이 낀 엄마의 손을 오래 보았다.\n\n':nComp()?compNames().join(', ')+'와(과) 집을 하나씩 나눠 가졌다. 저녁이면 등대 아래 모여 생선을 굽는다. 누구도 서울 얘기는 꺼내지 않는다.\n\n':'혼자다. 파도 소리가 문 두드리는 소리처럼 들리는 밤이 아직 있다. 그런 밤엔 등대에 올라가 불을 켠다. 누가 보라고 켜는 건지는 모르겠다.\n\n')+'육지 쪽 수평선에 가끔 연기가 오른다. 보지 않으려 한다. 이 섬엔 놈들이 없다. 아직은.';
E.heli.t=s=>'헬기는 남쪽으로 날았다. 창밖으로 한강이 작아지고, 서울이 연기 기둥 몇 개로 줄어들었다. 옥상에 남은 사람들이 점이 되었다가 사라졌다.\n\n'+(nComp()?compNames().join(', ')+'이(가) 옆에 앉아 있다. 아무도 말하지 않는다. 말하면 이게 꿈이 될 것 같아서.\n\n':'옆자리는 비어 있다. 끝까지 함께 온 사람은 없었다.\n\n')+'부산 앞바다의 해군 수송선. 따뜻한 물, 하얀 시트. 샤워기 아래서 한참을 서 있었다. 물이 다 빠져도 발밑의 색이 투명해지지 않았다.\n\n첫날 밤, 침대 밑에 무기를 숨기고서야 잠들 수 있었다.';
E.monster.t=s=>'이제 사람들은 트럭 소리만 듣고도 숨는다. 당신의 트럭이다.\n\n냉장실 열쇠는 당신 허리에 걸려 있다. 밤마다 숫자를 부르는 것도, 문 위에 숫자를 쓰는 것도 당신 일이다. 7번은 비워 두었다. 이유는 묻지 않는다. 묻는 사람은 없다.\n\n가끔 꿈에서 응급실을 본다. 깨면 그게 누구의 기억이었는지 헷갈린다. 손을 씻는다. 오래 씻지는 않는다. 이제는.';
E.immune.t=s=>'군의관이 혈액 검사 결과를 두 번, 세 번 확인했다. 「물린 지 며칠 됐다고요?」\n\n그날 밤 행선지를 알려 주지 않는 헬기가 왔다. 창 없는 방, 하얀 가운들, 매일 뽑아 가는 피. 팔 안쪽에 주사 자국이 별자리처럼 늘어 간다.\n\n「당신 피 안에 답이 있을지도 몰라요.」 그들은 친절하다. 그래서 더 무섭다.\n\n벽에 손톱으로 날짜를 긋는다. 문은 밖에서만 열린다. 가끔 복도에서 누군가의 비명이 들리고, 다음 날 그 방은 비어 있다. 아직은 당신 차례가 아니다.';
E.sacrifice.t=s=>'「가!」\n\n'+(compNames().join(', ')||'그들')+'이(가) 뒤돌아보며 멀어지는 것을 보았다. 무기를 고쳐 쥐자 앞에서 수십 개의 손이 다가왔다.\n\n무섭지 않았다고 하면 거짓말이다. 무릎이 떨렸고, 쥔 손에서 땀이 났다. 첫 번째를 쓰러뜨렸고, 두 번째도. 세 번째가 어깨를 물었을 때 등 뒤에서 문이 닫히는 소리를 들었다. 그거면 됐다.\n\n안전지대 기록부 한 칸에 누군가 당신 이름을 적었다. 「생존자 없음」 옆에, 작게. 「덕분에」.';
E.community.t=s=>'셔터 위에 새 글씨를 걸었다. 「생존자 있음 — 들어와도 됩니다」.\n\n옥상의 상추는 세 번째 수확을 맞았다. 로비엔 아이들 그림이 붙었다. 오 실장의 사무실은 의무실이 되었다. 진짜 의무실. 그 책상에서 처음 상처를 꿰맨 날, 손이 조금 떨렸다. 그 방에서 있었던 일을 아는 사람은 이제 몇 남지 않았다.\n\n당신은 하루에 세 번 상처를 꿰매고, 밤엔 정문 불침번을 선다. 살아남는 것과 사는 것의 차이를, 이제는 안다.';
E.judge.t=s=>'정문 앞에서 돌아섰다. 철조망 안에선 문을 잠그고 잘 수 있겠지. 하지만 바깥엔 아직 숫자가 붙은 냉장실 문이 있다.\n\n그 뒤로 국도를 따라 이야기가 돌았다. 약탈자 아지트가 하나씩 불탄다고. 갇혔던 여자들이 풀려나고, 문 위에 숫자 대신 이름이 적혀 있다고. 불탄 아지트마다 꿰맨 자국이 반듯한 시체들이 남아 있다고.\n\n당신 이름은 아니다. 「간호사」라고만 불린다. 밤에 혼자 상처를 꿰매다 문득 손을 멈춘다. 이 손이 누굴 살리고 누굴 죽였는지, 세는 걸 그만둔 지 오래다.';

/* 긴 서술 문단은 폰에서 문장 경계로 나눈다 (대사·효과음·강조는 그대로) */
function splitPara(p){
  if(p.length<120||/[「」{}]/.test(p)||p.startsWith('!'))return [p];
  const ss=p.split(/(?<=[.?!…]["”’)]?)\s+/).map(x=>x+' ');
  if(!ss||ss.length<3)return [p];
  const out=[];let cur='';
  for(const s of ss){if(cur&&cur.length>=70&&cur.length+s.length>105){out.push(cur.trim());cur=''}cur+=s}
  if(cur.trim()){if(out.length&&cur.trim().length<28)out[out.length-1]+=' '+cur.trim();else out.push(cur.trim())}
  return out}
{const _t=textHTML;textHTML=function(t){if(typeof t==='function')t=t(st);
  if(typeof window!=='undefined'&&window.innerWidth<1024&&typeof t==='string')t=t.split(/\n\n+/).flatMap(splitPara).join('\n\n');
  return _t(t)}}

const MART_RUSH='다리에서 밀려난 사람들이 둑을 미끄러져 내려와 마트 정문으로 몰려들었다. 반쯤 내려온 셔터 아래로 서로를 밟으며 기어 들어갔다. 안쪽에서 보안팀이 셔터에 매달려 소리쳤다. 「그만! 그만 들어와!」\n\n등 뒤에서 비명이 가까워졌다. 맨 뒤에 처진 사람들 위로 놈들이 덮쳤고, 피가 셔터 철판에 튀었다. 셔터가 내려오기 직전 당신은 바닥을 굴러 안으로 들어갔다. 철판 너머에서 손바닥이 두드렸다. 오래가지 않았다.\n\n로비에 열아홉 명이 엉켜 숨을 몰아쉬었다. 보안실장 오태석이 쇠파이프로 바닥을 두드렸다. 「소매 걷어. 전부.」\n\n물린 자국은 둘에게서 나왔다. 피 묻은 상처가 있는 사람이 셋 더 있었다. 「유리에 베인 거예요!」 「넘어진 거라고요!」 오 실장은 듣지 않았다.\n\n정문 셔터 밖에는 아직 놈들이 있었다. 보안팀이 다섯을 매장 안쪽 하역장 철문으로 끌고 갔다. 철문이 열렸다가 닫혔다. 하나는 문틀을 붙잡고 버티다 손가락을 밟혔다. 정 선생이 「창고에 따로 두면 되잖아요!」라고 외쳤지만 철문은 다시 열리지 않았다.\n\n당신 손과 소매도 이등병의 피로 젖어 있었다. 오 실장의 눈이 당신 손에서 멈췄다. 「여자들은 저쪽 창고에서 따로 본다.」';
/* ===== 40: 잠실대교 — 줄 뒤에 섞였다가, 혼란 속에서 고른다 ===== */
Object.assign(S.y_truck,{
 text:'이등병을 짐칸 바닥에 눕히고 허벅지를 두 손으로 눌렀다. 트럭이 덜컹일 때마다 압박붕대 위로 피가 배어 나왔다. 열아홉, 입대 넉 달째라고 했다.\n\n「뭔지도 몰랐어요.」 병장이 이등병의 철모 끈을 풀어 주며 말했다. 「터지면 다리부터 막는다는 것만 들었지.」\n\n「다리를 막으면, 강 위쪽 사람들은요?」\n\n병장은 대답 대신 이등병의 손을 잡아 주었다.\n\n강변북로는 멈춘 차들로 꽉 막혀 있었다. 트럭은 성수동 시내로 꺾었다. 창밖으로 서울숲역 4번 출구가 지나갔다. 노란 「민방위 대피소」 표지 아래로 사람들이 계단을 내려가고 있었다. 둑 아래 대형마트 옥상 주차장에서는 사람 몇이 손을 흔들고 있었다.'});
Object.assign(S.y_truck2,{
 enter:s=>{['영동대교','청담대교','잠실대교'].forEach(b=>brSet(b,'x'))},
 text:'다리 입구는 철조망과 장갑차로 막혀 있었다. 초록 띠를 찬 사람들이 한 줄로 다리를 건너고 있었다.\n\n「P-0 부대 차량, 통과 불가. 회차하라.」\n\n병장이 당신 손 위에 자기 손을 겹쳐 이등병의 상처를 넘겨받았다. 「선생님은 띠 있잖아요. 내려서 줄 서요. 우린 못 가도 선생님은 가요.」\n\n줄 맨 뒤에 섰다. 열 걸음쯤 나아갔을 때 다리 쪽 확성기가 터졌다. 「교량 즉시 폐쇄! 민간인 통행 중지!」 줄이 멈추고, 뒤로 밀리기 시작했다.\n\n둑길 쪽에서 셋이 휘청거리며 걸어왔다. 앞쪽 남자가 「괜찮으세요?」 하며 그쪽으로 다가갔다.\n\n{탕— 탕탕—}\n\n비명과 총소리가 한꺼번에 터졌다. 다리 쪽 병사들이 군중을 향해 쏘고 있었다. 놈인지 사람인지 가리지 않았다.\n\n「병원은 무슨! 서울숲역 대피소로 간다!」 트럭 쪽에서 하사가 소리쳤다. 「선생님! 타요, 빨리!」 병장이 짐칸에서 손을 뻗었다.\n\n둑 아래로는 밀려난 사람들이 마트 쪽으로 뛰어가고 있었다.',
 memo:{t:'띠를 차고 줄을 섰다. 열 걸음.'},
 choices:[{t:'인파를 거슬러 트럭으로 뛴다',to:'ss_arrive',eff:{men:-6,flag:{truckSS:1}},adv:30},
  {t:'사람들을 따라 둑 아래 마트로 뛴다',to:'y_mart_gate',eff:{men:-6,flag:{fromBridge:1}},adv:20}]});
SUM.y_truck2='잠실대교 북단 · 눈앞에서 닫힌 다리';

/* 서울숲역: 트럭으로 왔으면 병사들과 함께, 아니면 도착 시각에 맞게 */
{const t0=S.ss_arrive.text;S.ss_arrive.text=s=>{let t=typeof t0==='function'?t0(s):t0;
 const early=day()===1&&s.sec%86400<18*3600;
 const bun=F('truckSS')?'군복은 트럭의 권태준 하사와 병장, 분대원 둘. 병원 복귀 명령을 어기고 여기 남았다. 이등병은 수유실 바닥에 눕혀졌다.'
  :early?'군복은 권태준 하사와 분대원 셋. 다리 통제 지원을 나왔는데, 오늘 저녁 본대가 강을 건너면 이쪽에 남는다고 했다.':null;
 if(bun)t=t.replace('군복은 권태준 하사와 분대원 셋. 다리 통제 지원을 나왔다가, 본대가 강을 건너 철수할 때 이쪽에 남겨졌다.',bun);
 if(early)t=t.replace('예순두 명.','서른 명 남짓. 계단으로 사람들이 계속 내려온다.');
 if(F('truckSS')&&!F('truckSSdone'))t='트럭은 4번 출구 「민방위 대피소」 표지 앞에 미끄러지듯 섰다. 병사들이 이등병을 들것째 들고 계단을 뛰어 내려갔다. 셔터 앞의 구청 점퍼 여자가 막아서자 하사가 소리쳤다. 「군 의무 지원이야. 이 사람 간호사고.」 아무도 당신 손목을 확인하지 않았다.\n\n'+t;
 return t}}
{const _go=go;go=function(id,opt){if(st&&F('truckSS')&&!F('truckSSdone')&&id!=='ss_arrive')F('truckSSdone',1);if(st&&F('fromBridge')&&!F('fromBridgeDone')&&id!=='y_mart_gate'&&id!=='m_arrive')F('fromBridgeDone',1);return _go(id,opt)}}

const SN_END=/([.?!…][”’」』)]*)(\s+)/g;
function snWrap(p){if(p.dataset.sn)return;p.dataset.sn='1';
 const nodes=[...p.childNodes];const frag=document.createDocumentFragment();let cur=null;
 const add=n=>{if(!cur){cur=document.createElement('span');cur.className='sn';frag.appendChild(cur)}cur.appendChild(n)};
 for(const n of nodes){
  if(n.nodeType===3){const t=n.textContent;let last=0,m;SN_END.lastIndex=0;
   while((m=SN_END.exec(t))){const piece=t.slice(last,m.index+m[1].length);if(piece)add(document.createTextNode(piece));frag.appendChild(document.createTextNode(m[2]));cur=null;last=m.index+m[0].length}
   const rest=t.slice(last);if(rest)add(document.createTextNode(rest))}
  else if(n.nodeType===1&&(n.classList.contains('dqb')||n.tagName==='BR')){cur=null;frag.appendChild(n)}
  else add(n)}
 p.textContent='';p.appendChild(frag)}
function snFit(){const story=app.querySelector('.story');if(!story)return;

  const cs=getComputedStyle(p);const avail=p.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  sns.forEach(s=>{s.classList.remove('kp');s.style.whiteSpace='nowrap';s.style.display='inline-block'});
  const ws=sns.map(s=>s.getBoundingClientRect().width);
  sns.forEach((s,i)=>{s.style.whiteSpace='';s.style.display='';if(ws[i]<=avail-1)s.classList.add('kp')})}
 hid.forEach(p=>p.hidden=true)}
