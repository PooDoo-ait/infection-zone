  {t:'열이 있다고 말하고 격리 천막으로 간다',if:s=>!sOn('bitten')&&(sOn('fever')||s.men<30),to:'end:quarantine'},
  {t:'문 앞에서 돌아선다 — 길 위엔 아직 할 일이 있다',if:s=>F('ajitDone')&&s.hum>=20&&s.hum<=75,to:'end:judge'},
  {t:'뒷걸음질 쳐 무법지대로 돌아간다',if:s=>s.hum<15,to:'end:monster'}]};

/* 귀향·섬 */
S.e_home1={time:T(14,8,0),loc:'올림픽대로 · 강서 방면',crisisEnd:1,
 text:s=>'서쪽으로. 한강을 따라. '+compLine()+'\n\n김포공항 근처에 군 헬기 한 대가 처박혀 있다. 조종석엔 아무도 없다. 꼬리 쪽 화물칸이 열려 있다.',
 memo:{x:'엄마한테 가야',t:'간다. 지금 간다.'},
 choices:[
  {t:'헬기 화물칸을 뒤진다',once:'heliwreck',p:55,ok:'e_home1',okEff:{give:['flare','radio','medkit']},fail:'e_home1',failEff:{hp:-15,add:'bleed'},adv:60},
  sigC('e_home1','hm'),
  {t:'부천으로 계속 간다',to:'e_home2',adv:300}]};
S.e_home2={time:T(16,15,0),loc:'부천 · 엄마의 아파트 3층',
 enter:s=>{if(F('momAlive')==null)F('momAlive',Math.random()<(F('mom')?.5:.4)?1:0)},
 text:'복도는 조용하다. 엄마 집 현관 앞에 누군가 서 있다. 이마를 문에 댄 채. 런닝셔츠. 옆집 아저씨다. 아니, 옆집 아저씨였던 것.\n\n2주 넘게, 저렇게 서 있었던 걸까. 문 안쪽의 무언가를 기다리며.',
 memo:{t:'엄마 문 열지 마 문 열지 마',warn:1},
 choices:[
  {t:'뒤에서 다가가 끝낸다',needW:1,p:68,ok:'e_home3',okEff:{men:-8},fail:'death:bite'},
  {t:'옆 베란다로 건너가 창으로 들어간다',p:50,ok:'e_home3',fail:'death:fall',adv:30}]};
S.e_home3={loc:'부천 · 엄마의 집',
 text:s=>F('momAlive')?'「서윤아?」\n\n엄마는 안방 장롱 안에 있었다. 물탱크 물을 받아 마시며 열엿새를 버텼다. 문은 한 번도 열지 않았다고 했다. 「네가 열지 말라며.」\n\n엄마가 당신 얼굴을 두 손으로 감쌌다. 그 손이 너무 가볍다.':'엄마는 식탁 의자에 앉아 있었다. 등을 보인 채. 식탁 위에 약봉지들, 달력에 날짜마다 그어진 줄. 줄은 열하루째에서 멈췄다.\n\n엄마가 천천히 고개를 돌렸다. 눈이 하얗다. 문은 끝까지 열지 않았다. 혼자서, 안에서.',
 memo:s=>F('momAlive')?{t:'엄마. 엄마. 엄마.'}:{x:'엄마한테 가야',t:'왔어. 늦었어.'},
 choices:[
  {t:'끝을 내 준다',if:s=>!F('momAlive'),to:'e_home4',eff:{men:-30}},
  {t:'엄마와 이 집에 남는다',if:s=>F('momAlive'),to:'end:home'},
  {t:'엄마를 데리고 서해 항구로 간다',if:s=>F('momAlive'),to:'e_port',eff:{flag:{momWith:1}},adv:600}]};
S.e_home4={loc:'부천 · 엄마의 집',
 text:'엄마를 침대에 눕히고 이불을 덮었다. 장롱에서 엄마가 제일 아끼던 스카프를 꺼내 얼굴을 덮어 주었다.\n\n창밖은 조용하다. 이 집엔 물탱크 물이 아직 남아 있다.',
 choices:[
  {t:'이 집에 남는다',to:'end:home'},
  {t:'서해 항구로 간다',to:'e_port',adv:600}]};
S.e_port={time:T(19,10,0),loc:'오이도 항구',crisisEnd:1,
 text:s=>'바다 냄새. 방파제 안쪽에 작은 어선들이 묶여 있다. 항구 사무소 유리창이 깨져 있다. 열쇠함이 거기 있을 것이다.\n\n수평선 너머 섬들이 희미하다. 그중 하나가 영흥도다.'+(zeroReady()?'\n\n이송 서류, 무전, 혈청. 모든 것이 그 섬을 가리킨다.':''),
 choices:[
  {t:'항구 사무소를 뒤진다',once:'portkey',p:55,ok:'e_port',okEff:{give:'boatkey'},fail:'e_port',failEff:{hp:-15,men:-8},adv:40},
  {t:'방파제 창고에서 연료를 찾는다',once:'portfuel',if:s=>!has('fuel'),to:'e_port',eff:{give:'fuel'},adv:40},
  freqC('e_port','pt'),
  {t:'영흥도로 키를 돌린다',need:['boatkey','fuel'],if:s=>zeroReady(),to:'end:zero'},
  {t:'사람 없는 작은 섬으로 배를 띄운다',need:['boatkey','fuel'],to:'end:island'},
  {t:'남쪽, 평택으로 내려간다',to:'e_road3',adv:600}]};

/* 잔류 */
S.e_stay1={time:T(14,10,0),loc:'그을린 마트',crisisEnd:1,
 text:s=>(F('ohGone')?'오 실장 없는 마트. 남은 사람들이 그을린 벽을 닦는다. 정 선생 무리가 당신을 보며 고개를 끄덕였다.':'오 실장이 살아남은 보안팀과 함께 2층을 지킨다. 배급은 하루 한 번, 통조림 반 개.')+'\n\n'+compLine(),
 choices:[
  {t:'사람들을 모아 다시 세운다',if:s=>F('ohGone')||s.hum>=50,to:'e_stay2'},
  {t:'오 실장 밑에서 버틴다',if:s=>!F('ohGone'),to:'e_stay_oh'}]};
S.e_stay_oh={time:T(18,21,0),skip:1,loc:'마트 · 2층 계단',
 enter:s=>{eff({res:-6,men:-10})},
 text:'— 일지. 오 실장은 이제 하루에 두 명씩 사무실로 부른다. 거절한 사람의 배급은 사라진다. 노부부의 할아버지가 어제 굶어 죽었다.',
 choices:[
  {t:'밤에 사무실로 올라가 끝낸다',needW:1,p:45,ok:'e_stay2',okEff:{hum:-6,flag:{ohGone:1}},fail:'death:shelterKilled'},
  {t:'마트를 떠나 남쪽으로 간다',to:'e_road3',adv:600},
  {t:'고개를 숙이고 버틴다',to:'e_stay_fall',adv:600}]};
S.e_stay2={time:T(21,12,0),skip:1,loc:'마트 옥상 텃밭',
 enter:s=>{if(F('in_st2'))return;F('in_st2',1);eff({res:10,men:6})},
 text:s=>'— 일지. 옥상에 흙을 퍼 올려 상추를 심었다. 빗물 받는 통을 셋 만들었다. 준호가 태양광 패널을 고쳤다. 밤에 로비에 불이 들어왔을 때 누군가 박수를 쳤다.\n\n'+compLine()+'\n\n무전에서 남쪽 이야기는 점점 줄어든다.',
 memo:{t:'상추 싹. 3개.'},
 choices:[freqC('e_stay2','st'),{t:'겨울을 준비한다',to:'e_stay3',adv:60}]};
S.e_stay3={time:T(26,2,0),loc:'마트 · 정문',
 text:'새벽 2시. 정문 셔터가 안쪽으로 휜다. 북쪽에서 내려온 무리. 수백. 한강 얼음 위로 건너왔다.',
 choices:[{t:'모두를 깨운다',urgent:'u_breach',to:'e_stay_hold'}]};
S.u_breach={urgent:1,alt:'e_stay_hold',sub:'초 안에 고르지 않으면 셔터가 무너진다',
 text:'!셔터 하단이 찢어졌다.\n\n손이, 팔이, 머리가 틈으로 밀려 들어온다. 로비에서 잠든 사람들이 일어나 비명을 지른다.',
 timeout:'death:siege',
 choices:[
  {t:'지게차로 셔터를 막는다',p:50,ok:'e_stay_hold',fail:'e_stay_fall',failEff:{hp:-20}},
  {t:'사람들을 옥상으로 올린다',p:62,ok:'e_stay_hold',okEff:{hum:6},fail:'death:siege'},
  {t:'혼자 하역장으로 빠진다',to:'e_stay_fall',eff:{hum:-15}}]};
S.e_stay_hold={time:T(26,9,0),loc:'마트 옥상',
 text:'아침. 셔터는 버텼다. 지게차와 냉장고와 사람들의 등으로.\n\n두 명을 잃었다. 남은 사람들이 옥상에서 서로를 보았다. 아무도 떠나자고 하지 않았다.',
 choices:[{t:'다시 쌓는다',to:s=>F('ohGone')&&s.hum>=45?'end:community':'e_stay_fall',adv:120}]};
S.e_stay_fall={time:T(27,12,0),loc:'무너진 마트',
 text:s=>'마트는 버티지 못했다. 사람들은 흩어졌다. 각자 다른 방향으로, 서로를 돌아보지 않고.\n\n'+compLine(),
 choices:[
  {t:'폐허 옥상에 혼자 남는다',to:s=>nComp()?'end:community':'end:last'},
  {t:'남쪽으로 마지막 길을 떠난다',to:'e_final',adv:600}]};

/* 약탈자 */
S.e_raider1={time:T(15,20,0),loc:'약탈자 트럭 짐칸',crisisEnd:1,
 text:'트럭은 매일 밤 다른 곳에 선다. 아파트, 교회, 학교. 「사장」은 당신을 「간호사」라고 부른다. 다친 놈들을 꿰매는 게 당신 일이다.\n\n오늘은 노부부가 사는 단독주택. 쌀 두 포대. 할머니가 당신 소매를 붙잡는다.',
 choices:[
  {t:'소매를 뿌리친다',to:'e_raider2',eff:{hum:-10,res:12}},
  {t:'몰래 쌀 한 포대를 남겨 둔다',p:55,phys:false,ok:'e_raider2',okEff:{hum:8},fail:'death:executed'}]};
S.e_raider2={time:T(20,22,0),skip:1,loc:'성수동 물류센터',
 text:s=>'— 일지. 냉장실엔 여자들이 있다. 숫자가 붙어 있다. 당신은 그 앞을 지나 다친 놈들의 상처를 꿰맨다.\n\n어젯밤 「사장」이 누군가의 칼에 죽었다. 남은 놈들이 당신을 본다. 상처를 꿰매 주는 사람. 약을 아는 사람.',
 memo:{t:'나는 7번이 아니야. 이제 아니야.'},
 choices:[
  {t:'냉장실 열쇠를 받아 든다',to:'end:monster'},
  {t:'밤에 냉장실 문을 열고 함께 도망친다',p:40,ok:'e_road3',okEff:{hum:20,men:-10},fail:'death:executed'}]};

/* ===== 사망 엔딩 (본문 + 변형: 혼자 / 동료 곁 / 오래 버틴 끝) ===== */
D.bite={n:'물림',h:'놈들과 맨손 거리에 서지 말 것.',
 t:'이빨이 들어오는 순간은 생각보다 조용했다. 살이 찢기는 소리보다 자기 숨소리가 더 크게 들렸다.\n\n상처에서 피가 흐르다가, 이상할 만큼 빨리 멎었다. 그리고 몸이 차가워지기 시작했다.',
 v:['혼자였다. 마지막으로 본 건 천장의 얼룩이었다. 사람 얼굴처럼 생긴.','{c}이(가) 당신 손을 잡고 있었다. 손에 힘이 빠질 때까지, 그리고 그 손에 다시 힘이 들어가기 직전까지.','{d}일을 버텼다. 그 모든 날이 이 한순간으로 끝났다.']};
D.siege={n:'포위',h:'밤과 사방이 막힌 길은 피할 것.',
 t:'앞에도, 뒤에도, 옆에도 있었다. 처음엔 셀 수 있었다. 그러다 세는 걸 그만두었다.\n\n손이 옷을 붙잡고, 머리카락을 붙잡고, 발목을 붙잡았다. 넘어진 뒤로는 하늘만 보였다.',
 v:['비명은 오래가지 않았다. 놈들은 소리가 끊기면 금방 잊는다. 당신도 잊혔다.','{c}의 이름을 불렀다. 대답 대신 멀어지는 발소리가 들렸다. 그거면 됐다고 생각했다.','{d}일째. 안전지대 불빛이 보이는 곳까지 왔었다.']};
D.noise={n:'소음 유인',h:'소리는 모든 것을 부른다.',
 t:'사이렌이 울리자 거리 전체가 고개를 돌렸다. 백 개가 넘는 머리가 동시에.\n\n유리가 한 장씩 깨졌다. 마지막까지 사이렌은 꺼지지 않았다. 끄는 법을 잊어버렸다.',
 v:['구급차는 하얀색이었다. 아침이 되자 더 이상 하얗지 않았다.','{c}이(가) 끝까지 문을 붙잡고 있었다.','{d}일째, 아주 작은 소리 하나가 전부를 불렀다.']};
D.bleed={n:'과다출혈',h:'붕대 한 개가 목숨 한 개다.',
 t:'피가 멈추지 않았다. 손으로 누르고, 옷으로 누르고, 마지막엔 그냥 바라보았다.\n\n간호사로 일하며 수없이 본 숫자들이 머릿속을 지나갔다. 혈압, 맥박, 남은 시간. 이번엔 자기 숫자였다.',
 v:['몸이 가벼워졌다. 춥지 않았다. 그게 끝이라는 걸 알았다.','{c}이(가) 상처를 누르며 울었다. 「어떻게 해요, 어떻게 해요.」 가르쳐 줄 힘이 없었다.','{d}일 동안 남을 꿰매던 손이, 마지막엔 자기 상처를 막지 못했다.']};
D.starve={n:'굶주림과 탈수',h:'식량과 물은 생각보다 빨리 바닥난다.',
 t:'목이 마르다는 감각이 먼저 사라졌다. 그다음엔 배고픔이. 마지막엔 생각이.\n\n입술이 갈라지고, 눈앞이 하얘졌다가 검어졌다를 반복했다. 물병은 비어 있었다. 사흘 전부터.',
 v:['잠들듯이 갔다. 놈들조차 당신을 찾지 않았다.','{c}이(가) 마지막 물 한 모금을 입에 흘려 넣어 주었다. 삼킬 수가 없었다.','{d}일째. 물 한 병이면 충분했을 거리였다.']};
D.mind={n:'정신 붕괴',h:'정신력도 체력처럼 닳는다.',
 t:'어느 순간부터 소리가 들렸다. 문 두드리는 소리. 엄마가 부르는 소리. 아무도 없는 곳에서.\n\n문을 열었다. 엄마가 거기 있을 것 같아서. 문 밖엔 엄마가 아닌 것들이 있었다.',
 v:['수첩 마지막 장엔 같은 문장이 빽빽하게 적혀 있었다. 「아무도 안 와」.','{c}이(가) 붙잡으려 했다. 당신은 그 손을 뿌리쳤다. 웃으면서.','{d}일. 몸보다 마음이 먼저 끝났다.']};
D.raiders={n:'약탈자 습격',h:'사람이 놈들보다 빠르다.',
 t:'총성은 생각보다 작았다. 가슴이 뜨거워졌고, 다리에 힘이 빠졌다.\n\n쓰러진 몸 위로 누군가 가방을 뒤졌다. 통조림 두 개, 붕대 하나. 「이게 다야?」',
 v:['그들은 당신 신발까지 벗겨 갔다.','{c}이(가) 끌려가는 소리를 들었다. 아무것도 할 수 없었다.','{d}일을 살아남게 한 물건들이, 다른 사람의 하루치 식량이 되었다.']};
D.hidBitten={n:'숨겨 준 대가',h:'물린 사람을 숨겼다면, 밤을 지켜볼 것.',
 t:'살리고 싶었다. 그게 전부였다.\n\n새벽 3시, 박 씨였던 것이 당신 목을 찾았다. 그가 마지막으로 한 말이 귓가에 남아 있었다. 「평생 갚을게.」',
 v:['하역장 바닥은 차가웠다. 위층의 누구도 내려오지 않았다.','{c}이(가) 철문을 닫았다. 당신이 가르쳐 준 대로.','{d}일째, 친절이 독이 되었다.']};
D.fall={n:'추락',h:'높은 곳에선 확실한 길만 택할 것.',
 t:'발이 허공을 디뎠다. 떨어지는 시간은 길었다. 생각할 수 있을 만큼.\n\n바닥은 단단했다. 위를 올려다보니, 건너려던 옥상 난간이 아주 멀리 있었다.',
 v:['아래에서 기다리던 것들이 천천히 모여들었다.','{c}이(가) 난간 위에서 이름을 불렀다. 대답하고 싶었다.','{d}일째, 한 걸음이 모자랐다.']};
D.gas={n:'가스 폭발',h:'조용하고 따뜻한 곳엔 이유가 있다.',
 t:'가스 냄새에 익숙해졌다. 따뜻했으니까. 한밤중, 누군가 초에 불을 붙였다.\n\n집이 한 번 숨을 들이쉬었다가 내뱉었다. 창문이 밖으로 날아갔다.',
 v:['마을의 침묵은 그 소리로 깨졌다. 그리고 다시 조용해졌다.','{c}이(가) 불을 켰다. 추워서. 아무도 그를 탓할 수 없었다.','{d}일째 밤. 가장 따뜻한 밤이었다.']};
D.checkpoint={n:'검문소',h:'상처를 숨긴 채 군인 앞에 서지 말 것.',
 t:'「소매 걷어.」 거짓말은 소용없었다. 군인은 상처를 보고, 아무 표정 없이 고개를 끄덕였다.\n\n트럭 뒤로 데려갔다. 다른 사람들처럼. 줄은 아무 일 없다는 듯 한 칸 앞으로 갔다.',
 v:['물린 게 아니라고, 마지막까지 말했다. 들은 사람은 없었다.','{c}이(가) 철조망 너머에서 그 소리를 들었다.','{d}일을 걸어 도착한 곳에서, 총성 한 발.']};
D.turned={n:'감염 은폐',h:'숨긴 상처는 결국 드러난다.',
 t:'팔의 상처가 더 이상 아프지 않았다. 열도 없었다. 괜찮은 줄 알았다.\n\n밤사이 체온이 떨어졌다. 마지막으로 남은 생각은, 누구에게도 들키지 않았다는 안도였다.',
 v:['다음 날 아침, 당신은 걷고 있었다. 어디로 가는지 모른 채.','{c}이(가) 아침에 당신을 깨우러 왔다. 그 뒤의 일은 당신이 모른다.','{d}일째. 끝까지 숨겼다. 그래서 끝났다.']};
D.timeout={n:'멈춰 버린 12초',h:'긴급 장면에선 망설임도 선택이다.',
 t:'고르지 못했다. 손가락이 화면 위에서 떨리는 동안, 12초가 지나갔다.\n\n세상은 기다려 주지 않았다. 놈들도.',
 v:['혼자였기에, 망설임을 깨워 줄 사람도 없었다.','{c}이(가) 소리쳤다. 「빨리!」 몸이 움직이지 않았다.','{d}일 동안 수천 번 결정했다. 마지막 한 번을 못 했다.']};
D.executed={n:'처형',h:'약탈자에게 두 번째 기회는 없다.',
 t:'무릎이 꿇려졌다. 「사장」은 바쁜 사람처럼 시계를 보았다.\n\n「본보기야.」 다른 사람들이 보는 앞에서. 마지막으로 본 것은 냉장실 문 위의 숫자였다.',
 v:['다음 날 냉장실엔 새 숫자가 붙었다.','{c}은(는) 끝까지 고개를 돌리지 않았다.','{d}일을 버틴 사람이, 3초 만에.']};
D.captive={n:'감금 끝에',h:'갇혔다면, 기회는 초반에 온다.',
 t:'트럭이 멈춘 곳은 더 깊은 창고였다. 물은 이틀에 한 번. 빵은 사흘에 한 번. 그러다 그마저 끊겼다.\n\n문 밖의 남자들도 사라졌다. 놈들에게 먹혔는지, 떠났는지. 쇠사슬은 그대로였다.',
 v:['벽에 손톱으로 날짜를 그었다. 열넷까지.','곁의 여자가 이름을 물었다. 알려 주었다. 처음으로.','{d}일째. 아무도 문을 열러 오지 않았다.']};
D.shelterKilled={n:'은신처의 손',h:'은신처에서 가장 위험한 건 사람이다.',
 t:'하역장 셔터가 내려갔다. 당신을 사이에 두고.\n\n둔탁한 소리가 세 번. 다음 날 배급표에서 당신의 이름이 지워졌다. 누군가 당신 몫의 통조림을 받았다.',
 v:['로비의 누구도 고개를 들지 않았다.','{c}이(가) 셔터를 두드렸다. 오래, 아주 오래.','{d}일 동안 함께 먹고 자던 사람들이었다.']};
D.sold={n:'팔려간 사람',h:'혼자, 밤에, 무기 없이.',
 t:'트럭 짐칸은 어두웠다. 목에 걸린 플라스틱 번호표가 흔들릴 때마다 소리가 났다.\n\n트럭이 멈춘 곳에서 낯선 남자들이 손전등으로 얼굴을 하나씩 비추며 흥정했다. 숫자가 오갔다. 당신의 숫자도.',
 v:['그 뒤로 그녀를 본 사람은 없다.','그 뒤로 그녀를 본 사람은 없다. {c}은(는) 오랫동안 그녀를 찾아 헤맸다고 한다.','{d}일을 살아남은 그녀를, 그 뒤로 본 사람은 없다.']};
D.drown={n:'익사',h:'한강은 다리보다 넓다.',
 t:'물은 생각보다 차갑고, 무거웠다. 옷이 몸을 끌어내렸다.\n\n물속에서 무언가 발목을 붙잡았다. 놓지 않았다. 수면의 빛이 점점 작아졌다.',
 v:['하류 어딘가에, 다리 기둥에 걸린 채.','{c}이(가) 다리 위에서 손을 뻗었다. 손끝이 닿지 않았다.','{d}일째, 강 하나를 건너지 못했다.']};
D.hypothermia={n:'저체온증',h:'산의 밤은 놈들보다 조용히 죽인다.',
 t:'떨림이 멈췄을 때 따뜻하다고 느꼈다. 그게 위험하다는 걸, 간호사인 당신은 알았다.\n\n알면서도 눈을 감았다. 너무 따뜻해서.',
 v:['아침 서리가 속눈썹 위에 내려앉았다.','{c}이(가) 몸을 맞대 왔다. 둘 다 차가웠다.','{d}일을 버틴 몸이, 하룻밤의 추위에.']};
D.sepsis={n:'패혈증',h:'열이 나면 항생제를 아끼지 말 것.',
 t:'다리 상처가 곪았다. 열이 오르고, 오한이 오고, 헛소리가 나왔다.\n\n자기 증상을 하나하나 짚을 수 있었다. 빈맥, 저혈압, 의식 저하. 쓸 약이 없다는 것도.',
 v:['마지막 날엔 엄마가 이마를 짚어 주는 꿈을 꾸었다.','{c}이(가) 물수건을 갈아 주었다. 사흘 밤을.','{d}일째. 상처 하나가, 천천히.']};
D.betrayal={n:'동료의 배신',h:'붉은 천을 두른 사람은 다시 볼 것.',
 t:'눈을 떴을 때 가방이 없었다. 신발도, 무기도.\n\n그리고 휴게소 뒤편에서 손전등 세 개가 다가오고 있었다. 맨 앞에 선 얼굴을 알았다. 웃고 있지 않았다. 미안해하지도 않았다.',
 v:['「미안해요, 언니.」 그 말은 들은 것 같기도 하다.','{c}이(가) 먼저 쓰러졌다. 당신을 지키려다.','{d}일 동안 쌓은 것을 하룻밤에.']};
D.crushed={n:'무너진 지붕',h:'무너진 건물 아래로 기어들지 말 것.',
 t:'쌀 포대를 끌어당기는 순간 지붕이 낮게 신음했다. 그리고 내려앉았다.\n\n가슴 위의 무게 때문에 숨을 쉴 수가 없었다. 손끝에 쌀알이 닿았다.',
 v:['마을은 다시 조용해졌다.','{c}이(가) 맨손으로 기와를 들어냈다. 너무 늦게.','{d}일째, 쌀 한 포대 때문에.']};
D.fire={n:'화재',h:'불이 나면 연기보다 먼저 움직일 것.',
 t:'연기가 먼저 왔다. 앞이 보이지 않았고, 숨이 쉬어지지 않았다.\n\n계단은 아래로도 위로도 불이었다. 바닥에 엎드려 차가운 타일에 볼을 댔다. 그게 마지막으로 느낀 차가움이었다.',
 v:['마트의 간판은 다음 날에도 걸려 있었다. 「생존자 있음」.','{c}의 손을 놓치지 않았다. 끝까지.','{d}일 동안 지킨 은신처가 하룻밤에 탔다.']};
D.poison={n:'오염된 식량',h:'부푼 통조림은 먹지 말 것.',
 t:'배가 고팠다. 부풀어 오른 통조림이 이상하다는 걸 알았지만, 배가 더 고팠다.\n\n다음 날 아침, 눈꺼풀이 내려앉았다. 숨이 얕아졌다. 보툴리눔. 이름을 아는 게 아무 소용이 없었다.',
 v:['조용한 마을에, 조용한 죽음이 하나 늘었다.','{c}도 같은 캔을 먹었다. 나란히 누워 천장을 보았다.','{d}일째, 마지막 식사.']};

/* ===== 메인·숨겨진 엔딩 ===== */
E.heli={n:'구조 헬기',t:s=>'헬기는 남쪽으로 날았다. 창밖으로 한강이 작아지고, 서울이 연기 기둥 몇 개로 줄어들었다.\n\n'+(nComp()?compNames().join(', ')+'이(가) 옆에 앉아 있다. 아무도 말하지 않는다. 말하면 이게 꿈이 될 것 같아서.\n\n':'옆자리는 비어 있다. 끝까지 함께 온 사람은 없었다.\n\n')+'부산 앞바다의 해군 수송선. 따뜻한 물, 하얀 시트. 첫날 밤, 침대 밑에 무기를 숨기고서야 잠들 수 있었다.'};
E.south={n:'함께 남쪽으로',t:s=>'정문이 닫히는 소리를 등 뒤로 들었다. 안쪽은 이상하리만치 평범했다. 줄 서서 배급받는 사람들, 빨래 널린 천막, 우는 아이를 달래는 목소리.\n\n'+compNames().join(', ')+'와(과) 같은 천막을 배정받았다. 밤에 누군가 「여기선 문 잠그고 자도 돼요」라고 말했고, 다 같이 조금 웃었다.\n\n28일. 살아남았다. 혼자가 아니라.'};
E.community={n:'마트 공동체',t:s=>'셔터 위에 새 글씨를 걸었다. 「생존자 있음 — 들어와도 됩니다」.\n\n옥상의 상추는 세 번째 수확을 맞았다. 로비엔 아이들 그림이 붙었다. 오 실장의 사무실은 의무실이 되었다. 진짜 의무실.\n\n당신은 하루에 세 번 상처를 꿰매고, 밤엔 정문 불침번을 선다. 살아남는 것과 사는 것의 차이를, 이제는 안다.'};
E.sacrifice={n:'희생',t:s=>'「가!」\n\n'+(compNames().join(', ')||'그들')+'이(가) 뒤돌아보며 멀어지는 것을 보았다. 무기를 고쳐 쥐었다. 앞에서 수십 개의 손이 다가왔다.\n\n무섭지 않았다고 하면 거짓말이다. 그래도 문이 닫히는 소리는 들었다. 그거면 됐다.\n\n안전지대 기록부 한 칸에, 누군가 당신 이름을 적었다. 「생존자 없음」 옆에, 작게. 「덕분에」.'};
E.last={n:'마지막 생존자',t:s=>'28일째. 살아 있다. 그게 전부다.\n\n'+(F('lostName')?F('lostName')+'의 이름은 이제 부르지 않는다. 부르면 대답 없는 것이 견딜 수 없으니까.\n\n':'')+'천막 안에서 수첩을 펼친다. 함께였던 사람들의 이름을 하나씩 적는다. 줄이 길다. 그 아래, 아직 아무것도 적지 않은 빈칸이 남아 있다.'};
E.monster={n:'괴물',t:s=>'이제 사람들은 트럭 소리만 듣고도 숨는다. 당신의 트럭이다.\n\n냉장실 열쇠는 당신 허리에 걸려 있다. 문 위에 숫자를 쓰는 것도 당신 일이다. 7번은 비워 두었다. 이유는 묻지 않는다. 묻는 사람은 없다.\n\n가끔 꿈에서 응급실을 본다. 깨면 그게 누구의 기억이었는지 헷갈린다.'};
E.island={n:'섬으로',t:s=>'배는 사흘을 떠돌다 이름 없는 작은 섬에 닿았다. 등대 하나, 빈집 세 채, 빗물 저수조.\n\n'+(F('momWith')?'엄마가 마당에 파를 심었다. 「바닷바람에 잘 클 거야.」\n\n':nComp()?compNames().join(', ')+'와(과) 집을 하나씩 나눠 가졌다.\n\n':'혼자다. 파도 소리가 문 두드리는 소리처럼 들리는 밤이 아직 있다.\n\n')+'육지 쪽 수평선에 가끔 연기가 오른다. 보지 않으려 한다. 이 섬엔 놈들이 없다. 아직은.'};
E.quarantine={n:'격리소',t:s=>'철조망 안의 철조망. 하얀 천막, 번호가 붙은 침대. 하루 두 번 체온을 잰다. 하루 한 번 피를 뽑는다.\n\n살아 있다. 문은 밖에서만 열린다.\n\n옆 침대의 남자는 어제 사라졌다. 아무도 어디로 갔는지 말해 주지 않는다. 당신은 수첩에 날짜를 긋는다. 28, 29, 30. 언제까지 세게 될지 모른다.'};
E.judge={n:'심판자',t:s=>'정문 앞에서 돌아섰다. 철조망 안에선 문을 잠그고 잘 수 있겠지. 하지만 바깥엔 아직 냉장실이 있다. 숫자가 붙은 문이.\n\n그 뒤로 국도를 따라 이야기가 돌았다. 약탈자 아지트가 하나씩 불탄다고. 갇혔던 여자들이 풀려나고, 문 위에 숫자 대신 이름이 적혀 있다고.\n\n당신 이름은 아니다. 「간호사」라고만 불린다.'};
E.immune={n:'면역자',t:s=>'군의관이 혈액 검사 결과를 두 번, 세 번 확인했다. 「물린 지 며칠 됐다고요?」\n\n그날 밤 헬기가 왔다. 행선지는 알려 주지 않았다. 창 없는 방, 하얀 가운들, 매일 뽑아 가는 피.\n\n「당신 피 안에 답이 있을지도 몰라요.」 그들은 친절하다. 그래서 더 무섭다. 문은 밖에서만 열린다.'};
E.home={n:'귀향',t:s=>F('momAlive')?'엄마가 끓인 라면을 먹었다. 물탱크 물로, 휴대용 버너로. 세상에서 제일 맛없는 라면이었다.\n\n밤에 엄마가 당신 머리를 쓰다듬었다. 「문 안 열었어. 네가 열지 말라고 해서.」\n\n창밖의 도시는 어둡다. 이 집의 문은 이제 둘이서 지킨다.':'엄마의 침대 옆 바닥에 이불을 깔았다. 스카프가 덮인 얼굴은 평온해 보인다.\n\n엄마는 끝까지 문을 열지 않았다. 당신이 시킨 대로. 그 말을 한 게 후회되는지, 다행인지 아직 모르겠다.\n\n이 집에 남는다. 문은 이제 당신이 지킨다.'};
E.zero={n:'0번 환자',hid:1,t:s=>'영흥도 해양바이오 연구시설. 문은 열려 있었다. 지하 3층 격리실, 유리 벽 너머 침대에 누군가 묶여 있다.\n\n0번 환자. 첫 번째. 그는 변하지 않았다. 혈관에 꽂힌 관으로 피가 천천히, 멈추지 않고 흘러나간다. 응고 억제. 프로토콜 0. 그는 41일째 살아 있다.\n\n이송 서류, 무전, 혈청. 세 개의 조각이 맞물렸다. 감염은 피가 굳을 때 깨어난다. 막을 수 있다. 늦었지만, 막을 수 있다.\n\n연구실 무전기를 켰다. 「여기는 영흥도. 들리는 사람, 받아 적으세요.」'};
E.silence={n:'침묵하는 세계',hid:1,t:s=>'안전지대에 들어왔다. 따뜻한 밥, 잠긴 문. 그리고 아무도 말하지 않는 비밀.\n\n통신 천막의 무전병은 매일 같은 주파수를 돌린다. 도쿄, 시애틀, 그리고 이름 모를 숫자를 세던 목소리. 모두 침묵이다. 부산도, 정부도, 바다 건너 어디도. 구조는 오지 않는다. 올 곳이 없다.\n\n살아 있다. 그게 전부다. 세상 어디에도, 돌아갈 곳은 남아 있지 않다.\n\n안전지대의 조명탑은 오늘 밤에도 켜진다. 누구에게 보이라고 켜는지, 아무도 묻지 않는다.'};

/* ===== v10: 묘사 강화 ===== */
/* ---------- 사망 엔딩 ---------- */
D.bite.t='앞니가 어깨 근육을 파고들었다. 질긴 것이 뚝, 뚝 두 번 끊겼다. 놈이 고개를 비틀며 물러나자 손바닥만 한 살점이 같이 딸려 나갔다. 드러난 자리에서 하얀 힘줄과 쇄골 끝이 잠깐 보였다가 피에 잠겼다.\n\n머리가 먼저 계산했다. 경정맥은 비껴갔다. 출혈은 잡힌다. 문제는 그다음이었다. 상처 가장자리의 피가 교과서보다 훨씬 빨리, 검게 굳어 가고 있었다. 손끝부터 차가워졌다. 이가 저절로 딱딱 부딪쳤다.\n\n마지막으로 든 생각은 이상하게도 이송 서류의 문장이었다. 절대 지혈하지 말 것.';
D.siege.t='처음 손이 머리채를 잡았다. 두 번째 손이 손목을, 세 번째가 발목을. 넘어진 뒤로는 무게였다. 썩은 고기 냄새를 풍기는 몸들이 위로, 위로 쌓였다.\n\n누군가의 이가 종아리를 물었고, 누군가의 손톱이 옆구리 살을 갈랐다. 배 속의 따뜻한 것이 바깥 공기에 닿는 느낌이 났다. 비명을 지르려고 열린 입 안으로 누군가의 피가 흘러들었다.\n\n하늘은 보이지 않았다. 마지막까지 보인 건 자기 손이었다. 손가락이 하나씩, 사라지고 있었다.';
D.noise.t='사이렌이 울리자 거리 전체가 고개를 돌렸다. 백 개가 넘는 머리가, 동시에.\n\n앞 유리가 먼저 거미줄처럼 금 갔다. 그다음엔 옆 창문. 깨진 틈으로 팔들이 쏟아져 들어왔다. 유리 조각에 살이 찢겨 너덜너덜한 팔들이, 아랑곳없이 계속.\n\n운전석 문이 뜯겨 나갔다. 사이렌은 끝까지 꺼지지 않았다. 그 소리 아래로 다른 소리가 섞였다. 젖은 것을 씹는 소리. 당신의 소리.';
D.bleed.t='피가 멈추지 않았다. 손바닥으로 눌렀고, 옷을 뭉쳐 눌렀고, 마지막엔 그냥 바라보았다. 바닥에 고인 피가 신발 밑창 높이까지 차올랐다.\n\n간호사의 눈이 자기 몸을 읽었다. 피부가 축축하고 차갑다. 맥박은 빠르고 가늘다. 수축기 혈압은 아마 70 아래. 쇼크 2기, 3기. 입술이 파래지는 걸 손거울 없이도 알 수 있었다.\n\n시야 가장자리가 까맣게 말려 들어왔다. 숫자를 세다가, 어디까지 셌는지 잊었다.';
D.starve.t='사흘째부터 배고픔이 사라졌다. 그게 나쁜 신호라는 걸 알았다.\n\n입술이 갈라져 피가 났고, 그 피를 핥아 먹었다. 소변은 갈색이 되었다가 나오지 않았다. 피부를 꼬집으면 텐트처럼 선 채 돌아오지 않았다. 심장이 가끔 박자를 놓쳤다.\n\n마지막 날엔 벽지를 씹었다. 풀 맛이 났다. 그게 이 세상에서 마지막으로 느낀 맛이었다.';
D.mind.t='문 두드리는 소리가 들렸다. 엄마 목소리였다. 「서윤아, 문 열어. 엄마야.」 사흘 내내.\n\n손톱으로 팔뚝을 긁었다. 피가 날 때까지. 그래야 소리가 잠깐 멎었다. 수첩엔 같은 문장이 수백 번 적혔다. 글씨가 점점 커지고, 비뚤어지고, 마지막엔 종이를 뚫었다.\n\n결국 문을 열었다. 엄마가 거기 서 있었다. 엄마의 얼굴을 한 것이. 그것이 웃으며 입을 벌렸을 때, 당신도 웃고 있었다.';
D.raiders.t='총성은 생각보다 작았다. 가슴이 뜨거워지고 다리가 풀렸다. 쓰러진 채 기침을 하자 피거품이 나왔다. 폐다. 간호사의 머리가 혼자 진단을 내렸다. 긴장성 기흉, 오른쪽.\n\n누군가 가방을 뒤집었다. 「씨발, 이게 다야?」 군홧발이 상처를 밟고 지나갔다. 숨이 들어가지 않았다. 아무리 들이마셔도.\n\n그들은 당신의 신발까지 벗겨 갔다. 발이 시렸다. 그게 마지막 감각이었다.';
D.hidBitten.t=s=>'살리고 싶었다. 그게 전부였다.\n\n새벽 3시, '+(F('biteWho')?bwN():'박 씨')+jx(F('biteWho')?bwN():'박 씨','이었던','였던')+' 것이 목을 찾았다. 턱이 목덜미를 물고 좌우로 흔들었다. 개가 고깃덩이를 흔들듯이. 경동맥이 찢어지는 소리가 귀 바로 옆에서 났다. 피가 천장까지 뿜어져 형광등 위에 점점이 박혔다.\n\n마지막으로 들은 말이 귓가에 남아 있었다. 「평생 갚을게요.」';
D.fall.t='발이 허공을 디뎠다. 떨어지는 동안 생각할 시간이 있었다. 너무 많았다.\n\n먼저 다리가 땅에 닿았다. 정강이뼈가 무릎을 뚫고 위로 솟는 소리를 들었다. 그다음 골반, 그다음 머리. 시야가 하얗게 터졌다가 돌아왔을 때, 다리 한쪽이 몸 옆에 이상한 각도로 놓여 있었다. 남의 다리 같았다.\n\n아래에서 기다리던 것들이 천천히 모여들었다. 도망칠 수 없다는 걸, 부러진 다리를 내려다보며 알았다.';
D.gas.t='가스 냄새에 익숙해졌다. 따뜻했으니까. 한밤중, 누군가 초에 불을 붙였다.\n\n집이 한 번 숨을 들이쉬었다가 내뱉었다. 압력이 먼저 왔다. 고막이 터지고 세상의 소리가 사라졌다. 그다음 불. 머리카락이 타는 냄새를 맡았다. 자기 머리카락이었다.\n\n얼굴에 손을 대자 피부가 장갑처럼 미끄러져 내려왔다. 소리 없는 세상에서, 불길만 아름답게 흔들렸다.';
D.checkpoint.t='「소매 걷어.」 거짓말은 소용없었다. 군인은 상처를 보고 아무 표정 없이 고개를 끄덕였다.\n\n트럭 뒤편은 진흙과 피로 질척였다. 먼저 끌려온 사람들이 엎드려 있었다. 뒤통수마다 같은 크기의 구멍. 군인이 무릎을 꿇리고, 총구가 머리에 닿았다. 차가웠다.\n\n「물린 거 아니에요. 긁힌 거예요. 저 간호사예요.」 방독면 너머에서 숨소리 하나 변하지 않았다. 줄은 아무 일 없다는 듯 한 칸 앞으로 갔다.';
D.turned.t='팔의 상처가 더 이상 아프지 않았다. 열도 없었다. 괜찮은 줄 알았다.\n\n밤사이 체온이 떨어졌다. 손톱 밑이 보라색으로 변했다. 입안에 쇠 맛이 고였다. 배가 고팠다. 미친 듯이. 옆에서 자는 사람의 목덜미에서 맥박이 뛰는 게 보였다. 소리까지 들렸다.\n\n마지막으로 남은 생각은, 누구에게도 들키지 않았다는 안도였다. 그 생각도 곧 배고픔에 먹혔다.';
D.timeout.t='고르지 못했다. 손가락이 떨리는 동안 12초가 지나갔다.\n\n망설임은 선택이 아니라 공백이었다. 그 공백 속으로 놈들이 들어왔다. 첫 번째 이빨이 손가락을 물었을 때, 그제야 몸이 움직였다. 너무 늦게.\n\n세상은 기다려 주지 않는다. 놈들은 더더욱.';
D.executed.t='무릎이 꿇려졌다. 「사장」은 바쁜 사람처럼 손목시계를 보았다. 「본보기야. 다들 잘 봐.」\n\n쇠파이프가 먼저 무릎을 부쉈다. 넘어지자 두 번째가 어깨를. 사람들 앞에서, 천천히. 세 번째부터는 세지 않았다. 귀에서 무언가 흘러나왔다. 따뜻했다.\n\n마지막으로 본 것은 냉장실 문 위의 숫자였다. 그 아래, 여자들이 눈을 감지 못하고 있었다.';
D.captive.t='트럭이 멈춘 곳은 더 깊은 창고였다. 물은 이틀에 한 번, 빵은 사흘에 한 번. 그러다 끊겼다.\n\n쇠사슬에 쓸린 발목이 곪아 구더기가 생겼다. 처음엔 털어 냈다. 나중엔 그럴 힘도 없었다. 옆 매트리스의 여자는 닷새째 움직이지 않았고, 냄새가 났다. 아무도 치우러 오지 않았다.\n\n벽에 손톱으로 날짜를 그었다. 열넷까지. 열다섯째 줄은 반쯤 긋다 멈췄다.';
D.shelterKilled.t='하역장 셔터가 내려갔다. 당신을 사이에 두고.\n\n첫 번째 쇠파이프가 팔을 부러뜨렸다. 막으려고 든 팔이었다. 두 번째는 관자놀이. 세상이 옆으로 기울었다. 콘크리트 바닥에 얼굴이 닿았고, 입안에서 이가 굴렀다. 위에서 숨을 몰아쉬는 소리. 사람의 숨소리였다.\n\n다음 날 배급표에서 당신 이름이 지워졌다. 누군가 당신 몫의 통조림을 받았다. 맛있게 먹었다.';
D.sold.t='트럭 짐칸은 어두웠고 오줌 냄새가 났다. 목에 걸린 플라스틱 번호표가 흔들릴 때마다 딸깍거렸다.\n\n트럭이 멈춘 곳에서 낯선 남자들이 손전등으로 얼굴을 하나씩 비췄다. 턱을 잡아 입을 벌리고 이를 확인했다. 가축을 고르듯이. 숫자가 오갔다. 당신의 숫자도. 누군가 웃으며 「간호사면 더 쳐줘야지」라고 했다.\n\n번호표를 새것으로 갈아 걸었다. 이름은 묻지 않았다.';
D.drown.t='물은 생각보다 차갑고 무거웠다. 옷이 물을 먹고 몸을 끌어내렸다. 숨을 참았다. 30초, 40초.\n\n발목을 붙잡은 것이 놓지 않았다. 내려다보니 물속에서 하얗게 불어 터진 얼굴이 웃고 있었다. 입술이 없어서 웃는 것처럼 보였다.\n\n결국 숨을 들이켰다. 차가운 강물이 기관지로 쏟아져 들어왔다. 폐가 불타는 것 같았다. 수면의 빛이 동전만큼 작아지다가, 꺼졌다.';
D.hypothermia.t='떨림이 멈췄을 때 따뜻하다고 느꼈다. 중심 체온 32도 아래. 간호사인 당신은 그게 무슨 뜻인지 알았다.\n\n손가락은 하얗다가 검게 변해 갔다. 감각이 없어서 아프지도 않았다. 이상하게 덥다는 생각이 들어 외투를 벗었다. 그것도 증상이라는 걸 알면서. 알면서도 벗었다.\n\n아침 서리가 속눈썹 위에 내려앉았다. 눈을 감을 수가 없었다. 눈꺼풀이 얼어붙어서.';
D.sepsis.t='다리 상처가 곪았다. 처음엔 붉었고, 다음엔 부었고, 그다음엔 검푸른 줄이 사타구니 쪽으로 기어 올라갔다. 고름에서 단내가 났다.\n\n열이 40도를 넘자 헛것이 보였다. 이가 부딪쳐 혀를 깨물었다. 자기 증상을 하나하나 짚을 수 있었다. 빈맥, 저혈압, 의식 저하, 다발성 장기 부전. 쓸 약은 없었다.\n\n마지막 날엔 엄마가 이마를 짚어 주는 꿈을 꾸었다. 엄마 손도 뜨거웠다.';
D.betrayal.t='눈을 떴을 때 가방이 없었다. 신발도, 무기도.\n\n휴게소 뒤편에서 손전등 세 개가 다가왔다. 맨 앞에 선 얼굴을 알았다. 미안해하지 않았다. 「저 년이야. 약 아는 년.」\n\n도망치려다 넘어졌다. 누군가 머리채를 잡고 아스팔트에 얼굴을 찍었다. 코가 부러지는 소리. 한 번, 두 번. 세 번째부터는 소리가 안 들렸다.';
D.crushed.t='쌀 포대를 끌어당기는 순간 지붕이 낮게 신음했다. 그리고 내려앉았다.\n\n서까래가 가슴 위에 걸렸다. 갈비뼈가 하나씩 안으로 접히는 감각. 숨을 들이쉴 수가 없었다. 내쉴 수만 있었다. 그래서 내쉬었다. 조금씩, 조금씩, 더는 내쉴 것이 없을 때까지.\n\n입가로 거품 섞인 피가 흘렀다. 손끝에 쌀알이 닿았다. 따뜻한 밥 냄새를 상상했다.';
D.fire.t='연기가 먼저 왔다. 검고, 기름지고, 뜨거웠다. 세 번 들이마시자 목 안이 타들어 갔다. 기도 화상. 목소리가 쉬고, 이내 나오지 않았다.\n\n계단은 아래로도 위로도 불이었다. 불 속에서 누군가 걸어 나왔다. 머리카락이 다 타고 피부가 녹아내린 채로도 계속 걸었다. 산 사람인지 놈인지 구분이 안 됐다.\n\n바닥에 엎드려 차가운 타일에 볼을 댔다. 그게 마지막으로 느낀 차가움이었다.';
D.poison.t='배가 고팠다. 부풀어 오른 통조림이 이상하다는 걸 알았지만, 배가 더 고팠다.\n\n다음 날 아침, 눈꺼풀이 내려앉았다. 물체가 둘로 보였다. 침을 삼킬 수 없어 입가로 흘렀다. 보툴리눔. 신경독은 아래로 내려온다. 팔, 가슴, 횡격막.\n\n의식은 끝까지 또렷했다. 숨을 쉬라고 몸에 명령했다. 몸은 듣지 않았다. 마지막 몇 분은, 자기가 질식하는 걸 처음부터 끝까지 지켜보는 시간이었다.';

/* ---------- 1일차 ---------- */
S.y_start.text='밤샘 근무가 끝나기 20분 전이었다. 격리 3번 베드의 남자는 06시 06분에 사망 판정을 받았다. 모니터가 평선을 그린 지 4분 만에, 그가 일어나 앉았다.\n\n경비원 김 씨가 「어, 어」 하며 어깨를 잡았다. 남자는 고개를 돌려 김 씨의 목에 얼굴을 묻었다. 턱이 다물리는 소리. 남자가 고개를 뒤로 젖히자 김 씨 목에서 무언가 길게 딸려 나왔다. 뜯긴 살점과 함께 쏟아진 피가 커튼에 부채꼴로 뿜어졌다.\n\n김 씨는 자기 목을 움켜쥐고 주저앉았다. 손가락 사이로 피가 박동에 맞춰 솟구쳤다. 쉭, 쉭.\n\n!응급실 전체가 한꺼번에 비명을 질렀다.';
S.y_kim_ok.text='거즈 뭉치를 상처에 쑤셔 넣고 온몸으로 눌렀다. 손바닥 아래에서 동맥이 마지막으로 몇 번 펄떡였다. 따뜻한 피가 손목까지 차올랐다가 식어 갔다. 김 씨는 무언가 말하려 입을 벌렸는데, 소리 대신 핏덩이가 나왔다.\n\n1분도 걸리지 않았다.\n\n그의 허리띠에서 열쇠꾸러미가 떨어졌다. 꼬리표에 「격리병동 기록실」. 3번 베드의 남자는 다른 사람을 쫓아 복도로 나갔다. 김 씨의 손가락이, 움찔했다.';
S.y_kim_turn.text='눈꺼풀을 내리려는 순간 그 눈이 떠졌다. 흰자위가 온통 핏발로 덮여 있다. 동공이 열린 채 움직이지 않는다.\n\n차가운 손이 손목을 움켜쥐었다. 뼈가 삐걱거렸다. 사람의 악력이 아니다. 찢어진 목에서 공기 새는 소리를 내며, 김 씨였던 것이 상체를 일으켰다.\n\n!입이 열린다. 이 사이에 아직 자기 살점이 끼어 있다.';
S.y_kim_fail.text='김 씨에게 닿기도 전에 3번 베드의 남자가 몸을 돌렸다. 손톱이 팔뚝을 긁고 지나갔다. 살이 네 줄로 벌어지며 하얀 지방층이 드러났다. 걷어차고 바닥을 굴렀다.\n\n팔에서 피가 흐른다. 물린 건 아니다. 아마도.\n\n김 씨는 이미 움직이지 않는다. 아직은.';
S.y_corridor.text=s=>'복도는 이미 사람의 것이 아니었다. 쓰러진 이동식 침대 아래에서 무언가가 간호조무사 지은 씨의 배를 헤집고 있다. 지은 씨는 아직 살아서 천장을 보며 무언가 중얼거린다. 소리가 젖어 있다. 장이 바닥 타일 위로 미끄러져 나와 있다.\n\n비상구 표지판이 깜빡인다. 아래로 가면 지하 주차장, 구급차가 있다. 위로 가면 옥상. 정면 로비 너머로는 군용 트럭 엔진 소리.'+(sOn('bleed')?'\n\n!팔의 상처에서 피가 떨어진다. 침대 밑의 것이 피 묻은 얼굴을 든다.':'');
S.u_garage.text='!경비실 문이 열리자 둘이 한꺼번에 쏟아져 나왔다.\n\n하나는 경비 제복, 하나는 환자복. 환자복의 아래턱이 반쯤 떨어져 힘줄 몇 가닥에 매달린 채 덜렁거린다. 그래도 무는 걸 멈추지 않으려는 듯 위턱이 허공을 딱딱 씹는다.';
S.y_amb_siege.text='사이렌 소리에 거리 전체가 고개를 돌렸다. 백 개가 넘는 머리가. 앞 유리가 손바닥으로 덮였다. 손바닥마다 피와 고름이 번져 유리가 붉게 흐려진다. 차체가 흔들린다.\n\n시동을 껐다. 숨을 죽였다. 유리 너머에서 입들이 벌어졌다 닫힌다. 이가 빠진 잇몸이 유리를 긁는 소리가 끝없이 이어진다.';
S.y_checkpoint.text=s=>'정문 앞에 군용 트럭 두 대. 방독면을 쓴 군인들이 사람들을 줄 세우고 있다. 귀 체온계, 그리고 손전등으로 몸 구석구석을 비춘다.\n\n줄 앞쪽 남자가 소매를 걷자 팔에 붕대가 감겨 있다. 「이거 유리에 베인 거예요, 진짜로.」 군인은 대꾸 없이 그의 뒷덜미를 잡아 트럭 뒤로 끌고 갔다. 남자가 무릎을 꿇으며 애원하는 소리가 들리다가, 총성 한 발에 끊겼다. 트럭 바퀴 사이로 뇌수 섞인 피가 흘러나와 빗물 웅덩이와 섞였다.\n\n줄은 아무 일 없다는 듯 한 칸 앞으로 갔다.'+(sOn('bleed')?'\n\n!당신 팔에서도 피가 흐르고 있다.':'');
S.y_cp_lost.text='피가 멈추지 않았다. 대퇴동맥이었다. 손가락을 상처에 넣어 혈관을 직접 집으려 했지만 미끄러웠다. 이등병은 「엄마」라고 두 번 말하고, 오줌을 지리고, 조용해졌다.\n\n병장은 한동안 아무 말이 없다가 손짓했다. 가라고. 뒤에서 그가 총을 장전하는 소리가 들렸다. 이등병을 위해서였다. 다시 일어나기 전에.';
S.y_store_fail.text='뒷문을 연 순간 안에 있던 것이 덮쳐 왔다. 문짝으로 밀어붙이고 온몸으로 버텼다. 문틈에 끼인 손가락 세 개가 꿈틀거린다. 한 번 더 밀자 손가락뼈가 부러지는 소리가 났다. 놈은 아무렇지 않게 계속 밀었다.\n\n어깨가 찢겼다. 물리지는 않았다.';
S.y_pharmacy.text='약국 안에 남자 둘. 하나는 진열대를 쓸어 담고, 하나는 카운터 뒤에 쓰러진 약사의 가운 주머니를 뒤지고 있다. 약사의 머리 아래로 피가 고여 있다. 놈들이 한 짓이다. 놈들이 아니라, 이 남자들이.\n\n둘 다 고개를 들었다. 「어, 누나 혼자?」 하나가 칼을 꺼내 손톱 밑을 후비며 웃었다. 「약 찾으러 왔어? 우리가 찾아 줄게. 대신 누나도 우리 좀 도와줘야지.」';
S.y_ph_grab.text='한 놈이 손목을 낚아채 비틀었다. 다른 놈이 셔터를 내리기 시작한다. 덜컹, 덜컹. 바깥 빛이 줄어든다.\n\n「가방 내려. 천천히. 소리 내면 목부터 딴다.」 칼등이 턱 밑을 툭툭 친다. 「봐, 말 잘 듣잖아. 누나 머리 좋네. 저 약사 아줌마는 말을 안 들었거든.」';
S.th_men.text='「여기요, 안에 있는 거 다 알아. 문 좀 열어 봐.」 처음엔 부드러웠다. 「우리랑 있으면 안전해. 먹을 것도 있고.」\n\n문틈으로 손전등 빛이 기어 들어와 발끝을 훑고, 무릎을, 가슴께를 천천히 훑는다. 웃음소리.\n\n목소리가 바뀌었다. 「열라고, 씨발. 우리가 부수고 들어가면 그땐 안 착하다?」 누군가 문을 발로 찼다. 경첩이 비명을 질렀다. 「셋 셀게. 하나.」';
S.th_break.text='문고리가 부서졌다. 손전등 셋이 얼굴을 비춘다. 하나는 야구방망이, 하나는 식칼, 하나는 빈손. 빈손인 놈이 제일 무섭다. 웃고 있다.\n\n「봐, 있잖아. 숨어 있으니까 더 귀엽네.」 방망이가 벽을 쿵 쳤다. 「귀찮게 하지 말자. 서로 아프게.」';
S.th_fight.text='날이 첫 번째 남자의 손목을 파고들었다. 힘줄이 끊기는 감촉이 손잡이를 타고 올라왔다. 그가 비명을 지르며 주저앉자 손목이 이상한 방향으로 덜렁거렸다. 피가 바닥 타일 위로 번져 신발 밑창에 끈적하게 들러붙었다.\n\n「미친년! 미친년이야!」 그들은 다친 놈을 질질 끌고 사라졌다. 손이 떨려서 무기를 내려놓을 수가 없다. 손가락을 하나씩 펴야 했다.';
S.th_scream.text='비명이 건물 전체를 울렸다. 아래층에서 무언가 대답했다. 수십 개의 발소리가 계단을 올라온다.\n\n남자들이 먼저 돌아섰다. 그리고 먼저 붙잡혔다. 방망이를 든 놈의 비명이 제일 길었다. 계단참에서 그의 배가 열리는 소리를 들었다. 그 소리를 등지고 반대편 계단으로 뛰었다.';

/* ---------- 납치·감금·잡힘 ---------- */
S.k_start.text='머리에 자루가 씌워졌다. 개머리판이 옆구리를 쳤다. 트럭 짐칸. 다른 여자들이 숨죽여 우는 소리. 누군가 토하는 소리. 얼마나 달렸는지 모른다.\n\n자루가 벗겨졌을 때, 그곳은 물류창고 냉장실이었다. 쇠사슬. 얼룩진 매트리스 세 장. 양동이 하나. 여자 넷. 문 위에 매직으로 숫자가 쓰여 있다. 「7」.\n\n「새로 왔네.」 구석의 여자가 쉰 목소리로 말했다. 앞니가 두 개 없다. 「울지 마. 우는 애부터 데려가.」';
S.k_caught.text='문이 열렸다. 「이년이, 씨발.」 개머리판이 얼굴을 쳤다. 코에서 뜨거운 것이 쏟아졌다. 바닥에 이가 하나 굴렀다. 두 번째는 배. 세 번째는 이미 쓰러진 등.\n\n그들은 수정을 대신 끌고 나갔다. 「니 대신이야. 고마워해.」 한 시간 뒤 돌아온 수정은 아무 말도 하지 않았다. 입술이 터져 있었고, 손목엔 담뱃불 자국이 새로 생겨 있었다.';
S.k_final.text='트럭이 왔다. 사흘째 밤. 이름 대신 숫자가 불린다.\n\n「7번.」\n\n짐칸에는 이미 여자 셋이 묶여 있다. 운전석 옆 남자가 손전등으로 얼굴을 하나하나 비추며 턱을 잡아 돌린다. 이빨을 본다. 팔뚝을 꼬집어 본다. 무언가를 적는다. 가격처럼 보이는 숫자를.\n\n「이건 간호사래. 비싸게 받아.」';
S.c_robbed.text='주먹이 먼저 왔다. 광대뼈가 울렸다. 그다음엔 발. 웅크린 등 위로, 옆구리로, 머리로. 갈비뼈 하나가 뚝 하고 물러나는 소리를 몸 안에서 들었다.\n\n「이게 다야? 씨발, 간호사라며. 약 어딨어, 약!」 가방이 뒤집혔다. 붕대가, 물병이, 엄마 사진이 바닥에 흩어졌다. 누군가 사진을 밟고 지나갔다. 마지막으로 한 번 더 걷어차고, 발소리가 멀어졌다.\n\n입안에 피와 부러진 이 조각. 숨 쉴 때마다 옆구리가 칼로 찌르듯 결린다. 살아 있다. 가진 것의 절반과 함께.';
S.c_assault.text='얼마나 지났는지 모른다. 시간이 뚝 잘려 나갔다. 그 사이는 기억나지 않는다. 기억하지 않기로, 몸이 먼저 정했다.\n\n바닥이 차갑다. 손목에 손가락 모양으로 시퍼런 멍. 입술이 터져 피 맛이 난다. 찢어진 소매를 여미는 손이 멈추지 않고 떨린다. 그들의 웃음소리와 담배 냄새는 한참 전에 멀어졌는데, 아직 방 안에 있는 것 같다.\n\n물병의 물로 손을 씻었다. 씻고, 또 씻었다. 살갗이 벌게질 때까지. 물이 떨어지자 마른 손을 계속 문질렀다.\n\n일어나야 한다. 여기 계속 있으면 다른 것들이 온다. 알고 있는데, 일어나는 데 아주 오래 걸렸다. 그들의 얼굴은 기억한다. 하나도 빠짐없이.';

/* ---------- 마트 ---------- */
S.m_bite_report.text=s=>'오 실장은 아무것도 묻지 않았다. '+bwN()+'을(를) 하역장 밖으로 끌고 나가 셔터를 반쯤 내렸다. 셔터 아래로 무릎 꿇은 다리만 보였다. 「잠깐만요, 잠깐만…」\n\n쇠파이프가 내려가는 소리가 세 번. 첫 번째는 둔탁했고, 두 번째는 무언가 깨지는 소리였고, 세 번째는 젖어 있었다. 셔터 아래로 피와 함께 회색 덩어리가 흘러나왔다.\n\n'+(bwComp()?'셔터가 닫히기 직전, '+bwN()+'이(가) 당신을 돌아보았었다. 원망하는 눈이 아니었다. 그게 더 힘들었다.':'그날 밤, '+bwN()+' 몫이던 통조림이 당신 앞에 놓였다. 「잘했어, 간호사.」');
S.u_park.text=s=>'!'+bwN()+jx(bwN(),'이었던','였던')+' 것이 정 선생의 어깨를 물어뜯고 있다.\n\n정 선생의 쇄골이 드러났다. 비명이 하역장 천장을 때린다. 놈은 고개를 비틀어 살점을 뜯어내고, 삼키고, 다시 문다. 계단 위로 사람들이 깨어나는 소리. 오 실장의 손전등 빛이 내려온다.';
S.m_tie_turn.text=s=>'새벽 4시 12분. '+bwN()+'의 고개가 툭 꺾였다가, 천천히 들렸다. 눈이 하얗다. 입가로 검은 침이 흘러내린다. 밧줄이 끊어질 듯 팽팽해지고, 묶인 손목에서 살갗이 벗겨져 나간다. 아파하지 않는다.\n\n쇠파이프를 들었다. 한 번으로는 안 됐다. 두 번으로도. 다섯 번째에 두개골이 함몰되며 물컹한 감촉이 손목까지 전해졌다.\n\n그 다음에 한 일은 기억하지 않기로 했다. 손을 씻었다. 아무리 씻어도 손톱 밑의 회색은 빠지지 않았다.';
S.m_park_locked.text='철문 너머에서 정 선생이 문을 두드렸다. 처음엔 주먹으로, 나중엔 손바닥으로, 마지막엔 손톱으로. 이름을 불렀다. 당신의 이름이었다. 「제발, 제발, 열어 줘, 물려, 물리고 있어…」 목소리가 가르랑거리는 소리로 바뀌었다가 멎었다.\n\n아침에 오 실장이 문을 열었을 때, 그 안에는 둘이 있었다. 둘 다 사람이 아니었다. 철문 안쪽에 손톱자국이 빼곡했다. 손톱 몇 개는 문에 박힌 채 남아 있었다.';
S.u_cellar.text=s=>'!셔터가 뜯겨 나갔다.\n\n썩은 손들이 한꺼번에 쏟아져 들어온다. 맨 앞의 것은 얼굴 반쪽이 없다. 드러난 어금니가 손전등 빛에 번들거린다. '+mateName()+'이(가) 비명을 지르며 넘어진다. 발목을 무언가가 움켜쥔다. 손톱이 살을 파고든다.';
S.m_cellar_ok.text='날이 틈으로 들어온 손가락들을 내리쳤다. 마디가 잘려 나가며 검은 피가 튀었다. 놈들은 아파하지 않고 남은 손가락으로 계속 더듬었다. 다시 내리쳤다. 다시. 다시.\n\n셔터 너머에서 무언가 물러섰다. 그 틈에 상자 세 개를 들고 계단을 올랐다. 바닥에 손가락이 일곱 개 남았다. 세지 않으려 했는데 세어 버렸다. 그중 하나엔 결혼반지가 끼워져 있었다.';
S.m_siege.text=s=>'셔터가 안쪽으로 휘어 있다. 두드리는 소리는 한 번도 멈추지 않았다. 셔터 아래 틈으로 손가락들이 기어 들어와 바닥을 더듬는다. 손톱이 다 빠진 손가락들.\n\n'+mateName()+'은(는) 구석에서 물병을 끌어안고 오줌을 지린 채 떨고 있다. 지하 창고에 지린내와 썩은 내가 섞인다.\n\n위층에서는 아무도 내려오지 않는다.';
S.m_murder.text=s=>'냉동창고에서 '+victim()+'이(가) 발견됐다. 목이 졸린 채. 얼굴은 터질 듯 부어 검붉고, 눈의 흰자위마다 실핏줄이 다 터져 있다. 혀가 이 사이로 비어져 나와 있다. 손톱 밑에 누군가의 살갗.\n\n오 실장이 모두를 로비에 모았다. 「범인 나올 때까지 아무도 밥 없어. 굶어 죽기 싫으면 불어.」 그리고 당신을 보았다. 「간호사. 시체 좀 봐.」';
S.m_acc_wrong.text=s=>F('accused')+'은(는) 끝까지 아니라고 했다. 울면서, 무릎을 꿇고, 오 실장의 바짓가랑이를 붙잡고, 당신 이름을 부르며. 「서윤 씨, 말 좀 해 줘요, 제발!」 오 실장은 듣지 않았다.\n\n하역장 셔터가 내려갔다. 셔터 너머에서 비명이 다섯 번 끊겼다 이어졌다. 여섯 번째는 없었다.\n\n그날 밤, 진짜 범인이 로비 저편에서 담배를 피우며 당신을 보고 있었다. 웃고 있었다.';
S.m_mutiny.text=s=>'목소리가 떨리지 않았다. 「손톱 밑 살갗. 장갑 벗어 보세요.」\n\n로비가 조용해졌다. '+(withN().length?withN().join('와(과) ')+'이(가) 당신 옆에 섰다. ':'')+'정 선생 무리가 하나둘 일어섰다. 보안팀 최가 오 실장의 쇠파이프를 빼앗았다.\n\n오 실장은 하역장 밖으로 내던져졌다. 셔터 너머에서 그가 셔터를 두드리며 욕하다가, 애원하다가, 비명을 질렀다. 비명이 그르렁거리는 소리로 바뀌기까지 3분. 사람들은 그 3분 동안 아무도 말하지 않았다.'+(F('fac')==='oh'?'\n\n그리고 사람들이 당신을 보았다. 오 실장 편이었던 간호사. 그날부터 당신 몫은 늘 마지막에 나왔다.':'');
S.m_deal.text='오 실장이 사무실로 불렀다. 책상 위에 항생제 한 통, 통조림 다섯 개, 그리고 위스키. 그는 술 냄새를 풍기며 문을 잠갔다. 열쇠를 셔츠 주머니에 넣고 단추를 채웠다.\n\n「간호사 선생. 여기서 오래 살고 싶지?」 그가 통조림 하나를 손가락으로 툭 밀었다. 「민지는 똑똑해. 처음엔 울더니 이제 알아서 올라와. 당신도 똑똑하잖아. 계산 빠르잖아.」\n\n「싫으면 나가도 돼. 대신 내일부터 배급표에서 이름 빠지는 거고. 밤에 하역장 문이 잘 잠겼나 확인하는 사람도 없을 거고.」';
S.m_deal_force.text='그가 손목을 잡아챘다. 책상 모서리에 허리가 꺾였다. 위스키 병이 바닥을 굴렀다. 술 냄새와 땀 냄새. 귓가에 뜨거운 숨.\n\n「왜 이렇게 어렵게 가, 응? 똑똑하게 굴자니까.」 손아귀가 목을 눌렀다. 숨이 막힌다.';
S.m_oh_killed.text='두 번, 세 번. 날이 갈비뼈 사이로 들어갔다가 걸렸다. 빼내려고 발로 그의 가슴을 밀어야 했다. 그는 책상 위에 엎어진 채 몇 번 꿀렁거리다 멈췄다. 피가 위스키와 섞여 서류를 적시고 책상 모서리로 뚝뚝 떨어졌다.\n\n셔츠 주머니에서 열쇠를 꺼냈다. 피에 젖어 미끄러웠다. 서랍에 무기고 열쇠, 그리고 무전기.\n\n문밖에서 민지가 서 있었다. 그녀는 시체를 오래 내려다보더니, 아무것도 묻지 않고 걸레를 가지러 갔다.';
S.m_raid.text=s=>{const raiders=Object.keys(s.comp).filter(k=>s.comp[k].st==='raider').map(k=>COMP[k]);return '새벽 3시. 정문 쪽에서 불길이 치솟았다. 화염병. 셔터를 들이받는 트럭. 약탈자들이다. 셔터 틈으로 들어온 첫 번째 남자가 보안팀원의 얼굴을 손도끼로 갈랐다. 광대뼈째 쪼개진 얼굴이 두 쪽으로 벌어졌다.\n\n'+(F('kid')?'확성기에서 들리는 목소리를 안다. 「사장」. 냉장실 문 위의 숫자 7이 눈앞에 번진다.\n\n':'')+(raiders.length?'불빛 속에 아는 얼굴이 보인다. '+raiders.join(', ')+'. 손에 피 묻은 쇠파이프. 웃고 있지 않다.\n\n':'')+'「먹을 거랑 여자. 나머지는 다 태워. 남자는 보이는 대로 죽여.」'};
S.u_fire.text='!불길이 계단을 삼켰다.\n\n연기 때문에 앞이 보이지 않는다. 플라스틱 진열대가 녹아 바닥에 불붙은 채 흘러내린다. 어디선가 사람 타는 냄새. 누군가 발목을 잡는다. 「살려 줘.」 민지다. 그녀의 머리카락에 불이 붙어 있다.';
S.m_army.text='새벽 3시. 정문 셔터를 두드리는 건 놈들이 아니었다. 군복. 소총. 「민간인 소개 작전입니다. 문 여세요. 세 번 말 안 합니다.」\n\n문이 열리자 그들은 소개하지 않았다. 항의하던 노부부의 할아버지를 개머리판으로 쳐서 쓰러뜨렸다. 식량을 트럭에 실었다. 그리고 젊은 여자들을 한 줄로 세웠다. 「의무 지원 인력으로 차출합니다.」 하사 계급장을 단 남자가 여자들 얼굴을 손전등으로 하나씩 들여다보며 웃었다. 「지원 인력. 그래, 지원.」\n\n줄 끝에 민지가 서 있다. 그 옆에, 당신.';
S.m_army_take.text='개머리판이 어깨를 쳤다. 쇄골이 부러지는 소리. 바닥에 쓰러진 채 트럭 짐칸에 오르는 민지의 뒷모습을 보았다. 민지가 짐칸 문틀을 붙잡고 버티자 군인이 그녀의 손가락을 군홧발로 밟아 떼어 냈다.\n\n「간호사는 필요 없어. 이미 있어.」\n\n트럭이 떠났다. 식량 절반과, 여자 셋과 함께.';
S.u_horde.text='!셔터 하단이 찢어졌다.\n\n팔이, 머리가 틈으로 밀려 들어온다. 찢어진 철판 모서리에 걸려 살갗이 벗겨진 채로도 계속 밀고 들어온다. 로비에서 잠든 사람들이 비명을 지르며 일어난다. 맨 앞에 누운 대학생 하나가 일어나기도 전에 세 마리에게 덮였다.';

/* ---------- 탈출 여정 ---------- */
S.u_lab.text='!연구동 문이 열리자 하얀 가운들이 일어섰다.\n\n연구원들이었던 것들. 목에 출입증을 건 채. 하나는 자기 손으로 배를 가른 듯 내장이 가운 밖으로 늘어져 바닥에 끌린다. 그중 하나의 손에 유리병이 아직 쥐여 있다.';
S.e_bitten.text='트럭 아래에서 손이 튀어나왔다. 깔려 있던 운전사였던 것. 하반신은 트럭에 짓이겨진 채 상반신만으로 기어 나온다. 이빨이 팔뚝에 박혔다. 고개를 비틀자 살점이 뜯겨 나가는 소리가 났다.\n\n발로 그 머리를 짓밟았다. 두 번, 세 번. 두개골이 짓눌리며 눈알 하나가 튀어나왔다. 팔에 반달 모양 이빨 자국. 그 자리가 이미 화끈거린다.';
S.e_home2.text='복도는 조용하다. 엄마 집 현관 앞에 누군가 서 있다. 이마를 문에 댄 채. 런닝셔츠. 옆집 아저씨다. 아니, 옆집 아저씨였던 것.\n\n2주 넘게 저렇게 서 있었다. 이마가 문에 짓눌려 뼈가 드러나 있다. 문에는 이마 높이로 검붉은 얼룩이 둥글게 번져 있다. 매일, 조금씩, 문을 머리로 밀면서. 문 안쪽의 무언가를 기다리며.';
S.e_ajit.text=s=>'담장 개구멍은 그대로다. 냉장실 문 위의 숫자도. 안에서 여자 우는 소리, 남자들 코 고는 소리, 그리고 무언가 썩는 냄새. 하역장 구석에 비닐로 덮인 것들이 쌓여 있다. 비닐 밖으로 맨발이 삐져나와 있다. 발톱에 매니큐어가 남은 발.\n\n'+compLine();
S.u_river.text='!발이 미끄러졌다.\n\n물살이 다리 아래로 끌어당긴다. 흙탕물이 코와 입으로 밀려든다. 물속에서 무언가 발목을 붙잡는다. 하얗게 불어 터진 손. 살이 물러서 손가락 뼈가 살갗을 뚫고 나와 있다. 놓지 않는다.';
S.e_raider1.text='트럭은 매일 밤 다른 곳에 선다. 아파트, 교회, 학교. 「사장」은 당신을 「간호사」라고 부른다. 다친 놈들을 꿰매는 게 당신 일이다. 어제는 총알이 박힌 허벅지를 맨손으로 후벼 파냈다. 마취는 없었다. 놈은 소주를 들이켜며 당신 이름을 몰라 「야」라고 불렀다.\n\n오늘은 노부부가 사는 단독주택. 쌀 두 포대. 할아버지는 대문에서 쇠파이프에 맞아 쓰러졌다. 할머니가 당신 소매를 붙잡는다. 「색시, 색시는 사람이지? 응?」';
S.e_raider2.text=s=>'— 일지. 냉장실엔 여자들이 있다. 숫자가 붙어 있다. 당신은 그 앞을 지나 다친 놈들의 상처를 꿰맨다. 냉장실 안에서 누가 이름을 불러도 돌아보지 않는다.\n\n어젯밤 「사장」이 누군가의 칼에 죽었다. 목이 귀에서 귀까지 열린 채 자기 침대에서. 남은 놈들이 당신을 본다. 상처를 꿰매 주는 사람. 약을 아는 사람. 칼 쓰는 법을 아는 사람.';

/* ===== v11: 첫날 개연성 — 음압격리실 환자와 군 ===== */
S.y_start.loc='서울대병원 응급실 · 음압격리실 3번';

/* 준호가 없을 때 그 자리를 채우는 사람 */

 if(F('park')==='dead')kill('박 씨');

function lethalPass(ids){for(const id of ids){const sc=S[id];if(!sc||!Array.isArray(sc.choices))continue;
 sc.choices.forEach((c,i)=>{if(!c||c.lethal||c.risky||!isLethalC(c))return;const r=RECK[id+':'+i];
  if(r){if(typeof c.p==='number'&&c.p<50)c.p=Math.max(c.p,35);c.fail=r.to;const fe=c.failEff;const e=Object.assign({},r.eff);if(e.hp&&[].concat(e.add||[]).includes('bleed'))e.hp=Math.round(e.hp*.6);const f0=e.fn;e.fn=s=>{if(f0)f0(s);if(r.b)s.banner={t:r.b,bad:1}};
   c.failEff=fe?s=>{eff(fe);eff(e)}:e;c.risky=1}
  else{const p0=c.p;c.p=typeof p0==='function'?s=>Math.max(p0(s),65):Math.max(p0,65);c.lethal=1}})}}

  {t:'쇠창살을 닫는다',to:evNext,eff:{hum:-8,men:-10,fn:s=>{kill('막달레나 할머니');s.banner={t:'성가는 새벽 네 시쯤 끊겼다.',bad:1}}}}]});
S.ce_mass=CHP({loc:'금호동 성당 · 대성전',
 text:s=>'저녁 6시 미사. 촛불 몇 개. 장의자에 마흔 명이 앉아 있다. 신자도, 아닌 사람도.\n\n임 신부의 강론은 짧다. 「오늘 하루를 버틴 것도 은총입니다.」 '+(alive('박 회장')?'뒷줄에서 박 회장이 일어선다. 「신부님, 이건 심판입니다. 회개하지 않은 자들이 저 밖에서 걸어 다니는 겁니다.」 몇몇이 고개를 끄덕인다.':''),

  {t:'성전을 나와 진료소를 정리한다',to:evNext,eff:{men:4}}]});
S.ce_garden=CHP({loc:'금호동 성당 · 마당 텃밭',
 text:'비 온 다음 날. 데레사 수녀가 호미를 내민다. 「무는 지금 뽑아야 해요. 배추도. 언덕 아래 공원 쪽에 시금치가 남아 있을 거고.」\n\n언덕 아래 응봉산 공원까지는 오 분. 오 분 동안 아무것도 막아 주지 않는다.',

S.ce_thief=CHP({loc:'금호동 성당 · 급식소 창고',
 text:'새벽, 급식소 창고 문틈으로 손전등 빛. 안에 열 살쯤 된 남자아이가 쌀 봉지를 끌어안고 있다. 피난민 가족의 막내. 눈이 마주쳤다.\n\n아이가 울먹인다. 「엄마가… 엄마가 사흘째 국만 먹어요.」',
 choices:[
  {t:'쌀을 한 줌만 덜어 주고 돌려보낸다',to:evNext,eff:{hum:6,res:-3}},
  {t:'데레사 수녀에게 데려간다',to:evNext,eff:{hum:2,fn:bj('수녀님은 아이를 혼내지 않았다. 다음 날부터 그 집 국그릇에 건더기가 두 배였다.')}},
  {t:'박 회장에게 알린다',if:s=>alive('박 회장'),to:evNext,eff:{hum:-8,res:4,fn:bj('그 가족은 다음 날 아침 교육관 뒤편, 동그라미 친 사람들 자리로 옮겨졌다.',1)}}]});
S.ce_dog=CHP({loc:'금호동 성당 · 쇠창살 정문',
 text:'누렁이 한 마리가 쇠창살 밖에서 꼬리를 친다. 목줄에 이름표. 「복실이」. 갈비뼈가 다 보인다.\n\n자경단 하나가 침을 삼킨다. 「저거 잡으면 국이 한 솥이야.」',

  {t:'국이 된다',to:evNext,eff:{res:16,hum:-4,men:-4}},

S.ce_letter=CHP({loc:'금호동 성당 · 사제관',
 text:s=>'사제관 책상 위에 쓰다 만 편지. 임 신부의 글씨. 「주교님께. 지하 봉안당의 다섯 분을 어찌해야 할지 모르겠습니다. 물린 지 나흘이 지났는데 한 분은 아직 눈이 검습니다. 피를 흘리게 두었더니…」\n\n편지는 거기서 끝난다.',
 memo:{t:'봉안당. 다섯. 나흘. 눈이 검다?',warn:1},

S.ce_radio=CHP({loc:'금호동 성당 · 종탑',
 text:'지훈이 종탑 꼭대기에서 손짓한다. 어디서 주운 무전기. 「누나, 이거 사람 목소리예요.」 종탑 위에선 전파가 잘 잡힌다.',
 choices:[
  {t:'종탑에 올라 끝까지 듣는다',p:60,phys:false,ok:evNext,okEff:{flag:{heliInfo:1},clue:'signal',fn:bj('「…민간인 구조 헬기, 매일 정오, 서울대병원 본관, 잠실…」')},fail:evNext,failEff:{men:-2,fn:bj('잡음뿐이었다.')},adv:60},
  {t:'남쪽 소식만 받아 적는다',to:evNext,eff:{flag:{southInfo:1},fn:bj('평택. 안전지대. 정문은 서쪽.')},adv:30}]});

 text:'새벽 2시. 교육관 여자 방 문이 열린다. 자경단 완장 둘. 술 냄새. 손전등이 이불을 하나씩 들춘다.\n\n「동그라미 친 방이 어디였더라.」',

  {t:'일어나 데레사 수녀를 부르겠다고 소리친다',p:70,mods:[trM],ok:evNext,okEff:{hum:4,fn:bj('둘은 욕을 하며 나갔다. 다음 날 아침 수녀님이 그들 완장을 거두어 갔다.')},fail:s=>caughtCH(F('evNext'))},
  {t:'방의 여자들을 한꺼번에 깨운다',p:70,mods:[trM],ok:evNext,okEff:{hum:6,fn:bj('여자 아홉이 한꺼번에 일어섰다. 손전등 둘은 계단을 굴러 내려갔다.')},fail:s=>caughtCH(F('evNext'))}]});
S.ce_arrival=CHP({loc:'금호동 성당 · 쇠창살 정문',

 choices:[

  {t:'신부님께 부탁한다',if:s=>alive('임 신부'),to:evNext,eff:{fn:s=>{s.comp[F('arrK')].st='with';s.banner={t:'임 신부가 직접 쇠창살을 열었다.'}}}},
  {t:'지켜보기만 한다',to:evNext,eff:{hum:-4}}]});
S.ce_wedding=CHP({loc:'금호동 성당 · 대성전',
 text:s=>'응우옌 씨와 란이 수줍게 다가온다. 혼인신고는 했지만 결혼식은 못 했다고. 임 신부가 혼배성사를 해 주겠다고 했다.\n\n「증인이 필요해요. 선생님이 서 주세요.」'+(alive('박 회장')?' 뒤에서 박 회장이 혀를 찬다. 「세례도 안 받은 사람들한테.」':''),

S.ce_tower=CHP({loc:'금호동 성당 · 종탑',
 enter:s=>{F('towerSeen',1);brSet('동호대교','x');brSet('성수대교','x');brSet('한남대교','x')},
 text:'지훈이 종탑 사다리를 잡아 준다. 꼭대기에 서면 한강이 한눈에 들어온다.\n\n동호대교 북단에 장갑차 둘. 성수대교는 가운데 상판이 내려앉았다. 한남대교 위엔 불탄 버스들이 줄지어 서 있다. 그리고 동호대교 아래층, 3호선 선로 위를 무언가 천천히 걸어간다. 사람인지 아닌지는 모르겠다.',

  {t:'내려온다',to:evNext}]});
S.ce_knock=CHP({loc:'금호동 성당 · 쇠창살 정문',
 text:'오후 3시. 쇠창살 밖에 젊은 여자가 갓난아기를 안고 서 있다. 「들어가게 해 주세요. 아기가 열이 나요.」\n\n아기 이마에 손을 대 보려면 쇠창살을 열어야 한다. 그녀의 발목 붕대에 검붉은 얼룩.',
 choices:[
  {t:'쇠창살을 열고 둘 다 진료소로 데려간다',p:55,heal:1,ok:evNext,okEff:{hum:8,fn:bj('발목은 철조망에 긁힌 것이었다. 아기 열은 이틀 만에 내렸다.')},fail:evNext,failEff:{hum:6,men:-14,hp:-10,fn:bj('물린 자국이었다. 그날 밤 그녀가 변했다. 아기는 데레사 수녀가 받아 안았다.',1)},adv:30},
  {t:'아기만 받고 엄마는 밖에 두자고 한다',to:evNext,eff:{hum:-6,men:-10,fn:bj('그녀는 아기를 건네고 쇠창살 앞에 앉았다. 해 질 녘에 자경단이 그녀를 계단 아래로 데려갔다.',1)}},

S.ch_bell=CHP({time:T(5,11,30),loc:'금호동 성당 · 종탑 아래',
 text:s=>'정오 30분 전. 종탑 아래에서 임 신부와 박 회장이 마주 섰다. 지훈이 종 줄을 쥐고 둘을 번갈아 본다.\n\n임 신부: 「종을 쳐야 길 잃은 사람들이 여기를 찾습니다.」\n박 회장: 「종을 치면 놈들도 여기를 찾아요. 어제 계단 아래에만 서른 마리였어.」\n\n둘 다 당신을 본다. 진료소의 간호사가 무슨 편인지, 다들 궁금해한다.',

  {t:'종을 멈추자고 한다',to:'ch_bell_stop',eff:{hum:-3,flag:{bellStop:1}}},
  {t:'종 대신 종탑에서 거울로 햇빛 신호를 보내자고 한다',to:'ch_bell_mirror',eff:{hum:3,flag:{mirror:1}}}]});
S.ch_bell_ring=CHP({loc:'금호동 성당 · 종탑',
 enter:s=>{if(F('bellIn'))return;F('bellIn',1);F('chLost',(F('chLost')||0)-5)},

S.ch_bell_siege=CHP({time:T(5,22,0),loc:'금호동 성당 · 쇠창살 정문',crisis:{name:'포위',len:10,note:'동이 트기까지'},

  {t:'교육관 아이들과 노인들을 사제관 돌벽 안으로 옮긴다',to:'ch_crypt',eff:{hum:4,men:-10,hp:-4},adv:360}]});
S.ch_bell_stop=CHP({loc:'금호동 성당 · 종탑',
 text:'종은 울리지 않았다. 임 신부는 종탑 아래 의자에 앉아 정오가 지나갈 때까지 묵주를 돌렸다.\n\n그날 밤, 계단 아래 골목에서 누군가 오래 「아무도 없어요?」 하고 불렀다. 아무도 대답하지 않았다.',

  {t:'천장 비상 해치를 밀고 올라간다',p:70,ok:'g_cross',okEff:{hp:-8,men:-6,fn:bj('케이블에 손바닥이 쓸렸다. 19층 문틈을 비집고 빠져나왔다. 아래에서 비명이 오래 이어졌다.',1)},fail:'g_cross',failEff:{hp:-22,men:-8,fn:bj('케이블을 놓쳤다. 한 층 아래 엘리베이터 지붕으로 떨어졌다. 갈비뼈가 울렸다. 문틈을 손톱으로 벌려 기어 나왔다.',1)}},
  {t:'앞사람을 밀어내고 18층으로 뛰쳐나간다',p:85,ok:'g_cross',okEff:{hum:-12,men:-10,fn:bj('밀려 나간 사람은 손가락들 쪽으로 넘어졌다. 그 옆을 지나 사무실 칸막이 사이로 뛰었다.',1)},fail:'death:elevator'}]};
S.g_roof={loc:'한빛타워 · 옥상 헬기장',
 text:'옥상. 바람. 헬리패드의 H자 위에 스무 명이 서서 하늘을 본다. 방송사 헬기 한 대가 경복궁 쪽으로 낮게 지나간다. 손을 흔들어도 돌아보지 않는다.\n\n{쾅. 쾅.}\n\n옥상 문을 안에서 누군가 두드린다. 사람의 박자가 아니다.\n\n난간 너머 옆 빌딩 옥상까지 4미터. 그 사이로 세종대로가 까마득하다.',
 memo:{t:'헬기는 안 온다'},
 choices:[
  {t:'옥상 사람들과 문을 막고 버틴다',p:60,ok:'g_stair',okEff:{hum:6,men:-4,fn:bj('철제 의자와 화분으로 문을 막았다. 한 시간 뒤 두드림이 멎었다. 문을 열었을 땐 계단에 아무도 없었다. 아무것도.')},fail:'g_stair',failEff:{hp:-14,add:'bleed',fn:bj('문이 밀렸다. 팔을 긁혔다. 계단으로 뛰어든 건 셋이었다.',1)},adv:60},
  {t:'창고의 사다리를 걸쳐 옆 빌딩 옥상으로 건너간다',p:75,lethal:1,move:1,ok:'g_lobby',okEff:{men:-6,fn:bj('사다리가 휘었다. 아래를 보지 않았다. 옆 빌딩은 텅 비어 있었다. 계단으로 1층까지, 아무도 만나지 않았다.')},fail:'death:fall',adv:20},
  {t:'두드림이 멎을 때까지 기다렸다가 계단으로 내려간다',to:'g_stair',eff:{men:-8},adv:90}]};
S.g_stair={loc:'한빛타워 · 비상계단 24층',
 text:'계단은 사람으로 꽉 찼다. 정장, 슬리퍼, 사원증 목줄. 한 칸 내려가는 데 1분.\n\n아래에서 비명이 올라온다. 17층 방화문이 열렸다는 말이 위로 전해진다. 사람들이 멈춘다. 뒤에서는 계속 민다.\n\n바로 옆에 24층 방화문. 그 너머로 「법무법인」 금박 글씨가 붙은 유리문이 보인다. 벽에는 비상 대피도.',
 memo:{t:'17층 막힘',warn:1},
 choices:[
  {t:'24층으로 들어가 반대편 계단으로 간다',p:70,move:1,ok:'g_cross',okEff:{men:-2},fail:'g_cross',failEff:{hp:-10,fn:bj('방화문 뒤에 하나가 서 있었다. 서류철로 얼굴을 막고 밀쳐 냈다. 팔에 멍.',1)},adv:5},
  {t:'벽의 비상 대피도를 읽는다 — 다른 길이 있을 것이다',p:60,phys:false,ok:'g_mid',okEff:{flag:{gExitMap:1},fn:bj('대피도 구석에 작은 글씨. 「12층 피난안전구역 — 화물용 계단 연결.」 사람들이 모르는 계단이 하나 더 있었다.')},fail:'g_cross',failEff:{men:-4,fn:bj('도면이 머리에 들어오지 않았다. 뒤에서 밀려 24층 문으로 떠밀렸다.',1)},adv:4},
  {t:'위쪽에 소리쳐 알리고, 소화전 호스로 계단을 막는다',p:55,ok:'g_cross',okEff:{hum:10,men:-4,fn:bj('호스를 난간에 세 겹으로 감았다. 올라오던 것들이 엉켰다. 위에서 누군가 「고마워요!」 하고 외쳤다.')},fail:'g_cross',failEff:{hp:-12,hum:6,fn:bj('호스를 감다 소매를 물렸다. 천만 찢어졌다. 다행히.',1)},adv:8}]};
S.g_cross={loc:'한빛타워 · 24층 법무법인 사무실',
 text:'불 꺼진 사무실. 칸막이 사이로 비상등 빛. 서버실 냉각기가 혼자 웅웅거린다.\n\n{드르륵. 드르륵.}\n\n복합기 앞에 누군가 서 있다. 출력 버튼을 계속 누른다. 고개가 이상한 각도로 꺾여 있다. 종이가 바닥에 쌓인다.\n\n탕비실 문이 열려 있다. 생수 박스와 과자. 반대편 끝에 비상계단 표시.',
 memo:{t:'소리 내지 마'},
 choices:[
  {t:'탕비실을 턴다',p:70,ok:'g_mid',okEff:{give:['water','can'],fn:bj('생수 한 병과 견과류 캔. 가방 지퍼를 올리는 소리에 복합기 앞의 것이 고개를 돌렸다. 이미 계단 문을 닫은 뒤였다.')},fail:'g_mid',failEff:{give:'water',hp:-12,fn:bj('컵이 떨어졌다. 그것이 달려왔다. 생수 한 병만 쥐고 계단으로 굴렀다.',1)},adv:10},
  {t:'숨을 죽이고 칸막이 사이로 지나간다',to:'g_mid',eff:{men:-3},adv:6}]};
S.g_mid={loc:'한빛타워 · 12층 비상계단',
 text:'12층부터 연기다. 지하 식당가에서 불이 났다는 말. 계단 아래쪽이 하얗게 흐리다. 눈이 따갑다.\n\n벽에 붙은 녹색 표지. 「피난안전구역」. 그 안쪽에 화물용 계단이 따로 있다. 철문은 잠겨 있고, 옆에 관리실 번호 키박스.',
 memo:{t:'연기는 위로',warn:1},
 choices:[
  {t:'젖은 손수건으로 입을 막고 연기 속을 내려간다',p:60,ok:'g_lobby',okEff:{hp:-8,fn:bj('셀 수 없을 만큼 기침을 했다. 1층 방화문을 밀었을 때 폐가 타는 것 같았다.')},fail:'g_lobby',failEff:{hp:-20,fn:bj('연기를 들이켰다. 무릎으로 기어 내려갔다. 누가 끌어 줬는지 모른다.',1)},adv:10},
  {t:'키박스 번호를 맞춰 화물 계단을 연다',p:50,phys:false,mods:[[s=>F('gExitMap'),20,'대피도']],ok:'g_lobby',okEff:{men:2,fn:bj('관리 번호는 층수와 준공 연도 조합이었다. 세 번째에 열렸다. 화물 계단엔 아무도 없었다. 연기도.')},fail:'g_lobby',failEff:{hp:-12,men:-4,fn:bj('네 번 틀렸다. 결국 연기 속으로 내려갔다.',1)},adv:8}]};
S.g_lobby={loc:'한빛타워 · 1층 로비',
 text:'로비. 정문 유리 너머 세종대로는 소리로 넘친다. 버스가 옆으로 누워 있다. 사람들이 광화문 광장 쪽으로 뛰고, 그 사이에 뛰지 않는 것들이 섞여 있다.\n\n보안 게이트는 정전으로 잠겼다. 경비원 하나가 게이트 뒤에서 무전기를 붙들고 있다. 그 뒤로 지하주차장 통로 문. 「관계자 외 출입금지」.',
 memo:{t:'지하로'},
 choices:[
  {t:'경비원에게 말을 건다 — 주차장 문을 열어 달라고',p:60,phys:false,ok:'g_park',okEff:{hum:4,fn:bj('「차 있어요. 같이 나가요. 혼자 여기 있으면 저녁까지 못 버팁니다.」 경비원이 한참 보더니 열쇠를 돌렸다. 그는 따라오지 않았다.')},fail:'g_park',failEff:{hp:-8,men:-6,fn:bj('경비원은 고개를 저었다. 게이트를 넘다 정강이를 찧었다. 통로 문은 발로 찼다. 세 번.',1)},adv:5},
  {t:'안내 데스크의 도심 지도를 챙기고 게이트를 넘는다',p:70,ok:'g_park',okEff:{fn:s=>gainMap('job')},fail:'g_park',failEff:{hp:-10,fn:s=>{gainMap('job');s.banner={t:'지도를 쥔 채 게이트를 넘다 굴렀다. 손목이 시큰거린다.',bad:1}}},adv:6},
  {t:'정문으로 뛰쳐나가 광장을 가로지른다',p:62,move:1,ok:'g_square',fail:'g_square',failEff:{hp:-18,add:'bleed',fn:bj('누군가의 손이 발목을 잡았다. 구두 한 짝을 내주고 빠져나왔다. 정강이가 찢어졌다.',1)},adv:10}]};
S.g_square={loc:'광화문 광장',enter:s=>F('noTruck',1),
 text:'광장을 가로질렀다. 동상 아래 사람들이 엉켜 있다. 누군가 당신 소매를 잡았다가 놓쳤다. 돌아보지 않았다.\n\n세종문화회관 뒤 골목. 숨을 고른다. 차는 저 빌딩 지하에 있다. 다시 들어갈 수는 없다.\n\n주머니에서 휴대폰이 운다. 본부장.',
 memo:{t:'차는 버렸다'},
 choices:[{t:'전화를 받는다',to:'g_call',adv:2}]};
S.g_park={loc:'한빛타워 · 지하 3층 주차장',
 text:'지하 3층. 비상등만 켜져 있다. 회사 법인 차량, 검은 SUV. 리모컨을 누르자 깜빡이가 두 번 켜진다.\n\n{삑삑.}\n\n주차장 어딘가에서 무언가 그 소리를 향해 몸을 돌린다. 신발 끄는 소리.\n\n트렁크에는 노트북 백팩과 고객 선물용 골프 세트. 하나만 꺼낼 시간이다.',
 memo:{t:'트렁크'},
 choices:[
  {t:'노트북은 버리고 백팩만 비워 멘다',to:'g_call',eff:{bag:'backpack'},adv:3},
  {t:'골프백에서 7번 아이언을 뽑는다',to:'g_call',eff:{give:'pipe',fn:bj('7번 아이언. 쥐어 보니 생각보다 가볍다. 무기라고 부르기엔 우스웠다. 그래도 쥐었다.')},adv:3},
  {t:'아무것도 챙기지 않고 운전석으로',to:'g_call',eff:{men:2},adv:1}]};
S.g_call={enter:s=>F('gCalled',1),loc:s=>F('noTruck')?'세종문화회관 뒤 골목':'지하 3층 · 차 안',
 text:s=>(F('noTruck')?'':'시동. 계기판 연료는 절반. 문을 잠그자 유리창에 손바닥이 찍혔다.\n\n휴대폰이 운다. 본부장.\n\n')+'「§K§아, 살아 있지? 잘 들어. 여의도 들어올 수 있으면 37층 내 방 금고. 영흥바이오 실사 보고서랑 외장하드. 오늘 안에 그거 빼.」\n\n「본부장님, 지금 밖이…」\n\n「알아. 그래서 하는 말이야. 그게 남한테 넘어가면 우리 다 끝나. 다리는 오늘 밤 닫힌대. 마포대교는 아직 열려 있어.」\n\n통화가 끊긴다. 집은 잠실이다. 강 건너, 동쪽. 여의도도 강 건너, 서쪽.',
 memo:{t:'37층 금고',warn:1},
 choices:[
  {t:'「그 서류, 뭡니까?」 다시 전화를 건다',act:'다시 전화를 건다',say:'「그 서류, 뭡니까?」',once:'kAsk',p:60,phys:false,ok:'g_call',okEff:{flag:{kTruth:1},fn:bj('본부장은 한참 숨만 쉬다 말했다. 「국방부 계약서. 사고 나면 손실은 나라가 메운다는 조항. 그리고 명단. 누가 먼저 구조되는지.」 그리고 끊었다.')},fail:'g_call',failEff:{men:-4,fn:bj('신호만 간다. 다시는 받지 않았다.',1)},adv:5},
  {t:'전화를 끊는다 — 살아서 빠져나가는 게 먼저다',to:'g_drive',eff:{men:-2},adv:2},
  {t:'마포대교로 — 여의도 본사, 37층 금고',lock:s=>'다음 작업에서 열림',to:'g_drive'}]};
S.g_drive={loc:s=>F('noTruck')?'종로 · 뒷골목':'을지로 사거리',
 text:s=>F('noTruck')?'걷는다. 종로 뒷골목. 셔터 내린 가게들 사이로, 동쪽으로.\n\n구두 뒤축이 벌써 까졌다. 잠실까지 12킬로미터. 강 건너.':'차는 종로를 빠져나가지 못한다. 버스와 택시가 엉킨 사이로 사람들이 뛴다. 을지로로 꺾었다.\n\n을지로 사거리에서 정장 차림 셋이 손을 흔든다. 하나는 다리를 전다. 바짓단이 젖어 있다. 피인지 물인지.\n\n「다쳤어요? 어디서요?」\n\n그가 고개를 젓는다. 「넘어졌어요. 진짜예요.」',
 memo:{t:'동쪽으로',warn:1},
 choices:[
  {t:'셋 다 태운다',if:s=>!F('noTruck'),to:'g_gbr',eff:{hum:8,flag:{gPick:'all'}},adv:25},
  {t:'절뚝이는 하나는 두고 간다',if:s=>!F('noTruck'),to:'g_gbr',eff:{hum:-6,men:-6,flag:{gPick:'two'},fn:bj('문을 잠갔다. 그가 창문을 두드렸다. 백미러 속에서 그가 주저앉았다.',1)},adv:25},
  {t:'아무도 태우지 않고 강변북로로 밟는다',if:s=>!F('noTruck'),to:'g_gbr',eff:{men:-2},adv:25},
  {t:'뒷골목을 따라 동쪽으로 걷는다',if:s=>F('noTruck'),to:'g_jbridge',eff:{men:-6},adv:240}]};
S.g_gbr={loc:'강변북로 · 영동대교 북단',
 enter:s=>{if(F('gPick')==='all'&&!F('gTurnRoll')){F('gTurnRoll',1);if(Math.random()<.4){F('gTurned',1);eff({men:-10});s.banner={t:'뒷좌석에서 비명. 절뚝이던 사람이 변했다. 나머지 둘은 달리는 차에서 문을 열고 뛰어내렸다. 뒷문을 잠근 채로 달렸다.',bad:1}}else s.banner={t:'뒷좌석의 셋은 성수대교 북단에서 내렸다. 절뚝이던 사람이 꾸벅 인사했다. 진짜로 넘어진 거였다.'}}},
 text:'강변북로는 주차장이다. 차들 사이로 사람들이 걷는다. 몇몇은 걷는 게 아니다.\n\n갓길이 비어 있다. 가드레일과 차들 사이, 차 한 대 폭.',
 memo:{t:'갓길'},
 choices:[
  {t:'갓길로 밀고 나간다',p:85,move:1,lethal:1,ok:'g_jbridge',okEff:{men:-4,fn:bj('사이드미러 두 개를 잃었다. 무언가를 두 번 밟았다. 잠실대교 표지판이 보였다.')},fail:'death:wreck',adv:20},
  {t:'차 사이를 천천히 비집고 간다',to:'g_jbridge',eff:{men:-8,fn:bj('두 시간. 앞 유리에 손바닥 자국이 겹겹이 쌓였다. 와이퍼로는 지워지지 않았다.')},adv:120}]};
S.g_jbridge={time:T(1,13,30),loc:'잠실대교 북단',
 text:'잠실대교 북단. 장갑차 두 대가 다리를 막았다. 방독면을 쓴 군인들. 확성기가 같은 말을 되풀이한다.\n\n「한강 이북은 감염 구역으로 지정되었습니다. 다리에 접근하면 발포합니다.」\n\n강 건너 잠실. 혼자 사는 오피스텔이 저기 있다. 냉장고에 맥주 여섯 캔, 그게 전부인 집. 그래도 집이다.',
 memo:{t:'강 건너 집',warn:1},
 choices:[
  {t:'바리케이드를 차로 들이받는다',if:s=>!F('noTruck'),p:60,ok:'g_dusk',okEff:{hp:-10,men:-10,flag:{truckDent:1},fn:bj('장갑차는 꿈쩍도 안 했다. 범퍼가 접히고, 경고 사격이 앞 유리를 깼다. 후진했다. 손이 떨려서 기어가 들어가지 않았다.',1)},fail:'g_dusk',failEff:{hp:-25,add:'bleed',men:-10,flag:{truckDent:1},fn:bj('경고 사격이 아니었다. 유리 파편이 어깨에 박혔다. 어떻게 후진했는지 기억나지 않는다.',1)},adv:10},
  {t:'군인에게 다가가 말을 건다 — 회사 사원증을 보여 준다',p:55,phys:false,mods:[[s=>F('kTruth'),15,'계약서 이야기']],ok:'g_dusk',okEff:{flag:{heliInfo:1},men:4,fn:bj('「세진자산운용…」 군인이 사원증을 오래 봤다. 「명단에 있는 회사네.」 방독면 너머로 낮게 말했다. 「잠실 101동 옥상, 매일 정오에 헬기 내려요. 명단 있는 사람 먼저.」')},fail:'g_dusk',failEff:{hp:-8,men:-6,fn:bj('개머리판이 명치에 들어왔다. 「뒤로!」 숨이 돌아올 때까지 아스팔트에 엎드려 있었다.',1)},adv:20},
  {t:'돌아선다',to:'g_dusk',eff:{men:-6},adv:10}]};
S.g_dusk={time:T(1,17,30),loc:'뚝섬 유원지 주차장',
 text:s=>(F('noTruck')?'해가 진다. 구두 뒤축이 다 까졌다. 발바닥이 젖은 건 피 때문이다.':'해가 진다. 연료 게이지는 4분의 1.')+'\n\n라디오. 「성동구 지정 대피소, 서울숲역 개방.」 멀리 금호동 언덕에서 종소리. 강 건너 자양동 쪽, 마트 옥상에 「생존자 있음」 현수막.\n\n밤에 움직이는 건 미친 짓이다.',
 memo:{t:'오늘 밤 어디서'},
 choices:[
  {t:s=>F('noTruck')?'공중화장실 맨 끝 칸에 숨어 밤을 넘긴다':'차 문을 잠그고 뒷좌석에서 밤을 넘긴다',to:'g_night',adv:30},
  {t:'자양동 마트로 간다 — 「생존자 있음」',to:'y_mart_gate',eff:{fn:truckArrive},adv:20},
  {t:'서울숲역 대피소로 간다',to:'ss_gate',eff:{fn:truckArrive},adv:15},
  {t:'금호동 성당으로 — 종소리를 따라 언덕길을 오른다',p:65,move:1,ok:'ch_gate',okEff:{fn:truckArrive},fail:'ch_gate',failEff:{hp:-14,add:'bleed',fn:s=>{F('noTruck',1);s.banner={t:'언덕길에서 차가 미끄러져 전봇대를 받았다. 버리고 걸었다. 종소리가 가까웠다.',bad:1}}},adv:40}]};
S.g_night={time:T(1,23,30),loc:s=>F('noTruck')?'뚝섬 · 공중화장실':'뚝섬 · 차 안',
 text:s=>(F('noTruck')?'맨 끝 칸. 문고리를 넥타이로 묶었다. 변기 뚜껑 위에 앉아 무릎을 안았다.':'문을 잠갔다. 뒷좌석에 누웠다. 트렁크엔 고객 선물용 견과 세트 두 상자. 명절에 돌리려던 것.')+'\n\n자정.\n\n{똑. 똑. 똑.}\n\n규칙적이다. 「사람이에요. 문 좀… 아이가 있어요.」',
 memo:{t:'열까'},
 choices:[
  {t:'문을 연다',p:60,ok:s=>F('noTruck')?'g_hub':'g_day2',okEff:{hum:10,men:4,flag:{gFamily:1},fn:bj('엄마와 일곱 살 남자아이. 아이는 새벽까지 당신 재킷을 덮고 잤다. 재킷 안주머니의 사원증이 아이 뺨에 눌려 있었다.')},fail:s=>F('noTruck')?'g_hub':'g_day2',failEff:{hp:-14,add:'bleed',hum:4,flag:{gFamily:1},fn:bj('여자 등 뒤로 다른 손이 문을 붙잡았다. 문을 다시 닫는 데 팔 하나를 내줬다. 엄마와 아이는 안에 있었다.',1)},adv:10},
  {t:'열지 않는다',to:s=>F('noTruck')?'g_hub':'g_day2',eff:{hum:-8,men:-10,fn:bj('두드림은 새벽 두 시에 멈췄다. 비명은 그보다 먼저 멈췄다.',1)},adv:10},
  {t:s=>F('noTruck')?'문 아래로 생수를 밀어 준다':'창문을 한 뼘 내리고 견과 세트를 내민다',to:s=>F('noTruck')?'g_hub':'g_day2',eff:{hum:2,men:-6,fn:s=>{if(F('noTruck')&&has('water'))eff({take:'water'});s.banner={t:'「…고맙습니다.」 발소리가 멀어졌다. 그 뒤는 모른다.',bad:1}}},adv:10}]};
S.g_day2={time:T(2,7,0),loc:'뚝섬 · 셀프 주유소 앞',
 text:s=>'아침. 연료 경고등이 깜빡인다. 기름 없이는 이 차는 그냥 철 상자다.\n\n500미터 앞 셀프 주유소. 정전. 그런데 주유기 앞에서 남자 셋이 수동 펌프 레버를 돌리고 있다. 쇠파이프, 각목. 하나가 당신 차를 보고 손을 멈춘다.'+(F('gFamily')?'\n\n뒷좌석의 엄마가 아이 손을 꼭 잡는다.':''),
 memo:{t:'기름',warn:1},
 choices:[
  {t:'손목시계와 기름을 바꾸자고 한다',p:65,phys:false,ok:'g_hub',okEff:{fn:bj('「이 시계, 지금 팔아도 기름 몇 통 값은 넘어요. 세상이 끝나도 금속은 금속이고.」 셋 중 나이 든 쪽이 시계를 귀에 대 봤다. 「한 통만.」')},fail:'g_hub',failEff:{hp:-10,men:-4,fn:bj('시계는 가져가고 기름은 안 줬다. 항의하자 각목이 날아왔다. 경고등은 그대로다.',1)},adv:30},
  {t:'차로 밀고 들어가 주유기를 차지한다',p:70,lethal:1,ok:'g_hub',okEff:{hum:-6,men:-4,fn:bj('셋이 흩어졌다. 레버를 직접 돌렸다. 팔이 빠질 것 같았다. 반 통.')},fail:'death:raiders',adv:40},
  {t:'차를 버리고 걷는다',to:'g_hub',eff:{men:-6,flag:{noTruck:1},fn:bj('트렁크에서 견과 세트 하나만 꺼냈다. 법인 차량 반납은, 이제 아무도 안 받는다.',1)},adv:20}]};
S.g_hub={loc:'강변 · 오전',
 text:s=>(F('noTruck')?'걸어서 갈 수 있는 곳은 셋.':'남은 기름으로 갈 수 있는 곳은 셋.')+' 집은 강 건너다. 다리는 닫혔다. 우선 살아남아야 한다.\n\n'+(F('kTruth')?'수첩 맨 앞장에 적었다. 국방부 계약. 손실은 나라가. 명단. 누가 먼저.':F('heliInfo')?'101동 옥상, 매일 정오. 명단 있는 사람 먼저. 군인의 말을 수첩 맨 앞장에 적었다.':'본부장에게 다시 걸었다. 꺼져 있다. 배터리 21%.'),

const kDecoy={t:'차에 연료통을 붓고 시동을 건다 — 놈들을 끌고 간다',if:s=>isKang()&&F('truckWall')&&has('fuel'),to:'g_decoy',eff:{fn:s=>F('decoyBack',s.scene)}};

S.g_decoy={loc:'은신처 입구 · 운전석',
 text:'연료통 하나. 시동이 걸렸다. 입구 앞에 몰려든 놈들이 일제히 고개를 돌린다. 헤드라이트 속에 쉰, 예순.\n\n등 뒤에서 사람들이 짐을 메고 반대편 출구로 빠져나갈 준비를 한다. 경적을 누르면 놈들은 이 차를 따라올 것이다. 그리고 이 차는 다시 돌아오지 못할 것이다.',
 memo:{t:'마지막 포지션',warn:1},
 choices:[
  {t:'경적을 누르며 강변으로 끌고 간다',p:65,lethal:1,ok:'end:kang_decoy',fail:'death:wreck',adv:60},
  {t:'시동을 끈다',to:s=>F('decoyBack')||'ss_leave',eff:{men:-4}}]};

E.kang_decoy={n:'마지막 포지션',hid:1,t:s=>'경적을 눌렀다. 길게. 놈들이 차를 따라 몸을 돌렸다. 강변으로, 강변으로.\n\n백미러 속에서 은신처 사람들이 반대편으로 빠져나가는 손전등 불빛이 보였다. 하나, 둘, 열, 스물.\n\n뚝섬 유원지에서 연료가 떨어졌다. 차 지붕으로 올라갔다. 놈들이 바다처럼 차를 둘러쌌다.\n\n평생 남의 돈으로 위험을 샀다. 처음으로 내 걸 걸었다. 수익률은 계산하지 않기로 했다.\n\n동이 틀 무렵, 강 건너 남쪽으로 이어지는 불빛 줄이 보였다. 사람들은 끝까지 걸었다.\n\n'+dateOf(day())+'. 차 지붕 위에서, 처음으로 오래 잤다.'};
D.wreck={n:'차량 전복',h:'갓길은 비어 있는 데는 이유가 있다.',t:'갓길 끝에 버려진 승용차가 있었다. 핸들을 꺾었다. 늦었다.\n\n차가 옆으로 누웠다. 앞 유리가 거미줄처럼 갈라지고, 그 너머로 아스팔트가 천천히 돌았다. 안전띠가 가슴을 눌렀다. 숨이 반만 들어왔다.\n\n깨진 창문으로 손들이 들어왔다. 안전띠 버클은 피에 젖어 미끄러웠다. 끝내 풀리지 않았다.',v:['조수석 바닥에 시세 앱이 켜진 휴대폰이 떨어져 있었다. 전부 파란색이었다.','{c}이(가) 창문 밖에서 당신 이름을 불렀다.','{d}일을 달린 차가, 한 번의 핸들에.']};
D.elevator={n:'닫히지 않는 문',h:'좁은 상자 안에서는 도망칠 곳이 없다.',t:'문은 끝까지 열렸다. 열두 명이 한꺼번에 뒤로 몰렸고, 당신은 맨 앞에 있었다.\n\n첫 번째 손이 넥타이를 잡았다. 그대로 끌려 나갔다. 18층 복도 바닥, 대리석이 차가웠다.\n\n{띵—}\n\n문이 닫히는 소리. 숫자판이 내려간다. 17, 16, 15. 아무도 버튼을 다시 누르지 않았다.',v:['넥타이를 풀 시간만 있었어도.','{c}이(가) 닫힘 버튼을 누르고 있었다.','{d}일째, 고작 18층에서.']};

 const close=()=>{if(from&&o.animate){const r=from.getBoundingClientRect(),W=innerWidth,H=innerHeight;const an=o.animate([{clipPath:'inset(0 0 0 0 round 0)'},{clipPath:`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 14px)`}],{duration:260,easing:'ease-in'});an.onfinish=()=>o.remove()}else o.remove();app.querySelectorAll('.ccard').forEach(x=>x.classList.remove('sel'))};

const CHNUM=['','1장','2장','3장','4장'];
function chapInfer(){const d=day();return d<=2?[1,'탈출']:d<13?[2,'은신처']:d===13?[3,'떠나는 날']:[4,'남쪽으로']}
function goalOf(){const c=st.chap||1,t=st.chapT||'',d=day(),dn=Math.max(0,13-d);const K=isKang();
 if(c===1)return K?(d<2?(F('gCalled')?'오늘 밤 넘길 곳 찾기':'빌딩에서 빠져나가기'):'강을 못 건넌다 · 머물 곳 찾기'):(d<2?'해 지기 전에 밤을 넘길 곳 찾기':'다리가 닫혔다 · 머물 곳 고르기');
 if(c===2)return t==='갇힌 날들'?'여기서 빠져나가기':`떠나는 날까지 버티기 · D-${dn}`;
 if(c===3)return '떠날지, 남을지 정하기';
 return {'남쪽으로':'평택 안전지대까지 가기','정오의 옥상':'정오에 헬기 타기','집으로':'부천, 엄마 집','남은 사람들':'이곳을 끝까지 지키기','약탈자의 트럭':'살아서 빠져나가기','미끼':'모두가 빠져나갈 시간 벌기'}[t]||'살아남기'}
const kt=t=>typeof kangText==='function'?kangText(t):t;
const shortLoc=l=>String(l||'').split(/ · | → /)[0];
const scLoc=()=>{const sc=S[st.scene];return sc?(typeof sc.loc==='function'?sc.loc(st):sc.loc||''):''};
function chapSnap(){return{sec:st.sec,loc:scLoc(),h:(st.hist||[]).length,dead:(F('deadN')||[]).length,hp:st.hp}}
function chapRecap(prev){const a=prev||{sec:0,h:0,dead:0,loc:''};const L=[];
 const d0=Math.floor(a.sec/86400)+1,d1=day();
 L.push(`${dateOf(d0)}${d1>d0?' – '+dateOf(d1):''} · ${d1-d0+1}일`+(a.loc?` · ${shortLoc(a.loc)}에서 ${shortLoc(scLoc())}까지`:''));
 const hs=(st.hist||[]).slice(a.h);const ju=hs.filter(x=>x.p!=null);const key=ju.length?ju[ju.length-1]:hs[hs.length-1];
 if(key)L.push(`${ju.length?'마지막 고비':'마지막 결정'} 「${key.t}」${key.p!=null?(key.ok?' — 성공':' — 실패'):''}`);
 const dead=(F('deadN')||[]).slice(a.dead);const w=withN();
 L.push((dead.length?`잃은 사람: ${dead.slice(-3).join(', ')}${dead.length>3?' 외':''} · `:'')+(w.length?`곁에: ${w.join(', ')}`:'곁에는 아무도 없다'));
 return L.map(kt)}
function showChap(n,t,recap){const o=document.createElement('div');o.className='chov';o.setAttribute('role','dialog');
 o.innerHTML=`<div class="chin"><span class="chn">${CHNUM[n]}</span><b class="cht pen">${esc(t)}</b><span class="chd">${esc(dateOf(day())+' · '+shortLoc(scLoc()))}</span>${recap?`<div class="chrc"><span class="chl">지난 장</span>${recap.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}<div class="chg"><span class="chl">목표</span><p>${esc(kt(goalOf()))}</p></div><button class="btn" id="chGo">시작</button></div>`;
 document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add('on'));
 const close=()=>{o.classList.remove('on');setTimeout(()=>o.remove(),250);document.removeEventListener('keydown',kd,true)};
 const kd=e=>{if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}};
 document.addEventListener('keydown',kd,true);o.onclick=close}

 const rc=chapRecap(st.chapAt);st.chap=n;st.chapT=t;st.chapAt=chapSnap();chapPend=[n,t,rc]}

function tagsOf(c){const out=[];const e=c.eff&&typeof c.eff==='object'?c.eff:{};const ok=c.okEff&&typeof c.okEff==='object'?c.okEff:{};
 const nm=k=>ITEMS[k]?ITEMS[k].n:k;
 const gv=[...new Set([].concat(e.give||[],ok.give||[]))];gv.forEach(k=>out.push(['g','＋'+nm(k)]));
 if(e.bag&&BAGS[e.bag])out.push(['g','＋'+BAGS[e.bag].n]);
 [].concat(e.take||[]).forEach(k=>out.push(['l','−'+nm(k)]));
 if(e.hp<0)out.push(['l','체력↓']);if(e.res<0)out.push(['l','식량↓']);if(e.men<=-6)out.push(['l','정신력↓']);
 if(e.hp>0)out.push(['g','체력↑']);if(e.res>0)out.push(['g','식량↑']);if(e.men>=6)out.push(['g','정신력↑']);
 if(c.adv>=60&&!st.crisis)out.push(['t','⏱ '+fmtMin(c.adv).slice(1)]);
 return out.slice(0,4)}

/* 「」 → “ ” (겹친 따옴표는 안쪽 ‘ ’) */
const isLabel=x=>x.length<=12&&!/[.?!…,~—]/.test(x)&&!/[「」]/.test(x);
function dqHTML(s,wrap){s=String(s);let out='',d=0,buf='',inner='';
 for(const ch of s){if(ch==='「'){if(d===0){out+=esc(buf);buf='';inner=''}else inner+='‘';d++}
  else if(ch==='」'&&d>0){d--;if(d===0){out+=isLabel(inner)?esc('「'+inner+'」'):(wrap?'<q class="dq">“'+esc(inner)+'”</q>':esc('“'+inner+'”'))}else inner+='’'}
  else if(d>0)inner+=ch;else buf+=ch}
 if(d>0)out+=esc('「'+inner);out+=esc(buf);return out}
function isDlg(p){if(p[0]!=='「'||p[p.length-1]!=='」')return false;let d=0;for(let i=0;i<p.length;i++){const c=p[i];if(c==='「')d++;else if(c==='」'){d--;if(d===0&&i<p.length-1)return false}}return d===0}
const dqText=s=>{const t=document.createElement('span');t.innerHTML=dqHTML(s,false);return t.textContent};
function paraHTML(p){let h=dqHTML(p,true).replace(/\{([^}]+)\}/g,'<span class="sfx in">$1</span>');
 /* 대사는 줄을 바꿔 시작하고, 대사 뒤 묘사도 다음 줄에서 (「…」라고 말했다 처럼 붙은 꼬리는 같은 줄) */
 h=h.replace(/<q class="dq">([^<]*)<\/q>((?:[.,!?…]+(?=\s|$))|(?:\s?(?:하며|하고|하는|하자|하더니|하곤|라고|라며|라는|이라고|이라며|이라는|란|를|을|은|는|이|가|와|과|도|만|로|고|며)(?=[\s가-힣,])[^.!?…<]*[.!?…]?)?)/g,(m,q,tail)=>`<span class="dqb"><q class="dq">${q}</q>${tail||''}</span>`);
 h=h.replace(/\s*(<span class="dqb">)/g,'$1').replace(/(<\/span>)\s+/g,'$1');
 return h}
textHTML=function(t){if(typeof t==='function')t=t(st);t=josa(t);return t.split(/\n\n+/).map(p=>{
 if(/^\{[^{}]+\}$/.test(p))return `<p class="sfx">${esc(p.slice(1,-1))}</p>`;
 if(p.startsWith('!'))return `<p class="em">${paraHTML(p.slice(1))}</p>`;
 if(isDlg(p))return `<p class="dl">${dqHTML(p,false)}</p>`;
 return `<p class="nar">${paraHTML(p)}</p>`}).join('')};

S.p_camp={loc:'평택 외곽 · 생존자 공터',
 text:'모닥불 가에 마흔쯤 된 사내. 화물차 기사였다고 했다. 「우리 새벽에 들어가. 트럭 둘로 정문까지 밀고 가서, 경적 울리면 문 열어 준대. 저번 주에 그렇게 들어간 사람들이 있어.」\n\n그가 당신을 본다. 「자리는 있어. 근데 짐칸 뒤에 매달려 가는 자리야. 아니면…」\n\n그가 남쪽 들판을 턱으로 가리킨다. 「누가 먼저 저쪽으로 소리를 내 주면, 트럭이 훨씬 편하게 가지.」',
 memo:{t:'자리냐 미끼냐'},
 choices:[
  {t:'트럭 짐칸에 매달려 간다',p:68,lethal:1,ok:'p_gate',okEff:{men:-4,flag:{campIn:1},fn:bj('새벽 5시 50분. 트럭이 들판을 갈랐다. 짐칸 난간에 매달린 손이 얼어붙었다. 정문 앞에서 경적 세 번. 문이 열렸다.')},fail:'death:siege',adv:600},
  {t:'트럭이 갈 수 있게 반대쪽에서 소리를 낸다',if:s=>s.hum>=40,p:62,lethal:1,ok:'p_gate',okEff:{hum:12,men:-8,flag:{campHero:1},fn:bj('냄비와 국자. 들판 반대편에서 미친 듯이 두드렸다. 놈들이 고개를 돌렸다. 트럭이 지나갔다. 둑을 따라 정문까지 기어갔다. 문 앞에서 트럭 기사가 손을 뻗고 있었다.')},fail:'death:siege',adv:600},

S.p_night={loc:'평택 외곽 · 들판, 밤',crisis:{name:'철조망',len:8,note:'탐조등이 돈다'},

  {t:'남자에게 다가가 상처를 봐 준다',p:55,phys:false,ok:'e_safe',okEff:{hum:8,fn:bj('「모기 물린 거예요.」 남자가 셔츠를 내렸다. 정말 모기였다. 11월에. 아내가 울었다. 군인이 당신 이름을 적었다.')},fail:'e_safe',failEff:{hp:-8,men:-6,fn:bj('셔츠 아래는 모기가 아니었다. 남자가 당신 손목을 잡았다. 군인들이 그를 끌어냈다. 손목의 손톱자국을 오래 보았다.',1)},adv:30},

  {t:'지하 주차장으로 돌아가 비상계단으로 올라간다',to:'yd_37',eff:{hp:-6,men:-2,flag:{kStairs:1},fn:bj('서른일곱 층. 매일 엘리베이터로 30초 걸리던 거리. 20층에서 한 번 토했다.')},adv:50}]};
S.yd_37={loc:'세진파이낸스타워 · 37층 운용본부',
 text:s=>'37층. 모니터들이 아직 켜져 있다. 시세판은 오전 9시에 멈춘 숫자 그대로.\n\n본부장실 유리벽 너머에 셋. 윤재석 본부장, 어깨에 별 셋을 단 수도방위사령관 반석규 중장, 그리고 3선 국회의원 채문혁. 텔레비전에서 보던 얼굴이다. 파쇄기가 돌아간다.\n\n{지이이잉—}\n\n「실사 보고서는 전부 갈아. 하드는 내가 가져간다. 명단은 312명, 18시 옥상.」 반 중장의 목소리다.\n\n본부장의 왼손에 붕대가 감겨 있다. 피가 배어 나온다.',
 memo:{t:'312명',warn:1},
 choices:[
  {t:'책상 밑에 숨어 끝까지 엿듣는다',p:65,phys:false,ok:'yd_vault',okEff:{flag:{kList:1},men:-4,fn:bj('「잠실 101동이랑 서울대병원 본관은 정오 픽업 계속 돌려. 투자자 단지랑 연구진은 다 빼야 돼.」 「나머지는요?」 「소독 작전.」 셋이 옥상으로 올라갔다. 파쇄기만 남았다.')},fail:'yd_confront',failEff:{men:-6,fn:bj('의자가 밀리는 소리. 채 의원이 당신을 봤다. 「누구야.」',1)},adv:30},
  {t:'문을 열고 들어간다',act:'유리문을 연다',say:'「본부장님, 저 왔습니다.」',to:'yd_confront',adv:5},
  {t:'복도 화재 경보를 울려 셋을 옥상으로 몰아낸다',p:60,ok:'yd_vault',okEff:{fn:bj('경보가 울렸다. 셋이 서류 가방을 챙겨 옥상 계단으로 뛰었다. 본부장실 문이 열린 채 남았다.')},fail:'yd_confront',failEff:{men:-4,fn:bj('경보가 울리지 않았다. 대신 본부장이 복도로 나왔다. 「강혁이?」',1)},adv:10}]};
S.yd_confront={loc:'세진파이낸스타워 · 본부장실',
 text:'본부장이 웃는다. 붕대 감은 손을 등 뒤로 숨기면서. 「잘 왔다. 진짜 왔네.」\n\n반 중장이 당신을 위아래로 훑는다. 채 의원은 파쇄기에 서류를 계속 넣는다. 의원 본인의 이름이 적힌 서류다.\n\n「강혁아, 너 명단에 없어. 근데 내가 넣어 줄 수 있다. 하드 들고 옥상 가자. 대신 오늘 본 거, 평생 입 닫는 거야.」'.split('강혁아').join('§K§아'),
 memo:{t:'입 닫는 값'},
 choices:[
  {t:'「서류부터 보여 주세요.」',p:60,phys:false,ok:'yd_vault',okEff:{flag:{kList:1,kDeal:1},fn:bj('본부장이 파일 하나를 던졌다. 「소개 우선순위 명단」. 투자자, 출자 기관, 국회 쪽 사람들, 연구진 가족. 세 번째 장 맨 위에 「채문혁」. 맨 아래에 볼펜으로 당신 이름이 적혔다. 셋이 먼저 옥상으로 올라갔다. 「금고는 네가 비워. 6시까지.」')},fail:'yd_roof',failEff:{men:-6,flag:{kDeal:1},fn:bj('「보긴 뭘 봐. 따라와.」 반 중장이 등을 밀었다.',1)},adv:20},
  {t:'받아들인다 — 하드를 들고 옥상으로 따라간다',to:'yd_roof',eff:{hum:-8,flag:{kDeal:1}},adv:30},
  {t:'파쇄기 옆 서류 가방을 낚아채 비상계단으로 뛴다',p:50,lethal:1,move:1,ok:'yd_escape',okEff:{flag:{kDocs:1},hp:-6,fn:bj('가방을 끌어안고 계단을 굴렀다. 위에서 총성 한 번. 벽에 구멍. 다시 쏘지는 않았다. 18시가 더 급했다.')},fail:'death:executed',adv:30}]};
S.yd_vault={loc:'세진파이낸스타워 · 본부장실 금고',
 text:s=>'본부장실. 파쇄기 입구에 반쯤 물린 서류 뭉치. 벽장 안에 금고. 여섯 자리 숫자.\n\n'+(F('kList')?'312명. 잠실 101동. 서울대병원 본관. 소독 작전. 들은 단어들이 머릿속에서 줄을 선다.\n\n':'')+'창밖으로 해가 기운다. 옥상에서 로터 시동 소리가 내려온다.',
 memo:{t:'여섯 자리'},
 choices:[
  {t:'금고 번호를 맞춘다 — 펀드 설정일, 본부장 생일, 영흥바이오 상장일',p:55,phys:false,mods:[[s=>F('kList'),10,'들은 내용']],ok:'yd_roofq',okEff:{flag:{kDocs:1},fn:bj('세 번째. 영흥바이오 상장일. 딸깍. 안에 실사 보고서 원본, 국방부 계약서 사본, 「손실 보전 확약서」, 외장하드 하나. 하드에 붙은 라벨. 「내부 메일 — 공시 지연 건」.')},fail:'yd_roofq',failEff:{men:-6,fn:s=>{F('kDocsHalf',1);s.banner={t:'다섯 번 틀렸다. 금고가 잠겼다. 파쇄기 입구에서 반쯤 갈린 서류만 건졌다. 구조도 반 장, 명단 두 장.',bad:1}}},adv:20},
  {t:'파쇄기에 물린 서류만 빼내 챙긴다',to:'yd_roofq',eff:{flag:{kDocsHalf:1},fn:bj('구조도 반 장, 명단 두 장. 종이 끝이 국수처럼 갈라져 있다. 그래도 이름은 읽힌다.')},adv:5}]};
S.yd_roofq={loc:'세진파이낸스타워 · 37층 비상계단',
 text:'계단참. 위로 가면 옥상, 헬기. 아래로 가면 밤의 여의도.\n\n{두두두두—}\n\n로터 소리가 계단을 타고 내려온다. 위쪽 문틈으로 바람이 들어온다. 누군가 명단을 부르는 목소리.',
 memo:{t:'위냐 아래냐'},
 choices:[
  {t:'옥상으로 올라간다',to:'yd_roof',adv:5},
  {t:'서류를 품고 아래로 내려간다',to:'yd_escape',eff:{men:-2},adv:40},
  {t:'37층 탕비실을 털고 아래로 내려간다',to:'yd_escape',eff:{give:['water','can','can'],men:-2,fn:bj('생수, 컵라면, 참치 캔. 회사 탕비실 서랍은 언제나 가득했다. 오늘에서야 그게 고마웠다.')},adv:50}]};
S.yd_roof={time:T(1,17,50),loc:'세진파이낸스타워 · 옥상 헬기장',
 text:s=>'옥상. 헬기 한 대가 로터를 돌린다. 반 중장이 클립보드를 들고 이름을 부른다. 채 의원이 맨 앞에 서 있다. 정장 차림 열 명쯤이 줄을 섰다.\n\n계단 쪽 문간에는 다른 사람들이 몰려 있다. 이 빌딩 경리팀, 청소 용역, 경비원. 명단에 없는 사람들. 경호원 둘이 그들을 막는다.\n\n'+(F('kDeal')?'본부장이 손짓한다. 붕대 감은 손으로. 「강혁아, 이리 와.」'.split('강혁아').join('§K§아'):'반 중장이 당신을 본다. 「명단에 없으면 내려가.」'),
 memo:{t:'312명',warn:1},
 choices:[
  {t:'줄에 선다 — 헬기에 오른다',if:s=>F('kDeal'),to:'end:kang_vip',eff:{hum:-6}},
  {t:'서류를 내밀며 자리를 흥정한다',if:s=>!F('kDeal')&&(F('kDocs')||F('kDocsHalf')),p:60,phys:false,ok:'end:kang_vip',okEff:{fn:s=>F('kSold',1)},fail:'yd_escape',failEff:{hp:-10,fn:s=>{F('kDocs',0);F('kDocsHalf',0);s.banner={t:'반 중장이 서류를 빼앗았다. 「고맙네.」 경호원이 당신을 계단 쪽으로 밀었다. 손에 남은 건 없다.',bad:1}}},adv:10},
  {t:'내 자리를 문간의 경리팀 막내에게 준다',if:s=>F('kDeal'),to:'yd_escape',eff:{hum:15,men:6,fn:bj('「이 사람 대신 태워요. 제 자리.」 반 중장은 어깨를 으쓱했다. 숫자만 맞으면 됐다. 막내가 울면서 헬기에 올랐다. 본부장의 얼굴은 보지 않았다.')},adv:10},
  {t:'본부장의 붕대를 가리키며 외친다 — 「저 사람 물렸어요!」',p:60,phys:false,ok:'yd_escape',okEff:{hum:4,men:-6,fn:bj('반 중장이 본부장의 붕대를 풀었다. 반달 모양 이빨 자국. 경호원이 본부장을 끌어냈다. 소란 틈에 문간 사람들이 헬기로 몰렸다. 당신은 계단으로 돌아섰다.')},fail:'yd_escape',failEff:{hp:-12,fn:bj('경호원의 주먹이 먼저였다. 계단참까지 굴렀다.',1)},adv:10},
  {t:'돌아서서 계단으로 내려간다',to:'yd_escape',eff:{men:-4},adv:10}]};
S.yd_escape={time:T(1,19,0),loc:'여의도 · 밤',
 text:s=>'헬기가 남쪽으로 사라졌다. 여의도의 불이 하나씩 꺼진다.\n\n18시가 지났다. 다리가 모두 닫혔다. 마포대교 위에서 총소리가 났다가 멎었다. 다리를 못 건넌 사람들이 섬으로 쏟아져 들어온다. 그들 중 몇은 걷는 게 아니다.\n\n'+(F('kDocs')?'가방 안에 보고서와 하드. 무게가 이상하게 가볍다.':F('kDocsHalf')?'주머니 속에 반쯤 갈린 종이 몇 장.':'빈손이다.'),
 memo:{t:'이제 어디로'},
 choices:[
  {t:'방송국 비상 송출실로 간다 — 이걸 세상에 내보낸다',if:s=>F('kDocs')||F('kDocsHalf'),to:'yd_tv',adv:30},
  {t:'여의도공원 지하 주차장에 숨어 밤을 넘긴다',to:'yd_night',adv:30},
  {t:'지하 상가 편의점을 털고 간다',once:'yMart',p:65,ok:'yd_escape',okEff:{give:['can','water'],res:6},fail:'yd_escape',failEff:{hp:-12,fn:bj('계산대 뒤에 점원 조끼를 입은 것이 웅크리고 있었다. 팔을 긁히고 빈손으로 뛰쳐나왔다.',1)},adv:40},
  {t:'샛강다리를 건너 곧장 남쪽으로 걷는다',p:55,lethal:1,move:1,ok:'yd_south',okEff:{men:-6},fail:'death:siege',adv:180}]};
S.yd_tv={loc:'방송국 본관 · 지하 비상 송출실',
 text:s=>'지하 2층. 비상 송출실. 모니터 여섯 개에 같은 화면. 「재난 방송 — 실내에 머무르십시오」. 녹화된 앵커가 같은 문장을 반복한다.\n\n'+(F('kTvKnown')?'낮에 본 중계차 엔지니어다. ':'')+'송출실 안에 남자 하나. 사흘째 못 잤다는 얼굴. 「송 피디라고 불러요. 뭘 들고 왔죠?」\n\n당신이 서류를 펼친다. 그가 한참 읽는다. 「…이거, 내보내면 군이 30분 안에 와요.」',
 memo:{t:'30분',warn:1},
 choices:[
  {t:'내보낸다 — 카메라 앞에 앉는다',p:60,phys:false,mods:[[s=>F('kDocs'),10,'원본 서류'],[s=>F('kList'),10,'들은 내용']],ok:'end:kang_broadcast',fail:'yd_night',failEff:{men:-8,fn:bj('송출 직전 전원이 내려갔다. 발전기실 쪽에서 비명. 송 피디가 하드 사본만 받아 들고 말했다. 「언젠가 내보낼게요. 가요, 빨리.」',1)},adv:30},
  {t:'사본을 송 피디에게 맡기고 남쪽으로 간다',to:'yd_night',eff:{flag:{kCopy:1},men:4,fn:bj('「살아서 평택까지 가요. 거기서 원본을 터뜨려요. 여기선 내가 기회를 볼게요.」 송 피디가 하드를 복사하는 동안 발전기가 두 번 꺼졌다 켜졌다.')},adv:60}]};
S.yd_night={time:T(1,22,0),loc:'여의도공원 · 지하 주차장',
 text:'지하 주차장 맨 아래층. 버려진 차들 사이. 출입구 셔터는 반쯤 내려가 있다.\n\n자정 무렵 셔터 밑으로 손전등 빛. 사람 셋. 증권사 로고가 박힌 패딩. 같은 업계 사람들이다.\n\n「세진 사람이죠? 그 가방… 오늘 옥상 헬기, 당신네 건물이었잖아요.」',
 memo:{t:'같은 업계',warn:1},
 choices:[
  {t:'헬기와 명단 이야기를 털어놓는다',p:60,phys:false,ok:'yd_south',okEff:{hum:6,men:4,give:'can',flag:{kAllies:1},fn:bj('셋은 오래 말이 없었다. 그중 하나가 말했다. 「우리 회사도 그 펀드에 들어가 있어요.」 새벽까지 같이 지켰다. 아무도 가방에 손대지 않았다.')},fail:'yd_south',failEff:{hp:-10,fn:s=>{loseRandom(1);s.banner={t:'믿은 게 실수였다. 새벽에 깨 보니 셋은 없었다. 물건 하나도.',bad:1}}},adv:420},
  {t:'모른다고 하고 차 안에서 밤을 넘긴다',to:'yd_south',eff:{men:-4},adv:420}]};
S.yd_south={time:T(2,6,30),loc:'샛강다리 · 새벽',crisisEnd:1,
 text:s=>'새벽. 샛강다리 위. 뒤로 여의도의 빌딩들이 검게 서 있다. 37층 창문만 아직 불이 켜져 있다. 발전기가 아직 돈다.\n\n남쪽으로. 노량진, 사당, 과천. 그리고 산을 넘는다. 평택까지 70킬로미터.'+(F('kDocs')?'\n\n가방은 앞으로 멨다. 잠들 때도 끌어안을 것이다.':''),
 memo:{t:'평택까지 들고 간다'},
 choices:[{t:'걷는다',to:s=>startLeg('yd','e_mount'),adv:20}]};
LEG.yd=[{n:'여의도 → 노량진',km:5,x:'노량진 수산시장 앞. 수조가 깨져 길바닥에 물고기가 말라 있다. 냉동 창고 문이 열려 있다. 안쪽 선반에 건어물 상자가 남았다. 육교 위에서 누군가 이쪽을 본다. 사람인지 아닌지는 모르겠다.'},
 {n:'노량진 → 사당',km:8,x:'동작대로를 따라 남쪽으로. 국립묘지 담장이 끝없이 이어진다. 묘지 안은 조용하다. 여기 누운 사람들은 일어나지 않는다.'},
 {n:'사당 → 과천',km:9,x:'남태령 고개. 군 트럭 한 대가 길을 막고 옆으로 누워 있다. 화물칸 방수포 아래로 군화가 삐져나와 있다. 과천 너머로 청계산이 보인다.'}];

/* ---------- 떠나는 날의 여의도 (늦은 길) ---------- */
S.yd_late={loc:'2호선 당산철교 · 선로',crisisEnd:1,
 text:'새벽. 합정역 승강장 끝에서 선로로 내려섰다. 당산철교. 열차가 끊긴 지 2주, 침목 사이로 검은 강물이 보인다.\n\n철교 중간쯤에 멈춘 전동차 한 편성. 문이 전부 열려 있다. 그 안을 지나가야 한다.\n\n{덜컹… 덜컹…}\n\n바람에 문이 흔들린다. 바람만은 아닐 수도 있다.',
 memo:{t:'열린 문 사이로',warn:1},
 choices:[
  {t:'철교 아래 교각 점검 통로로 돌아간다',to:'yd_late2',eff:{men:-8,hp:-4,fn:bj('녹슨 사다리, 강바람, 손가락 감각이 없어질 때까지. 두 시간. 전동차 아래를 지날 때 위에서 무언가 바닥을 긁었다.')},adv:150},
  {t:'전동차 안을 지나간다',p:70,lethal:1,move:1,ok:'yd_late2',okEff:{men:-6},fail:'death:bite',adv:40},

S.yd_late2={loc:'세진파이낸스타워 · 37층',
 text:s=>'여의도는 2주 전에 끝났다. 거리마다 출입증 목줄을 단 것들이 서성인다. 비상계단으로 서른일곱 층.\n\n본부장실. 파쇄기는 멈췄고, 금고 문은 열려 있다. 안은 반쯤 비었다. 보고서 원본은 남아 있다. 하드는 없다.\n\n본부장실 의자에 윤재석 본부장이 앉아 있다. 넥타이로 손목이 의자에 묶여 있다. 눈이 하얗다. 붕대 감긴 왼손. 책상 위에 클립보드. 「소개 우선순위 명단 — 312명」. 그의 이름에 두 줄이 그어져 있다.',

E.kang_vip={n:'명단의 이름',hid:1,t:s=>'헬기 문이 닫혔다. 옥상이 작아지고, 여의도가 작아지고, 강 건너 불타는 강북이 작아졌다.\n\n'+(F('kSold')?'서류는 반 중장의 가방 안에 있다. 채 의원이 그 가방을 무릎 위에 올려놓는다. 당신 이름은 클립보드 맨 아래, 볼펜으로.':'옆자리 본부장이 붕대 감은 손을 무릎 위에 올려놓는다. 아무도 그 손을 보지 않는다.')+'\n\n안전지대 VIP 구역. 따뜻한 물, 하얀 시트, 서명할 서류 한 장. 「비밀 유지 서약서」. 서명했다.\n\n'+dateOf(day())+'. 312명 중 하나. 나머지 몇백만 명은 숫자에 들어가지 않았다.'};
E.kang_broadcast={n:'송출',hid:1,t:s=>'카메라의 빨간 불이 켜졌다. 「저는 세진자산운용 펀드매니저 도§K§입니다.」\n\n구조도, 계약서, 손실 보전 확약서, 312명의 명단. 정오의 헬기가 누구를 태웠는지. 소독 작전이 무엇을 지우는지. 18분 동안 읽었다.\n\n{쾅. 쾅. 쾅.}\n\n송출실 문을 두드리는 소리. 군화인지 놈들인지 모른다. 송 피디가 엄지를 들었다. 송출은 계속된다. 녹화본이 반복된다.\n\n그날 밤, 평택의 천막에서, 강북의 지하철역에서, 성당의 종탑에서, 라디오를 가진 모든 사람이 같은 목소리를 들었다.\n\n'+dateOf(day())+'. 처음으로, 숫자가 아니라 이름을 불렀다.'};
E.kang_deal={n:'두 번째 계약',hid:1,t:s=>'군의관은 서류를 오래 읽었다. 그리고 누군가에게 무전을 쳤다.\n\n한 시간 뒤, 당신은 검역 천막이 아니라 관리동 2층 사무실에 있었다. 「재건 기금 운용 자문역」. 명함이 새로 나왔다.\n\n창밖으로 정문 대기선이 보인다. 노란 선 앞에 줄이 길다. 체온계, 손전등, 격리 천막. 당신의 서명이 그 줄의 예산을 정한다.\n\n'+dateOf(day())+'. 손실은 나라가 메운다. 언제나 그랬다.'};
E.kang_expose={n:'옵서버',t:s=>'외국인은 서류를 펜스 너머로 받아 셔츠 안에 넣었다. 「Thank you.」 그리고 사라졌다.\n\n검역 천막에서 48시간. 나온 날, 안전지대 게시판에 영자 신문 한 장이 붙어 있었다. 사진 한 장, 구조도 한 장, 이름 312개.\n\n누군가 그 위에 매직으로 크게 적었다. 「우리는 숫자가 아니다」.\n\n'+(F('kCopy')?'그날 밤 라디오에서 여의도 송출실의 녹음이 흘러나왔다. 송 피디의 목소리였다. 「약속 지켰어요.」\n\n':'')+dateOf(day())+'. 처음으로 남의 돈이 아니라 내 이름을 걸었다.'};

S.sd_1={loc:'성수동 물류센터 · 냉장실 앞',crisisEnd:1,

 text:'— 일지. 장갑을 나눠 줬다. 수산시장에서 털어 온 빨간 고무장갑. 피가 묻어도 티가 나지 않는다.\n\n규칙은 셋. 아이는 건드리지 않는다. 우리끼리는 훔치지 않는다. 남자는, 쓸모로 판단한다.\n\n지혜가 칼을 배운다. 빠르다. 돼지 사체로 연습시켰다. 경동맥, 대퇴동맥, 겨드랑이. 사흘 만에 지혜는 눈을 감고도 찾았다.\n\n트럭 두 대, 열한 명. 먹을 게 열흘 치. 열흘 뒤엔 누군가를 털어야 한다.',

S.sd_2a={loc:'중랑천 고물상 · 새벽',
 text:'「고물상파」. 남자 열넷. 고물상 창고에 여자들을 가둬 두고 지나가는 무리에 「빌려준다」는 놈들.\n\n새벽 4시. 창고 2층에서 웃음소리. 문틈으로 본다. 매트리스, 벽의 쇠사슬, 빈 고리. 바닥에 굽이 부러진 여자 구두 한 짝.\n\n「오늘 들어온 거, 내가 먼저다.」\n\n아래층 컨테이너에서 우는 소리. 지혜가 당신 손목을 잡는다. 손이 얼음장이다.\n\n열한 켤레의 빨간 장갑이 당신을 본다.',

 choices:[
  {t:'자는 놈부터 하나씩 — 아무도 소리 내지 못하게',p:60,ok:'sd_2b',okEff:{hum:-14,men:-8,res:15,flag:{sdGomul:1},fn:s=>{F('killedHuman',1);s.banner={t:'목을 막고 찌른다. 다음. 다음. 2층의 웃던 놈은 바지를 반쯤 내린 채 죽었다. 열넷. 지혜가 장부에 숫자를 적었다. 컨테이너 문을 열자 여자 셋이 당신을 보고 비명을 질렀다. 장갑에서 피가 떨어지고 있었다.',bad:1}}},fail:'sd_2b',failEff:{hp:-18,add:'bleed',hum:-14,flag:{sdGomul:1},fn:s=>{F('sdLoss',(F('sdLoss')||0)+2);F('killedHuman',1);s.banner={t:'하나가 깨어 소리를 질렀다. 그다음은 난장판이었다. 쇠파이프, 비명, 불. 둘을 잃었다. 놈들은 열넷 다 죽었다. 마지막 하나는 당신이 직접 했다. 그가 살려 달라고 빌었다. 다 듣고 나서 했다.',bad:1}}},adv:120},
  {t:'창고에 불을 지른다 — 컨테이너만 먼저 열고',p:70,ok:'sd_2b',okEff:{hum:-18,men:-10,res:8,flag:{sdGomul:1,sdFire:1},fn:s=>{F('killedHuman',1);s.banner={t:'컨테이너의 여자 셋을 꺼낸 뒤 휘발유를 부었다. 2층 창문으로 뛰어내린 놈들은 지혜와 장갑들이 기다리고 있었다. 타는 냄새가 사흘 동안 옷에서 빠지지 않았다.',bad:1}}},fail:'sd_2b',failEff:{hum:-20,men:-14,flag:{sdGomul:1,sdFire:1},fn:s=>{F('killedHuman',1);s.banner={t:'불이 생각보다 빨랐다. 컨테이너 문을 다 열지 못했다. 안에서 문을 두드리는 소리가 불길 너머로 들렸다. 여자 목소리였다. 아무도 그 얘기를 하지 않았다.',bad:1}}},adv:90}]};
afterDays('sd_2a',2,4);
S.sd_2b={loc:'성수동 물류센터 · 냉장실',crisisEnd:1,
 text:'고물상파 놈 하나를 살려 왔다. 일부러. 비축 창고가 어디 있는지 아는 놈이다.\n\n의자에 묶었다. 그가 침을 뱉는다. 「여자들끼리 뭘 하겠다고.」\n\n당신은 대답 대신 장갑을 고쳐 낀다. 사람 몸 어디를 누르면 가장 아픈지 안다. 어디까지 가면 기절하고, 어디서 멈추면 깨어 있는지도. 응급실에서 매일 배운 것들이다. 그때는 반대 방향으로 썼다.',
 memo:{t:'어디서 멈출지 안다',warn:1},
 choices:[
  {t:'천천히 한다 — 기절하지 않게',to:'sd_3',eff:{hum:-14,men:-10,res:20,give:['antibiotic','can','can'],flag:{sdTorture:1},fn:bj('그는 열한 번째에 말했다. 창고 위치, 열쇠, 보초 수. 열두 번째는 필요 없었다. 그래도 했다. 지혜가 보고 있었다. 지혜가 배워야 했다. 창고엔 쌀 서른 포대와 항생제가 있었다. 그는 다음 날 아침 냉장실에서 숨이 멎은 채 발견됐다. 장부에는 「사인: 협조 후 쇼크」.')},adv:180},
  {t:'지혜에게 맡긴다 — 「배운 대로 해.」',to:'sd_3',eff:{hum:-10,men:-6,res:15,give:['can','can'],flag:{sdTorture:1,sdJihyeTorture:1},fn:bj('지혜는 당신보다 오래 걸렸다. 당신보다 덜 망설였다. 냉장실에서 나온 지혜가 장갑을 벗으며 말했다. 「언니. 생각보다 쉬워요.」 그 말이 오래 귀에 남았다.')},adv:180}]};
const SD_HUB={mart:['마트','오 실장의 보안팀은 이제 셋뿐이다. 계산대 뒤에서 준호가 당신을 알아본다.','준호'],station:['서울숲역','4번 출구 셔터. 한 계장이 명단을 쥐고 서 있다. 당신을 알아본다.','한 계장'],church:['금호동 성당','종탑 아래 데레사 수녀가 서 있다. 당신을 알아본다.','데레사 수녀']};
const sdH=()=>SD_HUB[F('hub')||'mart']||SD_HUB.mart;
S.sd_3={loc:s=>sdH()[0]+' · 정문',
 text:s=>'새벽 3시. 트럭 네 대의 헤드라이트. 장갑 낀 손들이 셔터에 갈고리를 건다.\n\n{끼이이익—}\n\n'+sdH()[1]+'\n\n「…선생님?」\n\n2주 전, 당신이 상처를 꿰매 준 손이 떨린다.\n\n안쪽에 사람 예순. 남자 스물둘. 루크그룹이라는 곳이 남자 하나에 항생제 두 통을 쳐준다는 소문을 들었다. 당신 트럭엔 항생제가 바닥났다.',
 memo:{t:'남자 스물둘',warn:1},
 choices:[
  {t:'남자들을 줄 세워 분류한다 — 응급실처럼',to:'sd_3b',eff:{hum:-18,men:-8,res:20,give:['antibiotic','antibiotic'],flag:{sdSold:1},fn:s=>{s.banner={t:josa('빨간 표, 노란 표, 검은 표. 손가락으로 하나씩 짚었다. 「쓸모」를 매기는 손이 응급실에서 중증도를 매기던 그 손이었다. 빨간 표 열넷은 루크그룹 트럭에 실었다. 검은 표 다섯은 그 자리에서. 노란 표는 놓아줬다. '+sdH()[2]+'은(는) 끝까지 당신을 봤다.'),bad:1}}},adv:180},
  {t:'식량과 여자들만 데려간다 — 「선택은 그들이 해요.」',to:'sd_3b',eff:{hum:-8,res:20,flag:{sdRecruit:1},fn:bj('다섯이 따라왔다. 둘은 자기 발로, 셋은 반쯤 떠밀려. 그중 하나의 남편이 트럭을 막아섰다. 지혜가 그를 눕혔다. 아내는 짐칸에서 그를 보지 않았다. 보지 못했다.',1)},adv:150},
  {t:'식량만 싣고, 아무도 다치지 않게 한다',to:'sd_3b',eff:{hum:4,res:20,fn:s=>{F('sdMercy',1);s.banner={t:josa(sdH()[2]+'은(는) 끝까지 당신을 봤다. 지혜가 묻는다. 「왜 봐줘요?」 대답하지 않았다.')}}},adv:120}]};
afterDays('sd_3',4,3);
S.sd_3b={loc:'성수동 물류센터 · 하역장',crisisEnd:1,
 text:'— 일지. 스물여섯.\n\n은정이 밤마다 사라진다는 보고. 따라가 보니 둑 너머 남자 무리와 만나고 있었다. 우리 쌀 두 포대와 그들의 담배를 바꾸고 있었다. 그 남자 중 하나가 은정의 허리를 끌어안았다. 은정은 웃었다.\n\n다음 날 아침. 하역장 한가운데 은정이 무릎을 꿇었다. 스물다섯이 둘러섰다.\n\n「우리끼리는 훔치지 않는다.」 당신이 만든 규칙이다.',
 memo:{t:'규칙은 셋',warn:1},
 choices:[
  {t:'장갑을 벗기고, 다시는 장갑을 낄 수 없게 한다',to:'sd_4',eff:{hum:-14,men:-8,flag:{sdHands:1},fn:bj('「장갑을 낄 손이 없으면, 붉은 장갑이 아니야.」 망치는 지혜가 들었다. 당신은 지혈대를 맸다. 그녀가 죽지 않게. 살아서 모두에게 보이게. 은정은 그날 오후 정문 밖으로 내보내졌다. 두 손을 가슴에 안고. 아무도 배웅하지 않았다.')},adv:60},
  {t:'모두 앞에서 직접 끝낸다',to:'sd_4',eff:{hum:-16,men:-10,flag:{sdExec:1},fn:s=>{F('killedHuman',1);s.banner={t:'은정이 마지막에 당신 이름을 불렀다. 진짜 이름을. 「서윤 언니.」 메스는 정확했다. 스물다섯 중 아무도 고개를 돌리지 않았다. 돌리지 못했다.',bad:1}}},adv:30},
  {t:'쌀 두 포대만 갚게 하고 넘어간다',to:'sd_4',eff:{hum:4,flag:{sdSoft:1},fn:bj('하역장이 술렁였다. 「규칙이 셋이라며.」 누군가 들리게 말했다. 지혜가 그 사람을 노려봤다. 그날 밤 지혜가 당신 방 문 앞에 오래 서 있다 갔다.',1)},adv:30}]};
afterDays('sd_3b',3,9);
S.sd_4={loc:'성수동 물류센터 · 의무실',crisisEnd:1,
 text:s=>'— 일지. 「붉은 장갑」 서른하나. 트럭 여섯. 강북 약탈자 무리 둘이 무릎을 꿇었다. 하나는 꿇지 않았다. 그 무리의 이름은 이제 아무도 부르지 않는다.\n\n의무실 침대에 지혜가 누워 있다. 어젯밤 총알이 허벅지를 뚫었다. 상처가 벌써 부어오른다. 항생제는 한 통.\n\n옆 침대엔 오늘 데려온 여섯 살 아이. 열이 끓는다. 폐렴이다. 이 아이의 엄마는 '+(F('sdSold')?'당신이 검은 표를 붙인 남자 중 하나의 아내였다.':'어제 트럭에서 당신에게 아이를 맡기고 사라졌다.')+'\n\n당신은 간호사다. 누구에게 쓸지 안다. 누구에게 쓰면 「붉은 장갑」에 이로운지도.',
 memo:{t:'한 통',warn:1},
 choices:[
  {t:'항생제를 지혜에게 쓴다 — 조직이 먼저다',to:'sd_4b',eff:{hum:-10,flag:{sdJihye:1},fn:bj('지혜의 열이 내렸다. 아이는 사흘을 더 버텼다. 마지막 밤, 아이가 당신 장갑을 잡고 「엄마」라고 불렀다. 장갑을 빼서 쥐여 줬다. 아침에 장갑은 아이 손에 그대로 있었다. 아이는 아니었다.')},adv:60},
  {t:'항생제를 아이에게 쓴다',to:'sd_4b',eff:{hum:6,flag:{sdKid:1},fn:bj('아이는 살았다. 지혜의 다리는 사흘 뒤에 검게 변했다. 무릎 위를 잘랐다. 당신이 잘랐다. 마취제는 없었다. 지혜는 한 번도 소리 지르지 않았다. 끝나고 나서, 당신을 보지 않았다. 그 뒤로도.',1)},adv:60}]};
afterDays('sd_4',4,21);
S.sd_4b={loc:'중랑천 상류 · 송정동 배수지',
 text:'— 일지. 서른여덟. 그런데 송정동 「농장」만은 무릎을 꿇지 않는다. 남자 마흔, 여자 스물. 비닐하우스와 배수지. 강북에서 유일하게 깨끗한 물이 나오는 곳이다.\n\n세 번 사람을 보냈다. 세 번 다 목만 돌아왔다.\n\n지혜가 약품 창고에서 꺼낸 병 세 개를 당신 앞에 놓는다. 라벨은 당신이 읽을 줄 안다. 지혜도 이제 읽을 줄 안다. 당신이 가르쳤다.\n\n「배수지에 풀면 사흘이에요. 그다음엔 농장이 우리 거예요.」\n\n그 농장엔 여자 스물이 있다. 당신이 구하겠다고 한 사람들이다.',
 memo:{t:'구할 수 없는 사람들',warn:1},
 choices:[
  {t:'푼다',to:'sd_5',eff:{hum:-24,men:-14,res:30,flag:{sdPoison:1},fn:s=>{F('killedHuman',1);s.banner={t:'나흘째 아침 농장에 들어갔다. 비닐하우스 사이에 사람들이 누워 있었다. 대부분은 움직이지 않았다. 몇은 기어서 물통 쪽으로 가고 있었다. 장부에 적었다. 「송정동 확보. 손실: 구할 수 없는 사람들.」 숫자는 적지 않았다. 세지 않았다.',bad:1}}},adv:120},
  {t:'병을 깨뜨린다 — 「이건 아니야.」',to:'sd_5',eff:{hum:8,men:-6,flag:{sdNoPoison:1},fn:bj('유리가 바닥에 튀었다. 지혜가 깨진 병과 당신 얼굴을 번갈아 봤다. 「언니가 가르쳐 놓고.」 그날 밤 장갑 열 켤레가 의무실 대신 지혜의 방 앞에 모여 있었다.',1)},adv:30},
  {t:'농장을 정면으로 친다',p:50,ok:'sd_5',okEff:{hum:-12,res:25,flag:{sdFarm:1},fn:s=>{F('killedHuman',1);s.banner={t:'이틀 밤낮. 비닐하우스가 불탔다. 마흔의 남자는 셋 남았다. 여자 스물 중 열둘이 붉은 장갑이 됐다. 나머지 여덟은 장갑을 거부했다. 그 여덟을 어떻게 했는지 장부엔 없다.',bad:1}}},fail:'sd_5',failEff:{hp:-25,add:'bleed',hum:-8,fn:s=>{F('sdLoss',(F('sdLoss')||0)+8);s.banner={t:'여덟을 잃었다. 농장은 무너지지 않았다. 돌아오는 트럭에서 아무도 당신 옆에 앉지 않았다.',bad:1}}},adv:300}]};
afterDays('sd_4b',5,2);
S.sd_5={loc:'성수동 물류센터 · 옥상',
 text:s=>'— 일지. 마흔넷. 트럭 아홉. 강북 다리 북단 전부가 우리 통행세를 받는다. 장부의 마지막 장엔 숫자가 아니라 이름만 적혀 있다. 우리가 구한 여자들. 그 위 장들엔 숫자만 적혀 있다. 우리가 죽인 사람들.\n\n오늘 아침 군용 지프 한 대가 백기를 달고 왔다. 소령 하나. 「수도방위사령부 제안입니다. 강북 치안 협력. 보급을 드리죠. 대신 북쪽에서 내려오는 피난민 행렬을… 정리해 주십시오.」\n\n옥상 난간에 지혜가 기대 서 있다. '+(F('sdJihye')?'목발 없이.':'목발을 짚고.')+' 그녀 허리에 메스가 꽂혀 있다. 당신이 준 것이다. 그 뒤에 장갑 열둘이 서 있다. 당신이 아니라 지혜 뒤에.',
 memo:{t:'왕관이냐 칼이냐',warn:1},
 choices:[
  {t:'군의 제안을 받는다 — 강북의 질서는 우리가 정한다',to:s=>darkEndS('crown')},
  {t:'군을 쫓아내고 우리 방식대로 계속 휩쓴다',to:s=>darkEndS('raid')},
  {t:'지혜에게 장갑을 넘기고 혼자 떠난다',to:s=>darkEndS('leave')}]};
afterDays('sd_5',6,9);
function darkEndS(k){const bad=(k==='raid'?.4:k==='crown'?.25:.15)+(F('sdKid')&&!F('sdJihye')?.3:0)+(F('sdNoPoison')?.2:0)+(F('sdSoft')?.15:0)+(F('sdJihyeTorture')?.1:0)-(F('sdJihye')?.15:0)-(F('sdExec')?.1:0);return Math.random()<bad?'end:dark_fall_s':(k==='leave'?'end:dark_leave_s':'end:dark_queen')}
E.dark_queen={n:DARK+'붉은 장갑',hid:1,t:s=>'강북에는 이제 법이 셋 있다. 아이는 건드리지 않는다. 우리끼리는 훔치지 않는다. 남자는, 쓸모로 판단한다.\n\n다리 북단마다 빨간 고무장갑이 깃발처럼 걸려 있다. 피난민들은 장갑을 보면 무릎을 꿇고 가진 것을 내놓는다. 남자들은 줄을 선다. 빨간 표, 노란 표, 검은 표. 표를 매기는 건 이제 지혜다. 당신이 가르친 손가락으로.\n\n'+(F('sdPoison')?'송정동 배수지 물은 아직 아무도 마시지 않는다. 비닐하우스 사이에 하얀 뼈들이 그대로 있다. 치우라고 하지 않았다. 다들 그걸 보고 무릎을 꿇는다.\n\n':'')+'가끔 꿈을 꾼다. 응급실, 3번 베드, 06시 06분. 그날 아침의 당신이 지금의 당신을 본다. 깨어나면 장갑을 낀다.\n\n'+dateOf(day())+'. 강북의 여왕. 아무도 그 이름으로 부르지 않는다. 다들 그냥 「선생님」이라고 부른다. 처음 당신을 그렇게 부르던 사람들은 다 죽었다.'};
E.dark_fall_s={n:DARK+'같은 칼',hid:1,t:s=>'새벽. 의무실 침대. 눈을 떴을 때 목에 차가운 것이 닿아 있었다.\n\n지혜다. '+(F('sdKid')&&!F('sdJihye')?'잘린 다리를 의자에 걸친 채. ':'')+'당신이 준 메스. 당신이 가르친 각도. 귀 밑, 정확히. 그 뒤에 장갑 열둘이 서 있다. 아무도 눈을 피하지 않는다.\n\n「언니가 그랬잖아요. 남자든 여자든, 쓸모로 판단한다고.」\n\n'+(F('sdNoPoison')?'「병 깨뜨린 날부터 정했어요. 언니는 이제 쓸모가 없어요.」':F('sdSoft')?'「은정이 때부터 정했어요. 규칙을 안 지키는 사람은 규칙을 만들 수 없어요.」':'「언니는 너무 많이 알아요. 우리가 뭘 했는지 전부.」')+'\n\n「사장」의 침대에서 했던 그대로였다. 그는 눈을 뜨지 않았다. 당신은 떴다. 그게 유일한 차이였다.\n\n'+dateOf(day())+'. 「붉은 장갑」은 다음 날 새 우두머리를 맞았다. 장부의 마지막 장, 구한 여자들 이름 목록에서 당신 이름이 두 줄로 그어졌다. 앞장의 숫자들 사이에 하나가 더해졌다.'};
E.dark_leave_s={n:DARK+'벗은 장갑',hid:1,t:s=>'장갑을 지혜의 손에 쥐여 주었다. 「이제 네 거야.」 지혜는 아무것도 묻지 않았다. 묻지 않아도 이미 지혜 것이었다.\n\n새벽에 혼자 다리를 건넜다. 다리 북단의 장갑들이 당신을 알아보고 길을 텄다. 그 옆에 피난민 남자들이 줄 서 있었다. 표를 붙이는 젊은 여자가 당신을 보고 고개를 숙였다. 스물쯤. 당신이 가르친 손가락이었다.\n\n남쪽 어딘가에서 다시 간호사가 될 수 있을까. 손을 씻었다. 씻고, 또 씻었다. 손톱 밑의 색은 빠지지 않았다.\n\n'+dateOf(day())+'. 강북에는 여전히 법이 셋 있다. 이제 다른 사람이 지킨다. 당신보다 잘.'};

const kdC={t:'채문혁 의원실로 전화를 건다 — 「서류는 제가 갖고 있습니다.」',act:'채문혁 의원실로 전화를 건다',say:'「서류는 제가 갖고 있습니다.」',if:kdOK,to:'kd_1',eff:{hum:-6}};
